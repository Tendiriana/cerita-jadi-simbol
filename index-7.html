<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cerita Jadi Simbol</title>
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Tampilan bersih dan modern: latar abu kebiruan, kartu putih, satu aksen teal.
   Warna paling kuat dipakai untuk simbol besaran (m, h, g, ?), karena itu inti aplikasi. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EDF0F4; --ink:#18212B; --ink2:#5A6675; --line:#E1E6EC; --line2:#C5CED8;
  --acc:#0F6E6A; --acc-ink:#FFFFFF; --acc-soft:#E1F0EE; --raise:#FFFFFF;
  --hl:#FFE27A; --hl-ink:#18212B;
  --q1:#2563EB; --q2:#0E8F63; --q3:#C2650A; --q4:#7445D6; --ask:#C92A63;
  --ok:#11804C; --okbg:#E4F4EB; --bad:#BE3420; --badbg:#FCEBE7; --info:#2459C9; --infobg:#E9F0FD;
  --shadow:0 1px 2px rgba(24,33,43,.06);
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:var(--f-body);
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#161D24; --sunk:#1B232C; --ink:#E6EBF0; --ink2:#98A5B3; --line:#252F3A; --line2:#3A4654;
  --acc:#3BBFB2; --acc-ink:#08201E; --acc-soft:#123331; --raise:#2A3541;
  --hl:#E9C64B; --hl-ink:#14191F;
  --q1:#7AA7FF; --q2:#3CCB95; --q3:#F59E4E; --q4:#B596FF; --ask:#FF7AA8;
  --ok:#4CC38A; --okbg:#122E1F; --bad:#FF8B76; --badbg:#3A1C17; --info:#7AA7FF; --infobg:#16243D; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#161D24; --sunk:#1B232C; --ink:#E6EBF0; --ink2:#98A5B3; --line:#252F3A; --line2:#3A4654;
  --acc:#3BBFB2; --acc-ink:#08201E; --acc-soft:#123331; --raise:#2A3541;
  --hl:#E9C64B; --hl-ink:#14191F;
  --q1:#7AA7FF; --q2:#3CCB95; --q3:#F59E4E; --q4:#B596FF; --ask:#FF7AA8;
  --ok:#4CC38A; --okbg:#122E1F; --bad:#FF8B76; --badbg:#3A1C17; --info:#7AA7FF; --infobg:#16243D; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
body.has-nav{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{-webkit-tap-highlight-color:transparent}

/* kepala halaman */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar .brand{flex:1}
.bar .ab{margin-left:auto;flex:none}
.ttl{flex:1;min-width:0;font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px;flex:none}
.brand b{display:block;font-weight:800;font-size:1.02rem;line-height:1.2;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink2);font-size:.8rem;line-height:1.3}
.icon-btn{width:42px;flex:none;padding:0!important;display:inline-grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.eyebrow{font-size:.88rem;font-weight:600;color:var(--ink2);margin:0}
h1{font-weight:800;font-size:clamp(1.75rem,7vw,2.4rem);line-height:1.1;margin:18px 0 6px;letter-spacing:-.025em;text-wrap:balance}
.lede{margin:0 0 4px;max-width:52ch;color:var(--ink2)}
h2.t{font-weight:800;font-size:1.5rem;line-height:1.2;margin:16px 0 2px;letter-spacing:-.015em;text-wrap:balance}

/* contoh di beranda: cerita berubah jadi simbol */
.hero{margin-top:16px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-s{margin:0;font-size:1.02rem;line-height:1.9}
.hero .tk{font-weight:700;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 -2px 0 var(--c)}
.hero-sym{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line2)}
.hero-sym span{font-family:var(--f-mono);font-weight:600;font-size:.98rem;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.hero-sym b{color:var(--c);font-family:var(--f-body);font-weight:800;font-size:1.15rem;margin-right:2px}

/* tombol */
.btn{font:inherit;font-weight:700;font-size:.98rem;background:var(--acc);color:var(--acc-ink);border:1.5px solid transparent;border-radius:12px;padding:11px 18px;min-height:46px;cursor:pointer;transition:background-color .15s,border-color .15s}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink2);filter:none}
.btn.sm{padding:6px 12px;min-height:40px;font-size:.9rem;border-radius:10px}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}

/* kartu dan langkah */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;margin-top:14px;box-shadow:var(--shadow)}
.card.locked{background:var(--sunk);box-shadow:none;border-style:dashed;border-color:var(--line2)}
.card.locked > *:not(.sh){opacity:.7}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:.88rem;display:grid;place-items:center}
.card.locked .num{background:var(--line2);color:var(--surface)}
.sh h2{font-weight:800;font-size:1.15rem;margin:0;line-height:1.25;letter-spacing:-.01em}
.stt{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--ink2);padding:3px 9px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.stt.done{color:var(--ok);background:var(--okbg)}
.mut{color:var(--ink2);font-size:.95rem;margin:0 0 10px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:12px 0 2px}
.steps li{font-size:.78rem;font-weight:600;color:var(--ink2)}
.steps li::before{content:'';display:block;height:5px;border-radius:5px;background:var(--line);margin-bottom:6px}
.steps li.done::before{background:var(--acc)}
.steps li.now{color:var(--ink);font-weight:800}
.steps li.now::before{background:color-mix(in srgb,var(--acc) 40%,var(--line))}

/* daftar soal siswa */
.grp h2{font-weight:800;font-size:1.05rem;color:var(--ink);margin:24px 0 8px;letter-spacing:-.01em}
.list{display:grid;gap:8px}
.item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:58px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
.item:hover{border-color:var(--line2)}
.item b{font-weight:700;font-size:1.02rem}
.item small{display:block;color:var(--ink2);font-size:.82rem}
.item .ck{font-weight:700;font-size:.78rem;color:var(--ok);background:var(--okbg);padding:3px 9px;border-radius:999px;white-space:nowrap}
.sum{font-size:.88rem;font-weight:600;color:var(--ink2);margin:16px 0 0}

/* latihan */
.story{font-size:1.1rem;line-height:2.25;margin:4px 0 14px}
.tok{font:inherit;color:inherit;background:transparent;border:0;border-bottom:2.5px dashed var(--line2);padding:1px 4px;margin:0 1px;border-radius:6px 6px 0 0;cursor:pointer;line-height:1.5}
.tok.sel{background:var(--hl);color:var(--hl-ink);border-bottom:2.5px solid var(--hl-ink)}
.tok.on{border-bottom:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);font-weight:700}
.tok.cut{text-decoration:line-through;opacity:.55;border-bottom-style:dotted}
.tok:disabled{cursor:default;color:inherit}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{font:inherit;color:inherit;text-align:left;border:1.5px dashed var(--line2);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:92px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-content:start;align-items:center;transition:border-color .15s,background-color .15s}
.slot:disabled{cursor:default;color:inherit}
.slot .sym{font-weight:800;font-size:1.75rem;line-height:1;color:var(--c);overflow-wrap:anywhere}
.slot .nm{font-size:.88rem;font-weight:600;line-height:1.25;min-width:0}
.slot .nm small{display:block;color:var(--ink2);font-size:.78rem;font-weight:500}
.slot .val{grid-column:1 / -1;font-family:var(--f-mono);font-weight:600;font-size:.95rem;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.slot .val em{font-style:normal;color:var(--c)}
.slot .ph{color:var(--ink2);font-weight:500;font-family:var(--f-body)}
.slot.filled{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.slot.armed{border-color:var(--c);animation:pulse 1.3s ease-in-out infinite}
.slot.coret{grid-column:1 / -1;min-height:0;--c:var(--ink2)}
.slot.coret .sym{font-size:1.35rem}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}}
.fb{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:.97rem;border:0;border-left:4px solid var(--info);background:var(--infobg)}
.fb.ok{border-left-color:var(--ok);background:var(--okbg)}
.fb.bad{border-left-color:var(--bad);background:var(--badbg)}
.fb b{font-weight:800;margin-right:6px}
.fb ul{margin:6px 0 0;padding-left:20px}
.opts{display:grid;gap:8px}
.opt{width:100%;font-family:var(--f-mono);font-weight:600;font-size:1.02rem;text-align:left;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);padding:12px 14px;border-radius:12px;cursor:pointer;min-height:50px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.no{opacity:.55;text-decoration:line-through;cursor:default}
.opt.yes{border-color:var(--ok);background:var(--okbg);cursor:default}
.opt:disabled{color:var(--ink)}
.why{font-size:.92rem;color:var(--ink2);margin:5px 4px 2px}
.eq{font-family:var(--f-mono);font-weight:500;font-size:1rem;margin:6px 0;overflow-wrap:anywhere}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.calc input{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;width:7.5em;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--ink)}
.calc input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}

/* alat belajar */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tools .item{min-height:96px;align-items:flex-start;justify-content:flex-start;flex-direction:column;gap:8px;box-shadow:none;background:var(--sunk);border-color:transparent}
.tools .item:hover{border-color:var(--line2)}
.ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.ti svg{width:20px;height:20px}
.mis{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cnt{font-weight:800;font-size:.85rem;color:var(--bad);white-space:nowrap}
.cnt.good{color:var(--ok)}
.opt.mat{font-family:var(--f-body);font-weight:400}
.opt.mat b{display:block;font-weight:800;font-size:1.08rem}
.opt.mat small{display:block;font-size:.88rem;line-height:1.45;color:var(--ink2);margin-top:3px}
.rep{white-space:pre-wrap;font-family:var(--f-mono);font-size:.82rem;line-height:1.55;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 0;overflow-wrap:anywhere}
.kr{display:grid;gap:10px}
.krow{display:grid;gap:2px;border-bottom:1px solid var(--line);padding-bottom:10px}
.krow:last-child{border-bottom:0}
.kf{font-family:var(--f-mono);font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.kk{font-size:.88rem;color:var(--ink2)}
details.fold{padding:12px 16px}
details.fold summary{cursor:pointer;font-weight:700;list-style:none;min-height:28px;display:flex;align-items:center;gap:8px;color:var(--acc)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.fold[open] summary::before{transform:rotate(45deg)}
details.fold[open] summary{margin-bottom:10px}
.xbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--acc-soft);color:var(--ink);font-weight:700;font-size:.92rem}
.xbar .tm{font-family:var(--f-mono);font-size:1.15rem;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st{background:var(--sunk);border-radius:12px;padding:12px;min-width:0}
.st b{display:block;font-weight:800;font-size:1.45rem;line-height:1.15;overflow-wrap:anywhere;letter-spacing:-.01em}
.st small{color:var(--ink2);font-size:.82rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{flex:none}
.tabs .btn[aria-current="page"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--sunk);border-radius:14px;margin:12px 0 0}
.seg .chip{font:inherit;font-weight:700;font-size:.92rem;border:0;background:transparent;color:var(--ink2);border-radius:10px;min-height:42px;padding:6px 8px;cursor:pointer;transition:background-color .15s,color .15s,box-shadow .15s}
.seg .chip[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(24,33,43,.14),0 0 0 1px var(--line)}

/* beranda */
.sec{font-size:1.12rem;font-weight:800;margin:28px 0 10px;letter-spacing:-.015em}
.pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.prog{background:var(--acc);color:var(--acc-ink);border-color:transparent;padding:18px}
.prog-top{display:flex;flex-wrap:wrap;gap:6px}
.prog .pill{background:color-mix(in srgb,var(--acc-ink) 16%,transparent);color:var(--acc-ink)}
.prog-n{margin:16px 0 10px;font-size:1rem;font-weight:600;line-height:1.3}
.prog-n b{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin-right:4px}
.bar-p{display:block;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar-p > span{display:block;height:100%;min-width:0;border-radius:8px;background:var(--c,var(--acc));transition:width .4s ease}
.prog .bar-p{background:color-mix(in srgb,var(--acc-ink) 22%,transparent)}
.prog .bar-p > span{background:var(--acc-ink)}
.prog .btn{background:var(--acc-ink);color:var(--acc)}
.prog .btn:disabled{opacity:.7}
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.mat-card{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.mat-card:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.mat-card:active{transform:scale(.98)}
.mat-card b{font-size:1.04rem;font-weight:800;letter-spacing:-.01em}
.mat-card small{color:var(--ink2);font-size:.8rem;line-height:1.3;margin-bottom:10px}
.mat-card .bar-p{height:6px;margin-top:auto}
.mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);margin-bottom:10px;flex:none}
.mi svg{width:22px;height:22px}
.item .it{flex:1;min-width:0}
.chev{flex:none;color:var(--ink2);display:grid}
.chev svg{width:18px;height:18px}
.no{flex:none;width:32px;height:32px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--ink2)}
.no.ok{background:var(--okbg);color:var(--ok)}
.item .ti{flex:none}
.mhead{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.mhead .mi{width:52px;height:52px;border-radius:16px;margin:0}
.mhead .mi svg{width:28px;height:28px}
.mhead h2.t{margin:0}
.mhead .mut{margin:2px 0 0}

/* navigasi bawah */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#nav[hidden]{display:none}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav-i{font:inherit;border:0;background:transparent;color:var(--ink2);display:grid;justify-items:center;gap:3px;padding:4px 2px;cursor:pointer;font-size:.74rem;font-weight:700}
.nic{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background-color .2s}
.nic svg{width:22px;height:22px}
.nav-i.on{color:var(--acc)}
.nav-i.on .nic{background:var(--acc-soft)}

/* admin */
.arow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.arow .at{min-width:0;flex:1 1 160px}
.arow .at b{font-weight:700;font-size:1.02rem;display:block}
.arow .at small{color:var(--ink2)}
.ab{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.f{display:grid;gap:4px;margin:0 0 10px;min-width:0}
.f > span{font-size:.85rem;font-weight:700}
.f small{color:var(--ink2);font-weight:500}
.in{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.in:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.rowc{border:1px dashed var(--line2);border-radius:12px;padding:12px;margin:0 0 10px;background:var(--sunk)}
.rowc h3{margin:0 0 8px;font-size:1rem;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}

ai, satuannya meter","konv":"","catatan":""},{"teks":"10 m/s²","sym":"g","nama":"gravitasi","satuan":"m/s²","ket":"percepatan gravitasi","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp40.000","ket":"harga buku, tidak dipakai menghitung"}],"tanya":{"teks":"energi potensial buku"},"rumus":[{"f":"Ep = m × g × h","benar":true,"alasan":"Energi potensial bergantung pada massa, percepatan gravitasi, dan ketinggian."},{"f":"Ek = ½ × m × v²","benar":false,"alasan":"Ini energi kinetik. Buku diam di atas lemari, jadi tidak ada kecepatan v."},{"f":"W = F × s","benar":false,"alasan":"Ini rumus usaha. Di soal tidak ada gaya F atau perpindahan s."}],"hitung":{"diketahui":"m = 0,5 kg · g = 10 m/s² · h = 2 m","lhs":"Ep","ekspresi":"0,5 × 10 × 2","satuan":"J","jawaban":10,"salah":[{"nilai":10000,"pesan":"Hasil 10.000 muncul kalau massa masih 500 g. Ubah dulu ke 0,5 kg."}],"petunjuk":"Kalikan massa, gravitasi, dan tinggi.","penjelasan":"Ep = m × g × h = 0,5 × 10 × 2 = 10 J."}},{"id":"energi-sepeda","kelas":"9","topik":"Energi","judul":"Pesepeda melaju","cerita":"Seorang pesepeda bersama sepedanya bermassa 60 kg melaju dengan kecepatan 5 m/s selama 10 menit. Berapa energi kinetik pesepeda dan sepedanya?","besaran":[{"teks":"60 kg","sym":"m","nama":"massa","satuan":"kg","ket":"massa pesepeda dan sepedanya, satuannya kilogram","konv":"","catatan":""},{"teks":"5 m/s","sym":"v","nama":"kecepatan","satuan":"m/s","ket":"kecepatan sepeda, satuannya meter per sekon","konv":"","catatan":""}],"pengecoh":[{"teks":"10 menit","ket":"lama bersepeda, tidak dipakai menghitung"}],"tanya":{"teks":"energi kinetik pesepeda dan sepedanya"},"rumus":[{"f":"Ek = ½ × m × v²","benar":true,"alasan":"Energi kinetik bergantung pada massa dan kuadrat kecepatan."},{"f":"Ep = m × g × h","benar":false,"alasan":"Ini energi potensial. Di soal tidak ada ketinggian h."},{"f":"P = W ÷ t","benar":false,"alasan":"Ini rumus daya. Yang ditanya energi kinetik."}],"hitung":{"diketahui":"m = 60 kg · v = 5 m/s","lhs":"Ek","ekspre rgi","judul":"Mengangkat tas","cerita":"Ani mengangkat tas bermassa 3 kg dari lantai sampai setinggi 1,5 m. Percepatan gravitasi 10 m/s². Ani melakukannya dalam 4 detik. Berapa usaha yang dilakukan Ani?","besaran":[{"teks":"3 kg","sym":"m","nama":"massa","satuan":"kg","ket":"massa tas, satuannya kilogram","konv":"","catatan":""},{"teks":"1,5 m","sym":"h","nama":"tinggi","satuan":"m","ket":"ketinggian tas saat diangkat, satuannya meter","konv":"","catatan":""},{"teks":"10 m/s²","sym":"g","nama":"gravitasi","satuan":"m/s²","ket":"percepatan gravitasi","konv":"","catatan":""}],"pengecoh":[{"teks":"4 detik","ket":"lama mengangkat, tidak dipakai menghitung usaha"}],"tanya":{"teks":"usaha yang dilakukan Ani"},"rumus":[{"f":"W = m × g × h","benar":true,"alasan":"Usaha mengangkat benda sama dengan pertambahan energi potensialnya, yaitu m × g × h."},{"f":"Ek = ½ × m × v²","benar":false,"alasan":"Rumus ini butuh kecepatan v, yang tidak diketahui di soal."},{"f":"P = W ÷ t","benar":false,"alasan":"Ini rumus daya. Yang ditanya usaha."}],"hitung":{"diketahui":"m = 3 kg · g = 10 m/s² · h = 1,5 m","lhs":"W","ekspresi":"3 × 10 × 1,5","satuan":"J","jawaban":45,"salah":[{"nilai":11.25,"pesan":"11,25 itu hasil dibagi waktu (daya). Waktu 4 detik tidak dipakai untuk menghitung usaha."}],"petunjuk":"Kalikan massa, gravitasi, dan tinggi.","penjelasan":"W = m × g × h = 3 × 10 × 1,5 = 45 J."}},{"id":"energi-daya-menit","kelas":"9","topik":"Energi","judul":"Daya anak menaikkan beban","cerita":"Seorang anak menaikkan beban 12 kg dengan usaha sebesar 1.200 J selama 2 menit. Berapa daya yang dikeluarkan anak tersebut?","besaran":[{"teks":"1.200 J","sym":"W","nama":"usaha","satuan":"J","ket":"usaha yang dilakukan anak, satuannya joule","konv":"","catatan":""},{"teks":"2 menit","sym":"t","nama":"waktu","satuan":"s","ket":"lama pekerjaan, satuannya menit","konv":"= 120 s","catatan":"Di rumus daya, waktu harus dalam sekon: 2 menit = 120 s."}],"pengecoh":[{"teks":"12 kg","ket":"massa beban, tidak di "Kalikan ½ dengan massa, lalu dengan v dikali v.","penjelasan":"Ek = ½ × m × v² = ½ × 0,4 × 3² = ½ × 0,4 × 9 = 1,8 J."}},{"id":"energi-kalor-air","kelas":"9","topik":"Energi","judul":"Memanaskan air","cerita":"Air bermassa 2 kg dipanaskan sehingga suhunya naik sebesar 30°C. Kalor jenis air 4.200 J/kg°C. Pemanasan berlangsung selama 5 menit. Berapa kalor yang diterima air?","besaran":[{"teks":"2 kg","sym":"m","nama":"massa","satuan":"kg","ket":"massa air, satuannya kilogram","konv":"","catatan":""},{"teks":"30°C","sym":"ΔT","nama":"kenaikan suhu","satuan":"°C","ket":"kenaikan suhu air, satuannya derajat Celsius","konv":"","catatan":""},{"teks":"4.200 J/kg°C","sym":"c","nama":"kalor jenis","satuan":"J/kg°C","ket":"kalor jenis air, yaitu kalor untuk menaikkan suhu 1 kg air sebesar 1°C","konv":"","catatan":""}],"pengecoh":[{"teks":"5 menit","ket":"lama pemanasan, tidak dipakai menghitung"}],"tanya":{"teks":"kalor yang diterima air"},"rumus":[{"f":"Q = m × c × ΔT","benar":true,"alasan":"Kalor yang diterima bergantung pada massa, kalor jenis, dan kenaikan suhu."},{"f":"Q = m × ΔT ÷ c","benar":false,"alasan":"Kalor jenis c harus dikalikan, bukan membagi."},{"f":"P = W ÷ t","benar":false,"alasan":"Ini rumus daya, bukan rumus kalor."}],"hitung":{"diketahui":"m = 2 kg · c = 4.200 J/kg°C · ΔT = 30°C","lhs":"Q","ekspresi":"2 × 4.200 × 30","satuan":"J","jawaban":252000,"salah":[{"nilai":126000,"pesan":"126.000 belum dikalikan massa 2 kg."}],"petunjuk":"Kalikan massa, kalor jenis, dan kenaikan suhu.","penjelasan":"Q = m × c × ΔT = 2 × 4.200 × 30 = 252.000 J."}},{"id":"listrik-biaya-lampu","kelas":"9","topik":"Listrik","judul":"Biaya listrik lampu Rian","cerita":"Rian menggunakan lampu selama 8 jam setiap hari dengan daya lampu sebesar 50 watt. Satu bulan dianggap 30 hari. Berapa biaya listrik per bulan untuk lampu tersebut jika 1 kWh = Rp1.500?","besaran":[{"teks":"50 watt","sym":"P","nama":"daya","satuan":"kW","ket":"daya lampu, satuannya watt","konv":"= 0,05 kW","catatan":"Tarif dihitung per kWh, jadi daya diubah ke kW: 50 W = 0,05 kW."},{"teks":"8 jam","sym":"t","nama":"waktu per hari","satuan":"jam","ket":"lama lampu menyala setiap hari, satuannya jam","konv":"","catatan":""},{"teks":"30 hari","sym":"hari","nama":"jumlah hari","satuan":"hari","ket":"jumlah hari dalam satu bulan","konv":"","catatan":""},{"teks":"Rp1.500","sym":"tarif","nama":"tarif","satuan":"Rp/kWh","ket":"tarif listrik untuk setiap 1 kWh","konv":"","catatan":""}],"pengecoh":[],"tanya":{"teks":"biaya listrik per bulan"},"rumus":[{"f":"Biaya = P × t × hari × tarif","benar":true,"alasan":"Hitung dulu energi sebulan (daya × waktu per hari × jumlah hari) dalam kWh, lalu kalikan dengan tarif per kWh."},{"f":"Biaya = P × t × tarif","benar":false,"alasan":"Rumus ini baru menghasilkan biaya untuk 1 hari. Soal meminta biaya satu bulan, jadi harus dikali jumlah hari."},{"f":"Biaya = V × I × t","benar":false,"alasan":"Ini bukan rumus biaya. Di soal tidak ada tegangan V atau kuat arus I."}],"hitung":{"diketahui":"P = 0,05 kW · t = 8 jam/hari · 30 hari · tarif = Rp1.500/kWh","lhs":"Biaya","ekspresi":"0,05 × 8 × 30 × 1.500","satuan":"rupiah","jawaban":18000,"salah":[{"nilai":600,"pesan":"600 itu biaya untuk satu hari. Kalikan 30 hari untuk satu bulan."},{"nilai":18000000,"pesan":"18.000.000 muncul kalau daya masih 50 W. Ubah dulu ke kW: 50 W = 0,05 kW."},{"nilai":12,"pesan":"12 itu energi sebulan dalam kWh. Kalikan dengan tarif Rp1.500 untuk mendapat biaya."}],"petunjuk":"Hitung dulu energi sebulan dalam kWh, lalu kalikan dengan tarif.","penjelasan":"Energi sebulan = 0,05 kW × 8 jam × 30 hari = 12 kWh. Biaya = 12 × Rp1.500 = Rp18.000."}},{"id":"magnet-stepup","kelas":"9","topik":"Magnet","judul":"Trafo penaik tegangan","cerita":"Sebuah trafo memiliki kumparan primer 100 lilitan dan kumparan sekunder 500 lilitan. Trafo dihubungkan ke sumber tegangan 12 V. Trafo itu dibeli seharga Rp50.000. Berapa tegangan pada kumparan sekunder?","besaran":[{"teks":"100 lilitan","sym":"Np","nama":"lilitan primer","satuan":"lilitan","ket":"jumlah lilitan kumparan primer (Np)","konv":"","catatan":""},{"teks":"500 lilitan","sym":"Ns","nama":"lilitan sekunder","satuan":"lilitan","ket":"jumlah lilitan kumparan sekunder (Ns)","konv":"","catatan":""},{"teks":"12 V","sym":"Vp","nama":"tegangan primer","satuan":"V","ket":"tegangan sumber yang masuk ke kumparan primer (Vp)","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp50.000","ket":"harga trafo, tidak dipakai menghitung"}],"tanya":{"teks":"tegangan pada kumparan sekunder"},"rumus":[{"f":"Vs = Vp × Ns ÷ Np","benar":true,"alasan":"Dari Np : Ns = Vp : Vs, tegangan sekunder sebanding dengan jumlah lilitan sekunder."},{"f":"Vs = Vp × Np ÷ Ns","benar":false,"alasan":"Terbalik. Lilitan sekunder lebih banyak, jadi tegangan harus naik, bukan turun."},{"f":"Vs = Vp + Ns − Np","benar":false,"alasan":"Tegangan trafo ditentukan oleh perbandingan lilitan, bukan penjumlahan dan pengurangan."}],"hitung":{"diketahui":"Np = 100 · Ns = 500 · Vp = 12 V","lhs":"Vs","ekspresi":"12 × 500 ÷ 100","satuan":"V","jawaban":60,"salah":[{"nilai":2.4,"pesan":"2,4 muncul kalau Np dan Ns tertukar. Trafo ini menaikkan tegangan, jadi Vs harus lebih besar dari 12 V."}],"petunjuk":"Kalikan 12 dengan 500, lalu bagi 100.","penjelasan":"Vs = Vp × Ns ÷ Np = 12 × 500 ÷ 100 = 60 V. Trafo ini penaik tegangan (step-up) karena Ns lebih banyak dari Np."}},{"id":"magnet-adaptor-mainan","kelas":"9","topik":"Magnet","judul":"Adaptor lampu mainan","cerita":"Trafo pada adaptor lampu mainan memiliki 1.100 lilitan primer dan 100 lilitan sekunder. Adaptor dihubungkan ke listrik PLN 220 V. Adaptor itu dipakai selama 3 jam. Berapa tegangan keluaran adaptor?","besaran":[{"teks":"1.100 lilitan primer","sym":"Np","nama":"lilitan primer","satuan":"lilitan","ket":"jumlah lilitan kumparan primer (Np)","konv":"","catatan":""},{"teks":"100 lilitan sekunder","sym":"Ns","nama":"lilitan sekunder","satuan":"lilitan","ket":"jumlah lilitan kumparan sekunder (Ns)","konv":"","catatan":""},{"teks":"220 V","sym":"Vp","nama":"tegangan primer","satuan":"V","ket":"tegangan dari PLN yang masuk ke trafo, jadi tegangan primer (Vp)","konv":"","catatan":""}],"pengecoh":[{"teks":"3 jam","ket":"lama adaptor dipakai, tidak dipakai menghitung"}],"tanya":{"teks":"tegangan keluaran adaptor"},"rumus":[{"f":"Vs = Vp × Ns ÷ Np","benar":true,"alasan":"Dari Np : Ns = Vp : Vs, tegangan sekunder sebanding dengan jumlah lilitan sekunder."},{"f":"Vs = Vp × Np ÷ Ns","benar":false,"alasan":"Terbalik. Adaptor ini menurunkan tegangan, jadi hasilnya harus lebih kecil dari 220 V. Rumus ini justru memberi hasil lebih besar."},{"f":"Vs = Vp + Ns − Np","benar":false,"alasan":"Tegangan trafo ditentukan oleh perbandingan lilitan, bukan penjumlahan dan pengurangan."}],"hitung":{"diketahui":"Np = 1.100 · Ns = 100 · Vp = 220 V","lhs":"Vs","ekspresi":"220 × 100 ÷ 1.100","satuan":"V","jawaban":20,"salah":[{"nilai":2420,"pesan":"2.420 muncul kalau Np dan Ns tertukar. Adaptor ini menurunkan tegangan, jadi Vs harus lebih kecil dari 220 V."}],"petunjuk":"Kalikan 220 dengan 100, lalu bagi 1.100.","penjelasan":"Vs = Vp × Ns ÷ Np = 220 × 100 ÷ 1.100 = 20 V. Trafo ini penurun tegangan (step-down)."}},{"id":"magnet-cari-np","kelas":"9","topik":"Magnet","judul":"Mencari lilitan primer","cerita":"Sebuah trafo mengubah tegangan listrik PLN 220 V menjadi 22 V. Kumparan sekunder trafo itu memiliki 100 lilitan. Trafo itu sudah dipakai 5 tahun. Berapa jumlah lilitan kumparan primer?","besaran":[{"teks":"220 V","sym":"Vp","nama":"tegangan primer","satuan":"V","ket":"tegangan dari PLN yang masuk ke trafo, jadi tegangan primer (Vp)","konv":"","catatan":""},{"teks":"22 V","sym":"Vs","nama":"tegangan sekunder","satuan":"V","ket":"tegangan yang keluar dari trafo, jadi tegangan sekunder (Vs)","konv":"","catatan":""},{"teks":"100 lilitan","sym":"Ns","nama":"lilitan sekunder","satuan":"lilitan","ket":"jumlah lilitan kumparan sekunder (Ns)","konv":"","catatan":""}],"pengecoh":[{"teks":"5 tahun","ket":"lama trafo dipakai, tidak dipakai menghitung"}],"tanya":{"teks":"jumlah lilitan kumparan primer"},"rumus":[{"f":"Np = Ns × Vp ÷ Vs","benar":true,"alasan":"Dari Np : Ns = Vp : Vs, jumlah lilitan primer = Ns × Vp ÷ Vs."},{"f":"Np = Ns × Vs ÷ Vp","benar":false,"alasan":"Terbalik. Tegangan primer lebih besar dari sekunder, jadi lilitan primer harus lebih banyak dari lilitan sekunder."},{"f":"Np = Ns + Vp − Vs","benar":false,"alasan":"Lilitan dan tegangan dihubungkan dengan perbandingan, bukan penjumlahan dan pengurangan."}],"hitung":{"diketahui":"Ns = 100 · Vp = 220 V · Vs = 22 V","lhs":"Np","ekspresi":"100 × 220 ÷ 22","satuan":"lilitan","jawaban":1000,"salah":[{"nilai":10,"pesan":"10 muncul kalau Vp dan Vs tertukar. Lilitan primer harus lebih banyak dari 100."}],"petunjuk":"Kalikan 100 dengan 220, lalu bagi 22.","penjelasan":"Np = Ns × Vp ÷ Vs = 100 × 220 ÷ 22 = 1.000 lilitan."}},{"id":"magnet-arus-primer","kelas":"9","topik":"Magnet","judul":"Arus pada kumparan primer","cerita":"Sebuah trafo ideal mengubah tegangan 220 V menjadi 22 V. Arus pada kumparan sekunder 5 A. Trafo itu bekerja selama 2 jam. Berapa kuat arus pada kumparan primer?","besaran":[{"teks":"220 V","sym":"Vp","nama":"tegangan primer","satuan":"V","ket":"tegangan yang masuk ke kumparan primer (Vp)","konv":"","catatan":""},{"teks":"22 V","sym":"Vs","nama":"tegangan sekunder","satuan":"V","ket":"tegangan yang keluar dari kumparan sekunder (Vs)","konv":"","catatan":""},{"teks":"5 A","sym":"Is","nama":"arus sekunder","satuan":"A","ket":"kuat arus pada kumparan sekunder (Is), satuannya ampere","konv":"","catatan":""}],"pengecoh":[{"teks":"2 jam","ket":"lama trafo bekerja, tidak dipakai menghitung"}],"tanya":{"teks":"kuat arus pada kumparan primer"},"rumus":[{"f":"Ip = Vs × Is ÷ Vp","benar":true,"alasan":"Pada trafo ideal, daya primer sama dengan daya sekunder: Vp × Ip = Vs × Is."},{"f":"Ip = Vp × Is ÷ Vs","benar":false,"alasan":"Terbalik. Tegangan primer lebih besar, jadi arus primer harus lebih kecil dari arus sekunder."},{"f":"Ip = Vs + Is − Vp","benar":false,"alasan":"Arus dan tegangan dihubungkan lewat daya (perkalian), bukan penjumlahan dan pengurangan."}],"hitung":{"diketahui":"Vp = 220 V · Vs = 22 V · Is = 5 A","lhs":"Ip","ekspresi":"22 × 5 ÷ 220","satuan":"A","jawaban":0.5,"salah":[{"nilai":50,"pesan":"50 muncul kalau Vp dan Vs tertukar. Arus primer harus lebih kecil dari 5 A."}],"petunjuk":"Kalikan 22 dengan 5, lalu bagi 220.","penjelasan":"Vp × Ip = Vs × Is, jadi Ip = 22 × 5 ÷ 220 = 0,5 A."}},{"id":"magnet-daya-sekunder","kelas":"9","topik":"Magnet","judul":"Daya trafo ideal","cerita":"Sebuah trafo ideal dihubungkan ke tegangan primer 200 V dan arus primernya 2 A. Trafo itu dibeli seharga Rp90.000. Berapa daya pada kumparan sekunder?","besaran":[{"teks":"200 V","sym":"Vp","nama":"tegangan primer","satuan":"V","ket":"tegangan pada kumparan primer (Vp)","konv":"","catatan":""},{"teks":"2 A","sym":"Ip","nama":"arus primer","satuan":"A","ket":"kuat arus pada kumparan primer (Ip), satuannya ampere","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp90.000","ket":"harga trafo, tidak dipakai menghitung"}],"tanya":{"teks":"daya pada kumparan sekunder"},"rumus":[{"f":"Ps = Pp = Vp × Ip","benar":true,"alasan":"Pada trafo ideal tidak ada energi yang hilang, jadi daya sekunder sama dengan daya primer, yaitu Vp × Ip."},{"f":"Ps = Vp ÷ Ip","benar":false,"alasan":"Itu hasil bagi, yang memberi hambatan. Daya listrik dihitung dengan tegangan dikali arus."},{"f":"Ps = Vp + Ip","benar":false,"alasan":"Tegangan dan arus tidak dijumlahkan. Daya = tegangan × arus."}],"hitung":{"diketahui":"Vp = 200 V · Ip = 2 A","lhs":"Ps = Pp","ekspresi":"200 × 2","satuan":"W","jawaban":400,"salah":[{"nilai":100,"pesan":"100 itu hasil bagi. Daya = tegangan × arus."}],"petunjuk":"Kalikan tegangan primer dengan arus primer.","penjelasan":"Ps = Pp = Vp × Ip = 200 × 2 = 400 W."}},{"id":"magnet-efisiensi","kelas":"9","topik":"Magnet","judul":"Efisiensi trafo","cerita":"Sebuah trafo menerima daya 80 W pada kumparan primer dan menghasilkan daya 60 W pada kumparan sekunder. Trafo itu bekerja selama 4 jam. Berapa efisiensi trafo tersebut?","besaran":[{"teks":"80 W","sym":"Pp","nama":"daya masuk","satuan":"W","ket":"daya pada kumparan primer (daya masuk)","konv":"","catatan":""},{"teks":"60 W","sym":"Ps","nama":"daya keluar","satuan":"W","ket":"daya pada kumparan sekunder (daya keluar)","konv":"","catatan":""}],"pengecoh":[{"teks":"4 jam","ket":"lama trafo bekerja, tidak dipakai menghitung"}],"tanya":{"teks":"efisiensi trafo tersebut"},"rumus":[{"f":"η = (Ps ÷ Pp) × 100%","benar":true,"alasan":"Efisiensi membandingkan daya keluar dengan daya masuk."},{"f":"η = (Pp ÷ Ps) × 100%","benar":false,"alasan":"Terbalik. Hasilnya lebih dari 100%, padahal efisiensi tidak mungkin melebihi 100%."},{"f":"η = Pp − Ps","benar":false,"alasan":"Itu selisih daya yang terbuang. Efisiensi berupa perbandingan dalam persen."}],"hitung":{"diketahui":"Pp = 80 W · Ps = 60 W","lhs":"η","ekspresi":"60 ÷ 80 × 100","satuan":"%","jawaban":75,"salah":[{"nilai":20,"pesan":"20 itu selisih daya (80 − 60), bukan efisiensi."},{"nilai":0.75,"pesan":"0,75 belum dikali 100. Efisiensi dinyatakan dalam persen."}],"petunjuk":"Bagi daya keluar dengan daya masuk, lalu kalikan 100.","penjelasan":"η = Ps ÷ Pp × 100% = 60 ÷ 80 × 100% = 75%."}},{"id":"magnet-gaya-lorentz","kelas":"9","topik":"Magnet","judul":"Gaya pada kawat berarus","cerita":"Sebuah kawat sepanjang 50 cm dialiri arus listrik 4 A di dalam medan magnet 0,2 T. Arah arus tegak lurus medan magnet. Kawat itu terbuat dari tembaga dengan massa 20 g. Berapa gaya Lorentz yang bekerja pada kawat?","besaran":[{"teks":"50 cm","sym":"L","nama":"panjang kawat","satuan":"m","ket":"panjang kawat di dalam medan magnet, satuannya sentimeter","konv":"= 0,5 m","catatan":"Di rumus, panjang harus dalam meter: 50 cm = 0,5 m."},{"teks":"4 A","sym":"I","nama":"kuat arus","satuan":"A","ket":"kuat arus listrik pada kawat, satuannya ampere","konv":"","catatan":""},{"teks":"0,2 T","sym":"B","nama":"medan magnet","satuan":"T","ket":"kuat medan magnet, satuannya tesla","konv":"","catatan":""}],"pengecoh":[{"teks":"20 g","ket":"massa kawat, tidak dipakai menghitung"}],"tanya":{"teks":"gaya Lorentz yang bekerja pada kawat"},"rumus":[{"f":"F = B × I × L","benar":true,"alasan":"Gaya Lorentz sebanding dengan kuat medan magnet, kuat arus, dan panjang kawat (arus tegak lurus medan)."},{"f":"F = m × g","benar":false,"alasan":"Ini berat benda. Soal menanyakan gaya akibat medan magnet."},{"f":"F = B × I ÷ L","benar":false,"alasan":"Panjang kawat dikalikan, bukan membagi. Semakin panjang kawat, semakin besar gayanya."}],"hitung":{"diketahui":"B = 0,2 T · I = 4 A · L = 0,5 m","lhs":"F","ekspresi":"0,2 × 4 × 0,5","satuan":"N","jawaban":0.4,"salah":[{"nilai":40,"pesan":"40 muncul kalau panjang masih 50 cm. Ubah dulu ke 0,5 m."}],"petunjuk":"Kalikan medan magnet, kuat arus, dan panjang kawat.","penjelasan":"F = B × I × L = 0,2 × 4 × 0,5 = 0,4 N."}},{"id":"magnet-adaptor-laptop","kelas":"9","topik":"Magnet","judul":"Adaptor laptop","cerita":"Adaptor laptop memakai trafo yang dihubungkan ke listrik PLN 220 V dan menghasilkan tegangan 19 V. Kumparan primer trafo itu memiliki 2.200 lilitan. Adaptor itu dibeli seharga Rp250.000. Berapa jumlah lilitan kumparan sekunder?","besaran":[{"teks":"220 V","sym":"Vp","nama":"tegangan primer","satuan":"V","ket":"tegangan dari PLN yang masuk ke trafo, jadi tegangan primer (Vp)","konv":"","catatan":""},{"teks":"19 V","sym":"Vs","nama":"tegangan sekunder","satuan":"V","ket":"tegangan yang keluar ke laptop, jadi tegangan sekunder (Vs)","konv":"","catatan":""},{"teks":"2.200 lilitan","sym":"Np","nama":"lilitan primer","satuan":"lilitan","ket":"jumlah lilitan kumparan primer (Np)","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp250.000","ket":"harga adaptor, tidak dipakai menghitung"}],"tanya":{"teks":"jumlah lilitan kumparan sekunder"},"rumus":[{"f":"Ns = Np × Vs ÷ Vp","benar":true,"alasan":"Dari Np : Ns = Vp : Vs, jumlah lilitan sekunder = Np × Vs ÷ Vp."},{"f":"Ns = Np × Vp ÷ Vs","benar":false,"alasan":"Terbalik. Tegangan turun dari 220 V ke 19 V, jadi lilitan sekunder harus lebih sedikit dari primer."},{"f":"Ns = Np + Vs − Vp","benar":false,"alasan":"Lilitan dan tegangan dihubungkan dengan perbandingan, bukan penjumlahan dan pengurangan."}],"hitung":{"diketahui":"Np = 2.200 · Vp = 220 V · Vs = 19 V","lhs":"Ns","ekspresi":"2.200 × 19 ÷ 220","satuan":"lilitan","jawaban":190,"salah":[{"nilai":41800,"pesan":"41.800 belum dibagi dengan Vp (220 V). Selesaikan perbandingannya."}],"petunjuk":"Kalikan 2.200 dengan 19, lalu bagi 220.","penjelasan":"Ns = Np × Vs ÷ Vp = 2.200 × 19 ÷ 220 = 190 lilitan."}},{"id":"magnet-pembangkit","kelas":"9","topik":"Magnet","judul":"Trafo di pembangkit listrik","cerita":"Di sebuah pembangkit listrik, trafo menaikkan tegangan dari 10 kV menjadi 150 kV. Kumparan primer trafo itu memiliki 2.000 lilitan. Trafo itu dipasang pada tahun 2015. Berapa jumlah lilitan kumparan sekunder?","besaran":[{"teks":"10 kV","sym":"Vp","nama":"tegangan primer","satuan":"kV","ket":"tegangan yang masuk ke trafo, jadi tegangan primer (Vp)","konv":"","catatan":"Vp dan Vs sama-sama dalam kV, jadi tidak perlu diubah ke V."},{"teks":"150 kV","sym":"Vs","nama":"tegangan sekunder","satuan":"kV","ket":"tegangan yang keluar dari trafo, jadi tegangan sekunder (Vs)","konv":"","catatan":""},{"teks":"2.000 lilitan","sym":"Np","nama":"lilitan primer","satuan":"lilitan","ket":"jumlah lilitan kumparan primer (Np)","konv":"","catatan":""}],"pengecoh":[{"teks":"2015","ket":"tahun pemasangan, tidak dipakai menghitung"}],"tanya":{"teks":"jumlah lilitan kumparan sekunder"},"rumus":[{"f":"Ns = Np × Vs ÷ Vp","benar":true,"alasan":"Dari Np : Ns = Vp : Vs, jumlah lilitan sekunder = Np × Vs ÷ Vp."},{"f":"Ns = Np × Vp ÷ Vs","benar":false,"alasan":"Terbalik. Trafo ini menaikkan tegangan, jadi lilitan sekunder harus lebih banyak dari primer."},{"f":"Ns = Np ÷ (Vp × Vs)","benar":false,"alasan":"Rumus ini tidak ada di materi trafo. Perbandingan lilitan sama dengan perbandingan tegangan."}],"hitung":{"diketahui":"Np = 2.000 · Vp = 10 kV · Vs = 150 kV","lhs":"Ns","ekspresi":"2.000 × 150 ÷ 10","satuan":"lilitan","jawaban":30000,"salah":[{"nilai":300000,"pesan":"300.000 belum dibagi dengan Vp (10 kV). Selesaikan perbandingannya."}],"petunjuk":"Kalikan 2.000 dengan 150, lalu bagi 10.","penjelasan":"Ns = Np × Vs ÷ Vp = 2.000 × 150 ÷ 10 = 30.000 lilitan. Ns jauh lebih banyak dari Np karena trafo ini menaikkan tegangan."}},{"id":"magnet-arus-sekunder","kelas":"9","topik":"Magnet","judul":"Arus pada kumparan sekunder","cerita":"Sebuah trafo ideal memiliki 1.000 lilitan primer dan 200 lilitan sekunder. Arus pada kumparan primer 0,4 A. Trafo itu dipakai selama 6 jam. Berapa kuat arus pada kumparan sekunder?","besaran":[{"teks":"1.000 lilitan primer","sym":"Np","nama":"lilitan primer","satuan":"lilitan","ket":"jumlah lilitan kumparan primer (Np)","konv":"","catatan":""},{"teks":"200 lilitan sekunder","sym":"Ns","nama":"lilitan sekunder","satuan":"lilitan","ket":"jumlah lilitan kumparan sekunder (Ns)","konv":"","catatan":""},{"teks":"0,4 A","sym":"Ip","nama":"arus primer","satuan":"A","ket":"kuat arus pada kumparan primer (Ip), satuannya ampere","konv":"","catatan":""}],"pengecoh":[{"teks":"6 jam","ket":"lama trafo dipakai, tidak dipakai menghitung"}],"tanya":{"teks":"kuat arus pada kumparan sekunder"},"rumus":[{"f":"Is = Ip × Np ÷ Ns","benar":true,"alasan":"Pada trafo ideal, Np : Ns = Is : Ip. Lilitan sekunder lebih sedikit, jadi arus sekunder lebih besar."},{"f":"Is = Ip × Ns ÷ Np","benar":false,"alasan":"Terbalik. Arus berbanding terbalik dengan jumlah lilitan. Lilitan sekunder lebih sedikit berarti arus sekunder lebih besar dari 0,4 A."},{"f":"Is = Ip + Np − Ns","benar":false,"alasan":"Arus dan lilitan dihubungkan dengan perbandingan, bukan penjumlahan dan pengurangan."}],"hitung":{"diketahui":"Np = 1.000 · Ns = 200 · Ip = 0,4 A","lhs":"Is","ekspresi":"0,4 × 1.000 ÷ 200","satuan":"A","jawaban":2,"salah":[{"nilai":0.08,"pesan":"0,08 muncul kalau Np dan Ns tertukar. Is harus lebih besar dari 0,4 A."}],"petunjuk":"Kalikan 0,4 dengan 1.000, lalu bagi 200.","penjelasan":"Is = Ip × Np ÷ Ns = 0,4 × 1.000 ÷ 200 = 2 A."}},{"id":"ohm-setrika","kelas":"9","topik":"Listrik","judul":"Arus pada setrika","cerita":"Setrika listrik memiliki hambatan 40 Ω dan dihubungkan ke sumber tegangan 220 V. Setrika itu dipakai 30 menit setiap hari. Berapa kuat arus yang mengalir pada setrika?","besaran":[{"teks":"40 Ω","sym":"R","nama":"hambatan","satuan":"Ω","ket":"hambatan setrika, satuannya ohm","konv":"","catatan":""},{"teks":"220 V","sym":"V","nama":"tegangan","satuan":"V","ket":"tegangan sumber, satuannya volt","konv":"","catatan":""}],"pengecoh":[{"teks":"30 menit","ket":"lama pemakaian, tidak dipakai menghitung arus"}],"tanya":{"teks":"kuat arus yang mengalir pada setrika"},"rumus":[{"f":"I = V ÷ R","benar":true,"alasan":"Hukum Ohm: V = I × R, sehingga I = V ÷ R."},{"f":"V = I × R","benar":false,"alasan":"Ini rumus untuk mencari tegangan, sedangkan yang ditanya kuat arus."},{"f":"R = V × I","benar":false,"alasan":"Ini rumus untuk mencari hambatan dengan cara yang salah. Hambatan dicari dengan V ÷ I."}],"hitung":{"diketahui":"V = 220 V · R = 40 Ω","lhs":"I","ekspresi":"220 ÷ 40","satuan":"A","jawaban":5.5,"salah":[{"nilai":8800,"pesan":"Itu hasil kali V dan R. Kuat arus dicari dengan membagi V dengan R."}],"petunjuk":"Bagi tegangan dengan hambatan.","penjelasan":"I = V ÷ R = 220 ÷ 40 = 5,5 A."}},{"id":"ohm-lampu","kelas":"9","topik":"Listrik","judul":"Tegangan pada lampu pijar","cerita":"Sebuah lampu pijar memiliki hambatan 200 Ω. Ketika menyala, arus sebesar 0,3 A mengalir melalui lampu. Lampu itu dibeli seharga Rp12.000. Berapa tegangan pada lampu?","besaran":[{"teks":"200 Ω","sym":"R","nama":"hambatan","satuan":"Ω","ket":"hambatan lampu, satuannya ohm","konv":"","catatan":""},{"teks":"0,3 A","sym":"I","nama":"kuat arus","satuan":"A","ket":"kuat arus yang mengalir melalui lampu, satuannya ampere","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp12.000","ket":"harga lampu, tidak dipakai menghitung"}],"tanya":{"teks":"tegangan pada lampu"},"rumus":[{"f":"V = I × R","benar":true,"alasan":"Dari V = I × R, tegangan sama dengan kuat arus dikali hambatan."},{"f":"I = V ÷ R","benar":false,"alasan":"Ini rumus untuk mencari arus. Yang ditanya tegangan."},{"f":"R = V ÷ I","benar":false,"alasan":"Ini rumus untuk mencari hambatan. Yang ditanya tegangan."}],"hitung":{"diketahui":"I = 0,3 A · R = 200 Ω","lhs":"V","ekspresi":"200 × 0,3","satuan":"V","jawaban":60,"salah":[{"nilai":0.0015,"pesan":"Itu hasil bagi I dengan R. Tegangan dicari dengan mengalikan I dan R."}],"petunjuk":"Kalikan kuat arus dengan hambatan.","penjelasan":"V = I × R = 0,3 × 200 = 60 V."}},{"id":"arus-muatan","kelas":"9","topik":"Listrik","judul":"Arus dari muatan yang mengalir","cerita":"Sebuah penghantar dialiri muatan listrik sebesar 120 C selama 60 s. Penghantar itu terbuat dari tembaga. Berapa kuat arus listrik pada penghantar?","besaran":[{"teks":"120 C","sym":"q","nama":"muatan listrik","satuan":"C","ket":"muatan listrik yang mengalir, satuannya coulomb","konv":"","catatan":""},{"teks":"60 s","sym":"t","nama":"waktu","satuan":"s","ket":"lama muatan mengalir, satuannya sekon","konv":"","catatan":""}],"pengecoh":[{"teks":"tembaga","ket":"bahan penghantar, tidak dipakai menghitung arus"}],"tanya":{"teks":"kuat arus listrik pada penghantar"},"rumus":[{"f":"I = q ÷ t","benar":true,"alasan":"Kuat arus adalah muatan yang mengalir dibagi waktu."},{"f":"I = q × t","benar":false,"alasan":"Ini hasil kali, bukan kuat arus."},{"f":"I = t ÷ q","benar":false,"alasan":"Terbalik. Muatan dibagi waktu, bukan waktu dibagi muatan."}],"hitung":{"diketahui":"q = 120 C · t = 60 s","lhs":"I","ekspresi":"120 ÷ 60","satuan":"A","jawaban":2,"salah":[{"nilai":7200,"pesan":"Itu hasil kali muatan dan waktu. Kuat arus dicari dengan membagi muatan dengan waktu."},{"nilai":0.5,"pesan":"Terbalik. Muatan dibagi waktu."}],"petunjuk":"Bagi muatan dengan waktu.","penjelasan":"I = q ÷ t = 120 ÷ 60 = 2 A."}},{"id":"seri-hambatan","kelas":"9","topik":"Listrik","judul":"Hambatan pengganti seri","cerita":"Dua hambatan, 4 Ω dan 6 Ω, disusun seri pada sebuah papan rangkaian. Tegangan baterai 20 V tidak dipakai untuk mencari hambatan pengganti. Berapa hambatan pengganti rangkaian?","besaran":[{"teks":"4 Ω","sym":"R1","nama":"hambatan pertama","satuan":"Ω","ket":"hambatan pertama dalam rangkaian","konv":"","catatan":""},{"teks":"6 Ω","sym":"R2","nama":"hambatan kedua","satuan":"Ω","ket":"hambatan kedua dalam rangkaian","konv":"","catatan":""}],"pengecoh":[{"teks":"20 V","ket":"tegangan baterai, tidak dipakai mencari hambatan pengganti"}],"tanya":{"teks":"hambatan pengganti rangkaian"},"rumus":[{"f":"Rs = R1 + R2","benar":true,"alasan":"Pada rangkaian seri, hambatan pengganti adalah jumlah semua hambatan."},{"f":"1/Rs = 1/R1 + 1/R2","benar":false,"alasan":"Ini rumus paralel. Dalam seri, hambatan dijumlahkan."},{"f":"Rs = R1 × R2","benar":false,"alasan":"Ini hasil kali. Dalam seri, hambatan dijumlahkan."}],"hitung":{"diketahui":"R1 = 4 Ω · R2 = 6 Ω","lhs":"Rs","ekspresi":"4 + 6","satuan":"Ω","jawaban":10,"salah":[{"nilai":2.4,"pesan":"Itu rumus paralel. Dalam seri, hambatan dijumlahkan."},{"nilai":24,"pesan":"Itu hasil kali. Dalam seri, hambatan dijumlahkan."}],"petunjuk":"Jumlahkan semua hambatan dalam seri.","penjelasan":"Rs = R1 + R2 = 4 + 6 = 10 Ω."}},{"id":"seri-arus","kelas":"9","topik":"Listrik","judul":"Arus pada rangkaian seri","cerita":"Dua hambatan, 4 Ω dan 6 Ω, disusun seri dan dihubungkan ke sumber tegangan 20 V. Rangkaian ini dipasang di ruang kelas. Berapa kuat arus yang mengalir pada rangkaian?","besaran":[{"teks":"20 V","sym":"V","nama":"tegangan sumber","satuan":"V","ket":"tegangan sumber, satuannya volt","konv":"","catatan":""},{"teks":"4 Ω","sym":"R1","nama":"hambatan pertama","satuan":"Ω","ket":"hambatan pertama dalam rangkaian","konv":"","catatan":""},{"teks":"6 Ω","sym":"R2","nama":"hambatan kedua","satuan":"Ω","ket":"hambatan kedua dalam rangkaian","konv":"","catatan":""}],"pengecoh":[{"teks":"ruang kelas","ket":"tempat dan waktu, tidak dipakai menghitung"}],"tanya":{"teks":"kuat arus yang mengalir pada rangkaian"},"rumus":[{"f":"I = V ÷ Rs","benar":true,"alasan":"Hukum Ohm pada rangkaian seri: arus dihitung dengan tegangan dibagi hambatan pengganti."},{"f":"I = V × Rs","benar":false,"alasan":"Hasil kali tidak menghasilkan arus. Arus dicari dengan membagi."},{"f":"I = Rs ÷ V","benar":false,"alasan":"Terbalik. Tegangan dibagi hambatan, bukan sebaliknya."}],"hitung":{"diketahui":"V = 20 V · R1 = 4 Ω · R2 = 6 Ω","lhs":"I","ekspresi":"20 ÷ (4 + 6)","satuan":"A","jawaban":2,"salah":[{"nilai":0.5,"pesan":"Terbalik. Arus = tegangan dibagi hambatan total."},{"nilai":200,"pesan":"Itu hasil kali. Arus dicari dengan membagi tegangan dengan hambatan total."}],"petunjuk":"Jumlahkan hambatan dulu, lalu bagi tegangan dengan hasilnya.","penjelasan":"Rs = 4 + 6 = 10 Ω, I = V ÷ Rs = 20 ÷ 10 = 2 A."}},{"id":"paralel-hambatan","kelas":"9","topik":"Listrik","judul":"Hambatan pengganti paralel","cerita":"Dua hambatan, 6 Ω dan 3 Ω, disusun paralel. Susunan ini dibuat untuk praktikum di laboratorium sekolah. Berapa hambatan pengganti rangkaian paralel?","besaran":[{"teks":"6 Ω","sym":"R1","nama":"hambatan pertama","satuan":"Ω","ket":"hambatan pertama dalam rangkaian","konv":"","catatan":""},{"teks":"3 Ω","sym":"R2","nama":"hambatan kedua","satuan":"Ω","ket":"hambatan kedua dalam rangkaian","konv":"","catatan":""}],"pengecoh":[{"teks":"laboratorium sekolah","ket":"tempat, tidak dipakai menghitung"}],"tanya":{"teks":"hambatan pengganti rangkaian paralel"},"rumus":[{"f":"1/Rp = 1/R1 + 1/R2","benar":true,"alasan":"Pada rangkaian paralel, kebalikan hambatan pengganti sama dengan jumlah kebalikan setiap hambatan."},{"f":"Rp = R1 + R2","benar":false,"alasan":"Ini cara seri. Dalam paralel, memakai kebalikan."},{"f":"Rp = R1 × R2","benar":false,"alasan":"Ini hasil kali. Dalam paralel, memakai kebalikan."}],"hitung":{"diketahui":"R1 = 6 Ω · R2 = 3 Ω","lhs":"Rp","ekspresi":"1 ÷ (1 ÷ 6 + 1 ÷ 3)","satuan":"Ω","jawaban":2,"salah":[{"nilai":9,"pesan":"Itu penjumlahan, cara seri. Paralel memakai kebalikan."},{"nilai":18,"pesan":"Itu hasil kali. Paralel memakai kebalikan."}],"petunjuk":"Hitung kebalikan tiap hambatan, jumlahkan, lalu balikkan lagi.","penjelasan":"1/Rp = 1/6 + 1/3 = 1/2, jadi Rp = 2 Ω."}},{"id":"paralel-arus-cabang","kelas":"9","topik":"Listrik","judul":"Arus pada cabang paralel","cerita":"Hambatan 3 Ω dan hambatan lain 6 Ω disusun paralel, lalu dihubungkan ke sumber tegangan 12 V. Berapa kuat arus yang melalui hambatan 3 Ω?","besaran":[{"teks":"12 V","sym":"V","nama":"tegangan sumber","satuan":"V","ket":"tegangan sumber, satuannya volt","konv":"","catatan":""},{"teks":"3 Ω","sym":"R2","nama":"hambatan cabang","satuan":"Ω","ket":"hambatan pada cabang yang ditanya","konv":"","catatan":""}],"pengecoh":[{"teks":"6 Ω","ket":"hambatan cabang lain, tidak dipakai untuk arus 3 Ω"}],"tanya":{"teks":"kuat arus yang melalui hambatan 3 Ω"},"rumus":[{"f":"I2 = V ÷ R2","benar":true,"alasan":"Pada paralel, tegangan tiap cabang sama dengan tegangan sumber. Arus cabang = V dibagi hambatan cabang."},{"f":"I2 = V × R2","benar":false,"alasan":"Hasil kali tidak menghasilkan arus."},{"f":"I2 = V ÷ (R1 + R2)","benar":false,"alasan":"Itu cara seri. Dalam paralel, tiap cabang mendapat tegangan yang sama."}],"hitung":{"diketahui":"V = 12 V · R2 = 3 Ω","lhs":"I2","ekspresi":"12 ÷ 3","satuan":"A","jawaban":4,"salah":[{"nilai":2,"pesan":"Itu arus melalui hambatan 6 Ω, bukan 3 Ω."},{"nilai":36,"pesan":"Itu hasil kali. Arus dicari dengan membagi tegangan dengan hambatan cabangnya."}],"petunjuk":"Bagi tegangan sumber dengan hambatan cabang yang ditanya.","penjelasan":"I2 = V ÷ R2 = 12 ÷ 3 = 4 A."}},{"id":"coulomb-gaya","kelas":"9","topik":"Listrik","judul":"Gaya antara dua muatan","cerita":"Muatan q1 = 2 C dan q2 = 3 C terpisah sejauh 3 m. Konstanta k = 9 × 10⁹ Nm²/C². Percobaan ini dilakukan di ruang laboratorium. Berapa gaya Coulomb antara kedua muatan?","besaran":[{"teks":"2 C","sym":"q1","nama":"muatan pertama","satuan":"C","ket":"muatan pertama, satuannya coulomb","konv":"","catatan":""},{"teks":"3 C","sym":"q2","nama":"muatan kedua","satuan":"C","ket":"muatan kedua, satuannya coulomb","konv":"","catatan":""},{"teks":"3 m","sym":"r","nama":"jarak","satuan":"m","ket":"jarak antara kedua muatan, satuannya meter","konv":"","catatan":""},{"teks":"9 × 10⁹ Nm²/C²","sym":"k","nama":"konstanta Coulomb","satuan":"Nm²/C²","ket":"konstanta Coulomb","konv":"","catatan":""}],"pengecoh":[{"teks":"ruang laboratorium","ket":"tempat, tidak dipakai menghitung"}],"tanya":{"teks":"gaya Coulomb antara kedua muatan"},"rumus":[{"f":"Fc = k × q1 × q2 ÷ r²","benar":true,"alasan":"Gaya Coulomb sebanding dengan hasil kali muatan dan berbanding terbalik dengan kuadrat jarak."},{"f":"Fc = k × (q1 + q2) ÷ r²","benar":false,"alasan":"Muatan dikalikan, bukan dijumlahkan."},{"f":"Fc = k × q1 ÷ (q2 × r²)","benar":false,"alasan":"Muatan kedua seharusnya dikalikan, bukan dibagi."}],"hitung":{"diketahui":"q1 = 2 C · q2 = 3 C · r = 3 m · k = 9 × 10⁹","lhs":"Fc","ekspresi":"9000000000 × 2 × 3 ÷ (3 × 3)","satuan":"N","jawaban":6000000000,"salah":[{"nilai":18000000000,"pesan":"Angka ini muncul kalau jarak hanya dibagi r, bukan r². Jarak dikuadratkan dalam rumus Coulomb."}],"petunjuk":"Jarak harus dikuadratkan sebelum dibagi.","penjelasan":"Fc = k × q1 × q2 ÷ r² = 9 × 10⁹ × 2 × 3 ÷ 9 = 6 × 10⁹ N."}},{"id":"coulomb-jarak","kelas":"9","topik":"Listrik","judul":"Jarak diubah, gaya berubah","cerita":"Gaya Coulomb antara dua muatan sebesar 6 × 10⁹ N ketika jaraknya 3 m. Jarak kemudian diubah menjadi 6 m. Muatan tidak diubah. Berapa gaya Coulomb setelah jaraknya diubah?","besaran":[{"teks":"6 × 10⁹ N","sym":"F1","nama":"gaya awal","satuan":"N","ket":"gaya Coulomb awal, satuannya newton","konv":"","catatan":""},{"teks":"3 m","sym":"r1","nama":"jarak awal","satuan":"m","ket":"jarak awal, satuannya meter","konv":"","catatan":""},{"teks":"6 m","sym":"r2","nama":"jarak baru","satuan":"m","ket":"jarak baru, satuannya meter","konv":"","catatan":""}],"pengecoh":[],"tanya":{"teks":"gaya Coulomb setelah jaraknya diubah"},"rumus":[{"f":"F2 = F1 × (r1 ÷ r2)²","benar":true,"alasan":"Gaya berbanding terbalik dengan kuadrat jarak, sehingga F2 = F1 × (r1 ÷ r2)²."},{"f":"F2 = F1 × (r2 ÷ r1)²","benar":false,"alasan":"Ini kebalikannya. Jarak yang lebih besar membuat gaya lebih kecil."},{"f":"F2 = F1 × (r1 ÷ r2)","benar":false,"alasan":"Pangkatnya kurang. Gaya berbanding terbalik dengan kuadrat jarak, bukan jarak biasa."}],"hitung":{"diketahui":"F1 = 6 × 10⁹ N · r1 = 3 m · r2 = 6 m","lhs":"F2","ekspresi":"6000000000 ÷ ((6 ÷ 3) × (6 ÷ 3))","satuan":"N","jawaban":1500000000,"salah":[{"nilai":3000000000,"pesan":"Itu hasil bagi dua. Gaya berbanding terbalik dengan kuadrat jarak, jadi jarak dua kali lipat membuat gaya turun empat kali."}],"petunjuk":"Jarak dua kali lipat membuat gaya turun empat kali.","penjelasan":"F2 = F1 × (r1 ÷ r2)² = 6 × 10⁹ × (3 ÷ 6)² = 1,5 × 10⁹ N."}},{"id":"medan-listrik","kelas":"9","topik":"Listrik","judul":"Kuat medan di sekitar muatan","cerita":"Sebuah muatan titik Q = 4 C berada di udara. Titik P berjarak 2 m dari muatan itu. Konstanta k = 9 × 10⁹ Nm²/C². Berapa kuat medan listrik di titik P?","besaran":[{"teks":"4 C","sym":"Q","nama":"muatan sumber","satuan":"C","ket":"muatan yang menghasilkan medan, satuannya coulomb","konv":"","catatan":""},{"teks":"2 m","sym":"r","nama":"jarak ke titik P","satuan":"m","ket":"jarak dari muatan ke titik P, satuannya meter","konv":"","catatan":""},{"teks":"9 × 10⁹ Nm²/C²","sym":"k","nama":"konstanta Coulomb","satuan":"Nm²/C²","ket":"konstanta Coulomb","konv":"","catatan":""}],"pengecoh":[],"tanya":{"teks":"kuat medan listrik di titik P"},"rumus":[{"f":"E = k × Q ÷ r²","benar":true,"alasan":"Kuat medan listrik sama dengan konstanta dikali muatan dibagi kuadrat jarak."},{"f":"E = k × Q × r²","benar":false,"alasan":"Jarak seharusnya dibagi, bukan dikali."},{"f":"E = k × Q ÷ r","benar":false,"alasan":"Jarak harus dikuadratkan."}],"hitung":{"diketahui":"Q = 4 C · r = 2 m · k = 9 × 10⁹","lhs":"E","ekspresi":"9000000000 × 4 ÷ (2 × 2)","satuan":"N/C","jawaban":9000000000,"salah":[{"nilai":18000000000,"pesan":"Angka ini muncul kalau jarak hanya dibagi, bukan dikuadratkan."}],"petunjuk":"Kuadratkan jarak sebelum membagi.","penjelasan":"E = k × Q ÷ r² = 9 × 10⁹ × 4 ÷ 4 = 9 × 10⁹ N/C."}},{"id":"potensial-listrik","kelas":"9","topik":"Listrik","judul":"Beda potensial dari usaha","cerita":"Untuk memindahkan muatan 2 C dari titik A ke titik B, diperlukan energi listrik sebesar 60 J. Perpindahan itu melalui lintasan lurus dan pendek. Berapa beda potensial antara titik A dan B?","besaran":[{"teks":"2 C","sym":"Q","nama":"muatan","satuan":"C","ket":"muatan yang dipindahkan, satuannya coulomb","konv":"","catatan":""},{"teks":"60 J","sym":"W","nama":"energi listrik","satuan":"J","ket":"energi listrik yang diperlukan, satuannya joule","konv":"","catatan":""}],"pengecoh":[{"teks":"lintasan lurus dan pendek","ket":"tidak dipakai menghitung"}],"tanya":{"teks":"beda potensial antara titik A dan B"},"rumus":[{"f":"ΔV = W ÷ Q","benar":true,"alasan":"Beda potensial adalah energi dibagi muatan."},{"f":"ΔV = W × Q","benar":false,"alasan":"Hasil kali tidak menghasilkan beda potensial."},{"f":"ΔV = Q ÷ W","benar":false,"alasan":"Terbalik. Energi dibagi muatan."}],"hitung":{"diketahui":"W = 60 J · Q = 2 C","lhs":"ΔV","ekspresi":"60 ÷ 2","satuan":"V","jawaban":30,"salah":[{"nilai":120,"pesan":"Itu hasil kali. Beda potensial dicari dengan membagi energi dengan muatan."}],"petunjuk":"Bagi energi dengan muatan.","penjelasan":"ΔV = W ÷ Q = 60 ÷ 2 = 30 V."}},{"id":"hambatan-jenis","kelas":"9","topik":"Listrik","judul":"Hambatan kawat tembaga","cerita":"Kawat tembaga dengan hambatan jenis 1,72 × 10⁻⁸ Ωm memiliki panjang 100 m dan luas penampang 2 × 10⁻⁶ m². Harga kabel itu Rp50.000. Berapa hambatan kawat tersebut?","besaran":[{"teks":"1,72 × 10⁻⁸ Ωm","sym":"ρ","nama":"hambatan jenis","satuan":"Ωm","ket":"hambatan jenis tembaga, satuannya ohm meter","konv":"","catatan":""},{"teks":"100 m","sym":"L","nama":"panjang kawat","satuan":"m","ket":"panjang kawat, satuannya meter","konv":"","catatan":""},{"teks":"2 × 10⁻⁶ m²","sym":"A","nama":"luas penampang","satuan":"m²","ket":"luas penampang kawat, satuannya meter persegi","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp50.000","ket":"harga kabel, tidak dipakai menghitung"}],"tanya":{"teks":"hambatan kawat tersebut"},"rumus":[{"f":"R = ρ × L ÷ A","benar":true,"alasan":"Hambatan kawat berbanding lurus dengan panjang dan hambatan jenis, serta berbanding terbalik dengan luas penampang."},{"f":"R = ρ × A ÷ L","benar":false,"alasan":"Terbalik. Hambatan berbanding lurus dengan panjang, bukan luas."},{"f":"R = ρ ÷ (L × A)","benar":false,"alasan":"Panjang dan luas tidak dikalikan di penyebut."}],"hitung":{"diketahui":"ρ = 1,72 × 10⁻⁸ Ωm · L = 100 m · A = 2 × 10⁻⁶ m²","lhs":"R","ekspresi":"1,72e-8 × 100 ÷ 2e-6","satuan":"Ω","jawaban":0.86,"salah":[{"nilai":0.00000172,"pesan":"Itu lupa dibagi luas penampang."}],"petunjuk":"Kalikan hambatan jenis dengan panjang, lalu bagi dengan luas penampang.","penjelasan":"R = ρ × L ÷ A = 1,72 × 10⁻⁸ × 100 ÷ 2 × 10⁻⁶ = 0,86 Ω."}},{"id":"induksi-ggl","kelas":"9","topik":"Magnet","judul":"GGL dari perubahan fluks","cerita":"Sebuah kumparan memiliki 200 lilitan. Fluks magnetik yang melalui kumparan berubah sebesar 0,5 Wb dalam waktu 0,1 s. Kumparan itu dibeli seharga Rp15.000. Berapa besar GGL induksi yang timbul?","besaran":[{"teks":"200 lilitan","sym":"N","nama":"jumlah lilitan","satuan":"lilitan","ket":"jumlah lilitan kumparan (N)","konv":"","catatan":""},{"teks":"0,5 Wb","sym":"ΔΦ","nama":"perubahan fluks","satuan":"Wb","ket":"perubahan fluks magnetik, satuannya weber","konv":"","catatan":""},{"teks":"0,1 s","sym":"Δt","nama":"selang waktu","satuan":"s","ket":"selang waktu perubahan, satuannya sekon","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp15.000","ket":"harga kumparan, tidak dipakai menghitung"}],"tanya":{"teks":"besar GGL induksi yang timbul"},"rumus":[{"f":"ε = N × ΔΦ ÷ Δt","benar":true,"alasan":"Hukum Faraday: GGL induksi sebanding dengan jumlah lilitan dan laju perubahan fluks."},{"f":"ε = N ÷ (ΔΦ × Δt)","benar":false,"alasan":"Terbalik. GGL bertambah jika lilitan atau perubahan fluks bertambah."},{"f":"ε = ΔΦ ÷ (N × Δt)","benar":false,"alasan":"Lilitan seharusnya dikalikan, bukan dibagi."}],"hitung":{"diketahui":"N = 200 · ΔΦ = 0,5 Wb · Δt = 0,1 s","lhs":"ε","ekspresi":"200 × 0,5 ÷ 0,1","satuan":"V","jawaban":1000,"salah":[{"nilai":100,"pesan":"Lupa membagi dengan selang waktu."}],"petunjuk":"Kalikan lilitan dengan perubahan fluks, lalu bagi dengan selang waktu.","penjelasan":"ε = N × ΔΦ ÷ Δt = 200 × 0,5 ÷ 0,1 = 1000 V."}},{"id":"induksi-fluks-berubah","kelas":"9","topik":"Magnet","judul":"Fluks berubah dari dua nilai","cerita":"Sebuah kumparan 100 lilitan dilalui fluks magnetik yang berubah dari 0,8 Wb menjadi 0,2 Wb dalam waktu 0,4 s. Pada saat percobaan, lampu di ruangan menyala terang. Berapa besar GGL induksi yang timbul?","besaran":[{"teks":"100 lilitan","sym":"N","nama":"jumlah lilitan","satuan":"lilitan","ket":"jumlah lilitan kumparan (N)","konv":"","catatan":""},{"teks":"0,8 Wb","sym":"Φ1","nama":"fluks awal","satuan":"Wb","ket":"fluks awal, satuannya weber","konv":"","catatan":""},{"teks":"0,2 Wb","sym":"Φ2","nama":"fluks akhir","satuan":"Wb","ket":"fluks akhir, satuannya weber","konv":"","catatan":""},{"teks":"0,4 s","sym":"Δt","nama":"selang waktu","satuan":"s","ket":"selang waktu perubahan, satuannya sekon","konv":"","catatan":""}],"pengecoh":[{"teks":"lampu di ruangan","ket":"tidak dipakai menghitung"}],"tanya":{"teks":"besar GGL induksi yang timbul"},"rumus":[{"f":"ε = N × ΔΦ ÷ Δt, dengan ΔΦ = Φ2 − Φ1","benar":true,"alasan":"Perubahan fluks adalah selisih fluks akhir dan awal, lalu dipakai di rumus GGL."},{"f":"ε = N × Φ1 ÷ Δt","benar":false,"alasan":"Yang dipakai adalah perubahan fluks, bukan fluks awal."},{"f":"ε = N ÷ Δt","benar":false,"alasan":"Perubahan fluks tidak ikut dihitung."}],"hitung":{"diketahui":"N = 100 · Φ1 = 0,8 Wb · Φ2 = 0,2 Wb · Δt = 0,4 s","lhs":"ε","ekspresi":"100 × (0,8 - 0,2) ÷ 0,4","satuan":"V","jawaban":150,"salah":[{"nilai":200,"pesan":"Itu hanya memakai fluks awal. Yang dipakai adalah selisih fluks."}],"petunjuk":"Cari dulu selisih fluks, lalu masukkan ke rumus.","penjelasan":"ΔΦ = 0,8 − 0,2 = 0,6 Wb. ε = 100 × 0,6 ÷ 0,4 = 150 V."}},{"id":"lorentz-sudut","kelas":"9","topik":"Magnet","judul":"Gaya Lorentz dengan sudut","cerita":"Kawat sepanjang 0,5 m dialiri arus 2 A di dalam medan magnet 0,4 T. Arah arus membentuk sudut 30° terhadap arah medan magnet. Sebuah kawat dicat hitam. Berapa gaya Lorentz pada kawat?","besaran":[{"teks":"0,5 m","sym":"L","nama":"panjang kawat","satuan":"m","ket":"panjang kawat di dalam medan, satuannya meter","konv":"","catatan":""},{"teks":"2 A","sym":"I","nama":"kuat arus","satuan":"A","ket":"kuat arus pada kawat, satuannya ampere","konv":"","catatan":""},{"teks":"0,4 T","sym":"B","nama":"medan magnet","satuan":"T","ket":"kuat medan magnet, satuannya tesla","konv":"","catatan":""},{"teks":"30°","sym":"θ","nama":"sudut","satuan":"°","ket":"sudut antara arah arus dan medan magnet","konv":"","catatan":""}],"pengecoh":[{"teks":"kawat dicat hitam","ket":"tidak dipakai menghitung"}],"tanya":{"teks":"gaya Lorentz pada kawat"},"rumus":[{"f":"F = B × I × L × sin θ","benar":true,"alasan":"Gaya Lorentz bergantung pada sudut. Nilai sin 30° adalah 0,5."},{"f":"F = B × I × L ÷ sin θ","benar":false,"alasan":"Sinus dibagi, bukan dikali."},{"f":"F = B × I × L × cos θ","benar":false,"alasan":"Yang dipakai sinus, bukan cosinus."}],"hitung":{"diketahui":"B = 0,4 T · I = 2 A · L = 0,5 m · θ = 30° (sin 30° = 0,5)","lhs":"F","ekspresi":"0,5 × 2 × 0,4 × 0,5","satuan":"N","jawaban":0.2,"salah":[{"nilai":0.4,"pesan":"Itu jika arus tegak lurus medan (sin 90° = 1). Di soal sudutnya 30°."}],"petunjuk":"Ingat, sin 30° = 0,5.","penjelasan":"F = B × I × L × sin θ = 0,4 × 2 × 0,5 × 0,5 = 0,2 N."}}]}</script>
<script>
(function(){
'use strict';
var KEY='cjs.soal.v1',PINKEY='cjs.pin',DONEKEY='cjs.done',DEFPIN='1234';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
var PAL=['--q1','--q2','--q3','--q4'];
function colorOf(k){if(k==='ask')return '--ask';var n=parseInt(String(k).slice(1),10)||0;return PAL[n%PAL.length];}
function fmt(n){return String(n).replace('.',',');}
function parseNum(s){
  s=String(s==null?'':s).trim().replace(/\s/g,'');
  if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  s=s.replace(',','.');
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}
function newId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- Data soal ---------- */
function blank(){return {id:'',kelas:'9',variasi:[],topik:'',judul:'',cerita:'',
  besaran:[{teks:'',sym:'',nama:'',satuan:'',ket:'',konv:'',catatan:''}],pengecoh:[],tanya:{teks:''},
  rumus:[{f:'',benar:true,alasan:''},{f:'',benar:false,alasan:''}],
  hitung:{diketahui:'',lhs:'',ekspresi:'',satuan:'',jawaban:'',angka:'',salah:[],petunjuk:'',penjelasan:''}};}
function arr(x){return Array.isArray(x)?x:[];}
function str(x){return x==null?'':String(x);}
function norm(s){
  s=s||{};var h=s.hitung||{};
  return {
    id:str(s.id)||newId(),kelas:str(s.kelas)||'9',
    variasi:arr(s.variasi).map(function(v){v=v||{};return {nama:str(v.nama),
      min:typeof v.min==='number'?v.min:parseNum(v.min),maks:typeof v.maks==='number'?v.maks:parseNum(v.maks),
      langkah:typeof v.langkah==='number'?v.langkah:parseNum(v.langkah),rumus:str(v.rumus)};}),
    topik:str(s.topik),judul:str(s.judul),cerita:str(s.cerita),
    besaran:arr(s.besaran).map(function(b){b=b||{};return {teks:str(b.teks),sym:str(b.sym),nama:str(b.nama),satuan:str(b.satuan),ket:str(b.ket),konv:str(b.konv),catatan:str(b.catatan)};}),
    pengecoh:arr(s.pengecoh).map(function(d){d=d||{};return {teks:str(d.teks),ket:str(d.ket)};}),
    tanya:{teks:str((s.tanya||{}).teks)},
    rumus:arr(s.rumus).map(function(r){r=r||{};return {f:str(r.f),benar:!!r.benar,alasan:str(r.alasan)};}),
    hitung:{diketahui:str(h.diketahui),lhs:str(h.lhs),ekspresi:str(h.ekspresi),satuan:str(h.satuan),
      jawaban:typeof h.jawaban==='number'?h.jawaban:parseNum(h.jawaban),
      salah:arr(h.salah).map(function(x){x=x||{};return {nilai:typeof x.nilai==='number'?x.nilai:parseNum(x.nilai),pesan:str(x.pesan),rumus:str(x.rumus)};}),
      angka:str(h.angka),petunjuk:str(h.petunjuk),penjelasan:str(h.penjelasan)}
  };
}
function toDraft(s){
  var d=JSON.parse(JSON.stringify(s));
  d.hitung.jawaban=isNaN(s.hitung.jawaban)?'':fmt(s.hitung.jawaban);
  d.hitung.salah=s.hitung.salah.map(function(x,i){return {nilai:isNaN(x.nilai)?'':fmt(x.nilai),pesan:d.hitung.salah[i].pesan,rumus:x.rumus};});
  return d;
}
function fromDraft(d){
  var s=JSON.parse(JSON.stringify(d));
  var tr=function(o){for(var k in o){if(typeof o[k]==='string')o[k]=o[k].trim();}};
  tr(s);s.besaran.forEach(tr);s.pengecoh.forEach(tr);tr(s.tanya);s.rumus.forEach(tr);tr(s.hitung);s.hitung.salah.forEach(tr);
  s.hitung.jawaban=parseNum(s.hitung.jawaban);
  s.hitung.salah.forEach(function(x){x.nilai=parseNum(x.nilai);});
  s.variasi.forEach(tr);
  s.variasi.forEach(function(v){v.min=parseNum(v.min);v.maks=parseNum(v.maks);v.langkah=parseNum(v.langkah);});
  return s;
}
/* mencari posisi tiap penanda di dalam cerita */
function locate(s){
  var toks=[],errs=[],used=[];
  s.besaran.forEach(function(b,i){toks.push({kind:'b'+i,txt:b.teks,ref:b,idx:i});});
  s.pengecoh.forEach(function(d,i){toks.push({kind:'decoy',txt:d.teks,ref:d,idx:i});});
  toks.push({kind:'ask',txt:s.tanya.teks,ref:s.tanya,idx:0});
  toks.forEach(function(t){
    if(!t.txt)return;
    var from=0,pos=-1,i,j;
    while(true){
      i=s.cerita.indexOf(t.txt,from);if(i<0)break;
      j=i+t.txt.length;
      var clash=used.some(function(u){return i<u.j&&j>u.i;});
      if(!clash){pos=i;break;}
      from=i+1;
    }
    if(pos<0){errs.push('“'+t.txt+'” tidak ditemukan di cerita, atau bertumpukan dengan penanda lain. Ketik persis seperti di cerita.');return;}
    t.i=pos;t.j=pos+t.txt.length;used.push(t);
  });
  return {toks:toks,errs:errs};
}
function check(s){
  var e=[],syms={};
  if(!s.judul)e.push('Judul soal belum diisi.');
  if(!s.topik)e.push('Topik belum diisi.');
  if(['7','8','9'].indexOf(s.kelas)<0)e.push('Kelas harus 7, 8, atau 9.');
  if(!s.cerita)e.push('Cerita soal belum diisi.');
  if(!s.besaran.length)e.push('Tambahkan minimal satu besaran.');
  s.besaran.forEach(function(b,i){var n='Besaran '+(i+1)+': ';
    if(!b.teks)e.push(n+'teks di cerita belum diisi.');
    if(!b.sym)e.push(n+'simbol belum diisi.');
    else if(syms[b.sym])e.push(n+'simbol “'+b.sym+'” dipakai dua kali.');
    syms[b.sym]=1;
    if(!b.nama)e.push(n+'nama besaran belum diisi.');
  });
  s.pengecoh.forEach(function(d,i){if(!d.teks)e.push('Pengecoh '+(i+1)+': teks belum diisi.');});
  if(!s.tanya.teks)e.push('Kalimat yang ditanya belum diisi.');
  if(s.cerita)locate(s).errs.forEach(function(x){e.push(x);});
  if(s.rumus.length<2)e.push('Isi minimal dua pilihan rumus.');
  s.rumus.forEach(function(r,i){if(!r.f)e.push('Rumus '+(i+1)+' belum diisi.');});
  if(s.rumus.filter(function(r){return r.benar;}).length!==1)e.push('Pilih tepat satu rumus yang benar.');
  var h=s.hitung;
  if(!h.lhs)e.push('Hitung: bagian kiri persamaan belum diisi (contoh: Ek = Ep).');
  if(!h.ekspresi)e.push('Hitung: isi perhitungan dengan angka belum diisi.');
  if(!h.satuan)e.push('Hitung: satuan jawaban belum diisi.');
  if(!h.angka&&(typeof h.jawaban!=='number'||isNaN(h.jawaban)))e.push('Hitung: jawaban akhir harus berupa angka.');
  h.salah.forEach(function(x,i){
    if(!x.rumus&&(typeof x.nilai!=='number'||isNaN(x.nilai)))e.push('Jawaban salah '+(i+1)+': nilainya harus berupa angka.');
    if(!x.pesan)e.push('Jawaban salah '+(i+1)+': pesan petunjuk belum diisi.');
  });
  var vn=s.variasi||[],names=[];
  vn.forEach(function(v,i){var n='Variasi '+(i+1)+': ';
    if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(v.nama||''))e.push(n+'nama harus huruf tanpa spasi, misalnya massa.');
    else if(names.indexOf(v.nama)>=0)e.push(n+'nama “'+v.nama+'” dipakai dua kali.');
    names.push(v.nama);
    if(v.rumus){if(!safeExpr(v.rumus,names))e.push(n+'rumus turunan hanya boleh berisi nama variasi di atasnya, angka, + − × ÷ dan kurung.');}
    else if(!Number.isFinite(v.min)||!Number.isFinite(v.maks)||!Number.isFinite(v.langkah))e.push(n+'isi min, maks, dan langkah dengan angka, atau isi rumus turunan.');
    else if(v.langkah<=0||v.maks<v.min)e.push(n+'langkah harus lebih dari 0, dan maks tidak boleh kurang dari min.');
  });
  var txt=JSON.stringify(s),mm,re=/\{(\w+)\}/g;
  while((mm=re.exec(txt))){if(names.indexOf(mm[1])<0){e.push('Teks memakai {'+mm[1]+'}, tetapi belum ada variasi bernama '+mm[1]+'.');break;}}
  if(s.hitung.angka&&!safeExpr(s.hitung.angka,vn.map(function(v){return v.nama;})))e.push('Rumus jawaban hanya boleh berisi nama variasi, angka, + − × ÷ dan kurung.');
  if(vn.length||s.hitung.angka){
    var inst=instanceOf(s,'min');
    if(Number.isNaN(inst.hitung.jawaban))e.push('Rumus jawaban belum bisa dihitung. Periksa nama variasi dan tanda operasinya.');
    inst.hitung.salah.forEach(function(x,i){if(Number.isNaN(x.nilai))e.push('Jawaban salah '+(i+1)+': rumusnya belum bisa dihitung.');});
    if(vn.length)locate(inst).errs.forEach(function(x){e.push(x);});
  }
  return e;
}
function compile(s){
  var L=locate(s),ok=L.toks.filter(function(t){return t.i!=null;}).sort(function(a,b){return a.i-b.i;});
  var story=[],pos=0;
  ok.forEach(function(t){
    if(t.i>pos)story.push(s.cerita.slice(pos,t.i));
    if(t.kind==='ask')story.push({k:'ask',id:'tq',txt:t.txt,what:'kalimat pertanyaan'});
    else if(t.kind==='decoy')story.push({k:'decoy',id:'d'+t.idx,txt:t.txt,what:t.ref.ket||'info yang tidak dipakai menghitung'});
    else story.push({k:t.kind,id:'t'+t.idx,txt:t.txt,what:t.ref.ket||t.ref.nama,conv:t.ref.konv,note:t.ref.catatan});
    pos=t.j;
  });
  if(pos<s.cerita.length)story.push(s.cerita.slice(pos));
  var slots=s.besaran.map(function(b,i){return {k:'b'+i,sym:b.sym,name:b.nama,u:b.satuan?'satuan '+b.satuan:''};});
  slots.push({k:'ask',sym:'?',name:'Ditanya',u:'jawab dalam '+s.hitung.satuan});
  var h=s.hitung;
  return {id:s.id,judul:s.judul,topik:s.topik,story:story,slots:slots,
    formulas:s.rumus.map(function(r){return {f:r.f,ok:r.benar,why:r.alasan};}),
    calc:{given:h.diketahui,lhs:h.lhs,expr:h.ekspresi,unit:h.satuan,ans:h.jawaban,
      alt:h.salah.map(function(x){return {v:x.nilai,msg:x.pesan};}),tip:h.petunjuk||'Hitung lagi dengan teliti.',explain:h.penjelasan}};
}

/* ---------- Variasi angka ---------- */
var SRC={};
var SAFE=/^[0-9A-Za-z_.+\-*\/()\s×÷,]*$/;
function normExpr(x){return String(x==null?'':x).replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');}
/* rumus hanya boleh memakai angka, operator, kurung, dan nama variasi yang sudah didefinisikan */
function safeExpr(x,names){
  var e=normExpr(x);
  var ids=e.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[];
  return SAFE.test(e)&&ids.every(function(id){return (names||[]).indexOf(id)>=0;});
}
function evalAngka(expr,vals){
  var e=normExpr(expr),names=Object.keys(vals);
  if(!safeExpr(e,names))return NaN;
  try{
    var f=new Function(names.join(','),'"use strict";return ('+e+');');
    var r=f.apply(null,names.map(function(k){return vals[k];}));
    return typeof r==='number'&&isFinite(r)?Math.round(r*1000)/1000:NaN;
  }catch(err){return NaN;}
}
/* mengganti {nama} dengan angka acak (atau nilai minimum saat mode 'min') */
function instanceOf(s,mode){
  var vn=s.variasi||[];
  if(!vn.length&&!(s.hitung&&s.hitung.angka))return s;
  var vals={};
  vn.forEach(function(v){
    if(v.rumus){vals[v.nama]=evalAngka(v.rumus,vals);return;}
    var n=Math.max(0,Math.floor((v.maks-v.min)/v.langkah+1e-9));
    var k=mode==='min'?0:Math.floor(Math.random()*(n+1));
    vals[v.nama]=Math.round((v.min+k*v.langkah)*1000)/1000;
  });
  var sub=function(t){return String(t==null?'':t).replace(/\{(\w+)\}/g,function(m,k){return Object.prototype.hasOwnProperty.call(vals,k)?fmt(vals[k]):m;});};
  var o=JSON.parse(JSON.stringify(s));
  o.cerita=sub(o.cerita);
  o.besaran.forEach(function(b){b.teks=sub(b.teks);b.konv=sub(b.konv);b.catatan=sub(b.catatan);b.ket=sub(b.ket);});
  o.pengecoh.forEach(function(d){d.teks=sub(d.teks);d.ket=sub(d.ket);});
  o.tanya.teks=sub(o.tanya.teks);
  var h=o.hitung;
  h.diketahui=sub(h.diketahui);h.ekspresi=sub(h.ekspresi);h.petunjuk=sub(h.petunjuk);h.penjelasan=sub(h.penjelasan);
  if(h.angka)h.jawaban=evalAngka(h.angka,vals);
  h.salah=h.salah.map(function(x){return {nilai:x.rumus?evalAngka(x.rumus,vals):x.nilai,pesan:sub(x.pesan)};});
  return o;
}

function newState(p){

  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  var placed={},bs=p.slots.filter(function(s){return s.k!=='ask';}),msg='Mulai dari cerita: sentuh satu angka, lalu sentuh kotak yang cocok.';
  if(tingkat==='mudah'){
    bs.slice(0,Math.ceil(bs.length/2)).forEach(function(s){
      var t=p.story.find(function(x){return typeof x!=='string'&&x.k===s.k;});

    });
    msg='Tingkat mudah: sebagian kotak sudah terisi. Lengkapi sisanya, lalu coret info yang tidak dipakai.';
  }
  return {placed:placed,err:0,topicOk:false,tTried:[],matMsg:null,crossed:[],fTried:[],formulaOk:false,solved:false,input:'',calcMsg:null,order:order,
