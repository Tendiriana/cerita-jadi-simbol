<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TakTik IPA</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Latihan soal cerita IPA SMP kelas 7, 8, dan 9: ubah kalimat soal menjadi besaran, pilih rumus, lalu hitung.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TakTik IPA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Gaya buku tulis: kertas bergaris, tinta biru pulpen, judul dan angka bertulisan tangan, merah untuk catatan guru.
   Saat ujian dipakai gaya lembar kerja (body.lks): hitam putih dengan satu warna merah.
   Huruf disimpan di folder fonts supaya tetap tampil saat offline (semuanya berlisensi SIL OFL). */
@font-face{font-family:'Kalam';font-weight:400;font-display:swap;src:url(fonts/kalam-400.woff2) format('woff2')}
@font-face{font-family:'Kalam';font-weight:700;font-display:swap;src:url(fonts/kalam-700.woff2) format('woff2')}
@font-face{font-family:'Andika';font-weight:400;font-display:swap;src:url(fonts/andika-400.woff2) format('woff2')}
@font-face{font-family:'Andika';font-weight:700;font-display:swap;src:url(fonts/andika-700.woff2) format('woff2')}
@font-face{font-family:'Gochi Hand';font-weight:400;font-display:swap;src:url(fonts/gochi-hand.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-weight:600 700;font-display:swap;src:url(fonts/source-serif-4.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(fonts/plex-mono-500.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:swap;src:url(fonts/plex-mono-600.woff2) format('woff2')}
:root{
  --bg:#FBF8F0; --surface:#FFFDF7; --sunk:#F2EDE0; --ink:#24304A; --ink2:#5D6680; --line:#E3E0D6; --line2:#A7B4C9;
  --acc:#1F3B8A; --acc-ink:#FFFFFF; --acc-soft:#E7ECF7; --raise:#FFFDF7;
  --pen:#B2402F; --rule:#DCE4EF; --margin:#EBB0AA;
  --hl:#FFF0A0; --hl-ink:#24304A;
  --q1:#2459C9; --q2:#0E8050; --q3:#C2650A; --q4:#7445D6; --ask:#C92A63;
  --warn:#8A5300; --warnbg:#FBF0D9; --ok:#11804C; --okbg:#E4F2E6; --bad:#BE3420; --badbg:#FBEAE4; --info:#2459C9; --infobg:#E9EFFA;
  --shadow:none;
  --f-body:'Andika',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Kalam','Andika',system-ui,sans-serif;
  --f-hand:'Kalam','Andika',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151A24; --surface:#1B2130; --sunk:#222A3A; --ink:#E4E9F5; --ink2:#9AA6BF; --line:#2A3346; --line2:#4A5770;
  --acc:#8FB0FF; --acc-ink:#0E1424; --acc-soft:#1F2B48; --raise:#252E40;
  --pen:#FF9A8A; --rule:#222A39; --margin:#5A3436;
  --hl:#E9C64B; --hl-ink:#14191F;
  --q1:#7AA7FF; --q2:#3CCB95; --q3:#F59E4E; --q4:#B596FF; --ask:#FF7AA8;
  --warn:#F2B84B; --warnbg:#35290F; --ok:#4CC38A; --okbg:#122E1F; --bad:#FF8B76; --badbg:#3A1C17; --info:#7AA7FF; --infobg:#16243D; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151A24; --surface:#1B2130; --sunk:#222A3A; --ink:#E4E9F5; --ink2:#9AA6BF; --line:#2A3346; --line2:#4A5770;
  --acc:#8FB0FF; --acc-ink:#0E1424; --acc-soft:#1F2B48; --raise:#252E40;
  --pen:#FF9A8A; --rule:#222A39; --margin:#5A3436;
  --hl:#E9C64B; --hl-ink:#14191F;
  --q1:#7AA7FF; --q2:#3CCB95; --q3:#F59E4E; --q4:#B596FF; --ask:#FF7AA8;
  --warn:#F2B84B; --warnbg:#35290F; --ok:#4CC38A; --okbg:#122E1F; --bad:#FF8B76; --badbg:#3A1C17; --info:#7AA7FF; --infobg:#16243D; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-block:0 calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
body.has-nav{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{-webkit-tap-highlight-color:transparent}

/* kepala halaman */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar .brand{flex:1}
.bar .ab{margin-left:auto;flex:none}
.ttl{flex:1;min-width:0;font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;flex:none;display:block}
.brand b{display:block;font-weight:800;font-size:1.02rem;line-height:1.2;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink2);font-size:.8rem;line-height:1.3}
.icon-btn{width:42px;flex:none;padding:0!important;display:inline-grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.eyebrow{font-size:.88rem;font-weight:600;color:var(--ink2);margin:0}
h1{font-weight:800;font-size:clamp(1.75rem,7vw,2.4rem);line-height:1.1;margin:18px 0 6px;letter-spacing:-.025em;text-wrap:balance}
.lede{margin:0 0 4px;max-width:52ch;color:var(--ink2)}
h2.t{font-weight:800;font-size:1.5rem;line-height:1.2;margin:16px 0 2px;letter-spacing:-.015em;text-wrap:balance}

/* contoh di beranda: cerita berubah jadi simbol */
.hero{margin-top:16px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-s{margin:0;font-size:1.02rem;line-height:1.9}
.hero .tk{font-weight:700;padding:1px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 -2px 0 var(--c)}
.hero-sym{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--line2)}
.hero-sym span{font-family:var(--f-mono);font-weight:600;font-size:.98rem;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.hero-sym b{color:var(--c);font-family:var(--f-body);font-weight:800;font-size:1.15rem;margin-right:2px}

/* tombol */
.btn{font:inherit;font-weight:700;font-size:.98rem;background:var(--acc);color:var(--acc-ink);border:1.5px solid transparent;border-radius:12px;padding:11px 18px;min-height:46px;cursor:pointer;transition:background-color .15s,border-color .15s}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink2);filter:none}
.btn.sm{padding:6px 12px;min-height:40px;font-size:.9rem;border-radius:10px}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}

/* kartu dan langkah */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;margin-top:14px;box-shadow:var(--shadow)}
.card.locked{background:var(--sunk);box-shadow:none;border-style:dashed;border-color:var(--line2)}
.card.locked > *:not(.sh){opacity:.7}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:.88rem;display:grid;place-items:center}
.card.locked .num{background:var(--line2);color:var(--surface)}
.sh h2{font-weight:800;font-size:1.15rem;margin:0;line-height:1.25;letter-spacing:-.01em}
.stt{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--ink2);padding:3px 9px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.stt.done{color:var(--ok);background:var(--okbg)}
.mut{color:var(--ink2);font-size:.95rem;margin:0 0 10px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;padding:0;margin:12px 0 2px}
.steps li{font-size:.78rem;font-weight:600;color:var(--ink2)}
.steps li::before{content:'';display:block;height:5px;border-radius:5px;background:var(--line);margin-bottom:6px}
.steps li.done::before{background:var(--acc)}
.steps li.now{color:var(--ink);font-weight:800}
.steps li.now::before{background:color-mix(in srgb,var(--acc) 40%,var(--line))}

/* daftar soal siswa */
.grp h2{font-weight:800;font-size:1.05rem;color:var(--ink);margin:24px 0 8px;letter-spacing:-.01em}
.list{display:grid;gap:8px}
.item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:58px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
.item:hover{border-color:var(--line2)}
.item b{font-weight:700;font-size:1.02rem}
.item small{display:block;color:var(--ink2);font-size:.82rem}
.item .ck{font-weight:700;font-size:.78rem;color:var(--ok);background:var(--okbg);padding:3px 9px;border-radius:999px;white-space:nowrap}
.sum{font-size:.88rem;font-weight:600;color:var(--ink2);margin:16px 0 0}

/* latihan */
.story{font-size:1.1rem;line-height:2.25;margin:4px 0 14px}
.tok{font:inherit;color:inherit;background:transparent;border:0;border-bottom:2.5px dashed var(--line2);padding:1px 4px;margin:0 1px;border-radius:6px 6px 0 0;cursor:pointer;line-height:1.5}
.tok.sel{background:var(--hl);color:var(--hl-ink);border-bottom:2.5px solid var(--hl-ink)}
.tok.on{border-bottom:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);font-weight:700}
.tok.cut{text-decoration:line-through;opacity:.55;border-bottom-style:dotted}
.tok:disabled{cursor:default;color:inherit}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{font:inherit;color:inherit;text-align:left;border:1.5px dashed var(--line2);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:92px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-content:start;align-items:center;transition:border-color .15s,background-color .15s}
.slot:disabled{cursor:default;color:inherit}
.slot .sym{font-weight:800;font-size:1.75rem;line-height:1;color:var(--c);overflow-wrap:anywhere}
.slot .nm{font-size:.88rem;font-weight:600;line-height:1.25;min-width:0}
.slot .nm small{display:block;color:var(--ink2);font-size:.78rem;font-weight:500}
.slot .val{grid-column:1 / -1;font-family:var(--f-mono);font-weight:600;font-size:.95rem;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.slot .val em{font-style:normal;color:var(--c)}
.slot .ph{color:var(--ink2);font-weight:500;font-family:var(--f-body)}
.slot.filled{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.slot.armed{border-color:var(--c);animation:pulse 1.3s ease-in-out infinite}
.slot.coret{grid-column:1 / -1;min-height:0;--c:var(--ink2)}
.slot.coret .sym{font-size:1.35rem}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}}
.fb{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:.97rem;border:0;border-left:4px solid var(--info);background:var(--infobg)}
.fb.ok{border-left-color:var(--ok);background:var(--okbg)}
.fb.bad{border-left-color:var(--bad);background:var(--badbg)}
.fb b{font-weight:800;margin-right:6px}
.fb ul{margin:6px 0 0;padding-left:20px}
.opts{display:grid;gap:8px}
.opt{width:100%;font-family:var(--f-mono);font-weight:600;font-size:1.02rem;text-align:left;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);padding:12px 14px;border-radius:12px;cursor:pointer;min-height:50px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.no{opacity:.55;text-decoration:line-through;cursor:default}
.opt.yes{border-color:var(--ok);background:var(--okbg);cursor:default}
.opt:disabled{color:var(--ink)}
.why{font-size:.92rem;color:var(--ink2);margin:5px 4px 2px}
.eq{font-family:var(--f-mono);font-weight:500;font-size:1rem;margin:6px 0;overflow-wrap:anywhere}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.calc .answ{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.ptitle{display:flex;align-items:center;gap:12px;margin-top:16px}.ptitle h2.t{margin:0 0 2px}.ptitle>div{min-width:0}
.pik{flex:none;width:54px;height:54px;border-radius:16px;background:var(--acc-soft);display:grid;place-items:center;font-size:1.85rem;line-height:1}
.sik{flex:none;font-size:1.35rem;line-height:1}.sik:empty{display:none}
.calc input{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;width:7.5em;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface);color:var(--ink)}
.calc input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}

/* alat belajar */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tools .item{min-height:96px;align-items:flex-start;justify-content:flex-start;flex-direction:column;gap:8px;box-shadow:none;background:var(--sunk);border-color:transparent}
.tools .item:hover{border-color:var(--line2)}
.ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.ti svg{width:20px;height:20px}
.mis{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cnt{font-weight:800;font-size:.85rem;color:var(--bad);white-space:nowrap}
.cnt.good{color:var(--ok)}
.opt.mat{font-family:var(--f-body);font-weight:400}
.opt.mat b{display:block;font-weight:800;font-size:1.08rem}
.opt.mat small{display:block;font-size:.88rem;line-height:1.45;color:var(--ink2);margin-top:3px}
.rep{white-space:pre-wrap;font-family:var(--f-mono);font-size:.82rem;line-height:1.55;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 0;overflow-wrap:anywhere}
.kr{display:grid;gap:10px}
.krow{display:grid;gap:2px;border-bottom:1px solid var(--line);padding-bottom:10px}
.krow:last-child{border-bottom:0}
.kf{font-family:var(--f-mono);font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.kk{font-size:.88rem;color:var(--ink2)}
details.fold{padding:12px 16px}
details.fold summary{cursor:pointer;font-weight:700;list-style:none;min-height:28px;display:flex;align-items:center;gap:8px;color:var(--acc)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.fold[open] summary::before{transform:rotate(45deg)}
details.fold[open] summary{margin-bottom:10px}
.xbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--acc-soft);color:var(--ink);font-weight:700;font-size:.92rem}
.xbar .tm{font-family:var(--f-mono);font-size:1.15rem;color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st{background:var(--sunk);border-radius:12px;padding:12px;min-width:0}
.st b{display:block;font-weight:800;font-size:1.45rem;line-height:1.15;overflow-wrap:anywhere;letter-spacing:-.01em}
.st small{color:var(--ink2);font-size:.82rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{flex:none}
.tabs .btn[aria-current="page"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--sunk);border-radius:14px;margin:12px 0 0}
.seg .chip{font:inherit;font-weight:700;font-size:.92rem;border:0;background:transparent;color:var(--ink2);border-radius:10px;min-height:42px;padding:6px 8px;cursor:pointer;transition:background-color .15s,color .15s,box-shadow .15s}
.seg .chip[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(24,33,43,.14),0 0 0 1px var(--line)}

/* beranda */
.sec{font-size:1.12rem;font-weight:800;margin:28px 0 10px;letter-spacing:-.015em}
.pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2)}
.prog{background:var(--acc);color:var(--acc-ink);border-color:transparent;padding:18px}
.prog-top{display:flex;flex-wrap:wrap;gap:6px}
.prog .pill{background:color-mix(in srgb,var(--acc-ink) 16%,transparent);color:var(--acc-ink)}
.prog-day{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin:12px 0 0;font-size:.92rem;font-weight:600}
.prog-n{margin:16px 0 10px;font-size:1rem;font-weight:600;line-height:1.3}
.prog-n b{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1;margin-right:4px}
.bar-p{display:block;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar-p > span{display:block;height:100%;min-width:0;border-radius:8px;background:var(--c,var(--acc));transition:width .4s ease}
.prog .bar-p{background:color-mix(in srgb,var(--acc-ink) 22%,transparent)}
.prog .bar-p > span{background:var(--acc-ink)}
.prog .btn{background:var(--acc-ink);color:var(--acc)}
.prog .btn:disabled{opacity:.7}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mat-card{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .1s}
.mat-card:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.mat-card:active{transform:scale(.98)}
.mat-card b{font-size:1.04rem;font-weight:800;letter-spacing:-.01em}
.mat-card small{color:var(--ink2);font-size:.8rem;line-height:1.3;margin-bottom:10px}
.mat-card .bar-p{height:6px;margin-top:auto}
.mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);margin-bottom:10px;flex:none}
.mi svg{width:22px;height:22px}
.item .it{flex:1;min-width:0}
.chev{flex:none;color:var(--ink2);display:grid}
.chev svg{width:18px;height:18px}
.nob{flex:none;width:32px;height:32px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--ink2)}
.nob.ok{background:var(--okbg);color:var(--ok)}
.item .ti{flex:none}
.mhead{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.mhead .mi{width:52px;height:52px;border-radius:16px;margin:0}
.mhead .mi svg{width:28px;height:28px}
.mhead h2.t{margin:0}

h1,h2.t,.sec,.sh h2,.grp h2,.brand b,.ttl,.mat-card b,.mhead h2.t,.gbar b,.rt,.recap .rt{font-family:var(--f-hand);letter-spacing:0}
h1{font-weight:700;color:var(--acc)}
h2.t{font-weight:700;font-size:1.7rem;line-height:1.15}
.sec{font-weight:700;font-size:1.4rem;color:var(--pen);margin:26px 0 8px}
.sh h2{font-weight:700;font-size:1.3rem;color:var(--pen)}
.brand b{font-weight:700;font-size:1.3rem;color:var(--acc)}
.ttl{font-weight:700;font-size:1.2rem;color:var(--acc)}
.eyebrow{font-family:var(--f-hand);font-weight:400;font-size:1rem;color:var(--pen)}
.bar{background:color-mix(in srgb,var(--bg) 90%,transparent);border-bottom:1.5px solid var(--acc)}
.bar .btn.ghost{background:transparent;border-color:transparent}
/* kartu menjadi bagian halaman yang dipisah garis putus-putus */
.card{background:transparent;border:0;border-top:1.5px dashed var(--line2);border-radius:0;padding:14px 2px 6px;box-shadow:none}
.card.locked{background:transparent;border-top-style:dashed}
.hero{background:var(--surface);border:1.5px solid var(--line2);border-radius:6px;box-shadow:none}
.num{border-radius:50%;background:transparent;color:var(--pen);border:2px solid var(--pen);font-family:var(--f-hand);font-size:1rem}
.card.locked .num{background:transparent;color:var(--line2);border-color:var(--line2)}
.stt{background:transparent;font-family:var(--f-hand);font-size:.9rem;padding:0;border-radius:0}
.stt.done{background:transparent}
/* tombol */
.btn{border-radius:6px;box-shadow:3px 3px 0 color-mix(in srgb,var(--acc) 28%,transparent)}
.btn.ghost{background:var(--surface);border-color:var(--line2);box-shadow:none}
.btn.danger{box-shadow:3px 3px 0 color-mix(in srgb,var(--bad) 28%,transparent)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 color-mix(in srgb,var(--acc) 28%,transparent)}
.btn.ghost:active{box-shadow:none}
.seg{background:transparent;border:1.5px solid var(--line2);border-radius:6px}
.seg .chip{border-radius:4px}
.seg .chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.pill{border-radius:4px;background:transparent;border:1.5px solid var(--line2)}
/* daftar dan pilihan */
.item,.mat-card,.opt,.slot,.gtile,.arow,.kls,.mis,.in,.calc input,.ai-soal{border-radius:6px;box-shadow:none}
.item{border:1.5px solid var(--line2)}
.nob{border-radius:50%;background:transparent;border:1.5px solid var(--line2);font-family:var(--f-hand);font-size:1rem}
.nob.ok{background:transparent;border-color:var(--ok)}
.mat-card{border:1.5px solid var(--line2)}
.mat-card b{font-weight:700;font-size:1.25rem}
.mi,.mhead .mi{background:transparent;color:var(--acc);border-radius:0;width:auto;justify-content:start}
.mi svg{width:30px;height:30px;stroke-width:1.7}
.mhead .mi svg{width:40px;height:40px}
.bar-p{background:transparent;border:1.5px solid var(--acc);border-radius:4px;height:9px}
.bar-p > span{border-radius:0;background:repeating-linear-gradient(-45deg,var(--acc) 0 2px,transparent 2px 5px)}
.mat-card .bar-p{border-color:var(--c,var(--acc))}
.mat-card .bar-p > span{background:var(--c,var(--acc))}
.ti{background:transparent;border-radius:0;color:var(--acc)}
.tools .item{background:var(--surface);border-color:var(--line2)}
/* kartu kemajuan beranda: tulisan di kertas, bukan kotak berwarna */
.prog{background:transparent;color:var(--ink);border:0;border-top:1.5px dashed var(--line2);padding:14px 2px}
.prog .pill{background:transparent;color:var(--acc);border-color:var(--acc)}
.prog-day{font-family:var(--f-hand);font-size:1.05rem;color:var(--pen)}
.prog-n{font-family:var(--f-hand);color:var(--acc);font-size:1.15rem}
.prog-n b{font-weight:700;font-size:3rem}
.prog .bar-p{background:transparent}
.prog .bar-p > span{background:repeating-linear-gradient(-45deg,var(--acc) 0 2px,transparent 2px 5px)}
.prog .btn{background:var(--acc);color:var(--acc-ink)}
.prog .seg{background:transparent}.prog .chip{color:var(--ink2)}
.prog .chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.prog-ket{color:var(--ink2);opacity:1}
.prog-tk>span{color:var(--ink2);opacity:1}
.pbtn{color:var(--acc)!important;background:transparent!important;border:1.5px solid var(--acc)!important;border-radius:4px}
/* halaman soal */
.ptitle h2.t{font-size:1.8rem}
.pik{width:64px;height:64px;border-radius:0;background:transparent;color:var(--acc)}
.pik svg{width:60px;height:60px}
.sik{color:var(--acc)}.sik svg{width:28px;height:28px;display:block}
.steps li{font-family:var(--f-hand);font-size:.95rem;font-weight:400}
.steps li.now{font-weight:700;color:var(--acc)}
.steps li::before{border-radius:2px;height:4px}
.story{font-size:1.12rem}
.tok{border-radius:2px;border-bottom:2px dashed var(--acc)}
.tok.on{background:color-mix(in srgb,var(--c) 22%,var(--hl));font-weight:700}
.tok.sel{background:transparent;color:inherit;outline:2px solid var(--acc);outline-offset:1px;border-bottom:2px solid var(--acc)}
.tok.cut{opacity:1;color:var(--ink2);border-bottom:0;text-decoration:line-through 2.5px var(--bad)}
.slot{background:var(--surface);border-width:1.5px}
.slot .sym{font-family:var(--f-hand);font-weight:700;font-size:2rem}
.slot .val{font-family:var(--f-hand);font-weight:700;font-size:1.2rem}
.slot .ph{font-family:var(--f-hand);font-weight:400}
.slot.filled{background:var(--surface)}
.slot.coret{--c:var(--bad)}
.calc input{font-family:var(--f-hand);font-weight:700;font-size:1.35rem;color:var(--acc);border-width:0 0 2px;border-radius:0;background:transparent;padding:4px 6px}
.calc input:focus{box-shadow:none;border-color:var(--pen)}
.fb{border-radius:0;background:transparent;border-left-width:3px;font-family:var(--f-hand);font-size:1.12rem;line-height:1.45;color:var(--pen);border-left-color:var(--pen)}
.fb.ok{background:transparent;color:var(--ok)}
.fb.bad{background:transparent;color:var(--bad)}
.fb.info{color:var(--acc);border-left-color:var(--acc)}
.fb b{font-weight:700}
.fb ul,.fb code{font-family:var(--f-body)}
.opt{background:var(--surface)}
.opt.mat b{font-family:var(--f-hand);font-weight:700;font-size:1.25rem}
.recap{background:transparent;border:1.5px dashed var(--line2);border-radius:6px}
.bintang{background:transparent;border:1.5px dashed var(--ok);border-radius:6px}
.bintang b{font-family:var(--f-hand);font-size:1.3rem}
details.fold summary{font-family:var(--f-hand);font-size:1.1rem}
.act-t{font-family:var(--f-hand);font-weight:700;font-size:1.1rem}
/* navigasi bawah */
#nav{background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1.5px solid var(--acc)}
.nav-i.on .nic{background:transparent}
.nav-i.on{text-decoration:underline 2px;text-underline-offset:4px}
/* kartu ujian di beranda dan menu guru */
.ujk-card{background:var(--acc);box-shadow:3px 3px 0 color-mix(in srgb,var(--acc) 28%,transparent);border-radius:6px}
.ujk-card.warn{background:var(--warn)}
.ujk-card .ui{background:transparent;border:1.5px solid rgba(255,255,255,.5);border-radius:50%}
.gtile{border:1.5px solid var(--line2)}
.gtile:first-child{box-shadow:3px 3px 0 color-mix(in srgb,var(--acc) 28%,transparent)}
.gtile.wide{background:var(--surface)}
.upd{border-radius:6px}
.dots i{border-radius:2px}

function locate(s){

function applyTheme(){
  try{

    var g=gayaNow(),b=document.body,lks=g==='lks'||b&&b.classList.contains('lks');
    var c=g==='papan'&&!lks?'#2B4538':themeNow()==='dark'?(lks?'#141414':'#151A24'):(lks?'#FFFFFF':'#FBF8F0');
    document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',c);});
  }catch(e){}
}

var canSpeak=typeof window!=='undefined'&&('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
function speakBtnHtml(){
  if(!canSpeak)return '';
  return '<div class="row" style="margin:0 0 4px"><button class="btn ghost sm" data-act="speak" data-fk="speak" aria-pressed="'+speaking+'">'+(speaking?'■ Berhenti membaca':'🔊 Bacakan soal')+'</button></div>';
}
var idVoice=null,speakJob=null,utts=[];
function pickVoice(){
  try{var vs=speechSynthesis.getVoices()||[];
    idVoice=vs.filter(function(v){return /^(id|in)([-_]|$)/i.test(v.lang||'');})[0]||null;}catch(e){}
}
if(canSpeak){
  pickVoice();
  try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){try{speechSynthesis.onvoiceschanged=pickVoice;}catch(_){}}
}
function stopSpeak(){if(canSpeak&&speaking){speaking=false;speakJob=null;utts=[];try{speechSynthesis.cancel();}catch(e){}}}
function speakToggle(){
  if(!canSpeak)return;
  if(speaking){stopSpeak();return;}
  pickVoice();
  var txt=cp.story.map(function(x){return typeof x==='string'?x:x.txt;}).join('').replace(/²/g,' kuadrat').replace(/Ω/g,' ohm');
  /* dibacakan per kalimat: teks panjang sering terputus di Chrome Android */
  var parts=(txt.match(/[^.?!]+[.?!]*/g)||[txt]).map(function(t){return t.trim();}).filter(Boolean);
  var sy=speechSynthesis,job={},left=parts.length;
  speakJob=job;
  var done=function(){if(speakJob!==job)return;speaking=false;speakJob=null;utts=[];render();};
  utts=parts.map(function(t){
    var u=new SpeechSynthesisUtterance(t);
    u.lang=idVoice?idVoice.lang:'id-ID';if(idVoice)u.voice=idVoice;u.rate=0.95;
    u.onend=function(){if(--left<=0)done();};
    u.onerror=function(e){
      var er=e&&e.error;
      if(speakJob===job&&er&&er!=='interrupted'&&er!=='canceled'&&RS[cur])
        RS[cur].msg={t:'bad',x:'Suara tidak bisa diputar ('+er+'). Cek volume media HP, lalu cek Pengaturan → Text-to-speech.'};
      done();
    };
    return u;
  });
  var go=function(){
    if(speakJob!==job)return;
    try{utts.forEach(function(u){sy.speak(u);});try{sy.resume();}catch(_){}}
    catch(e){if(RS[cur])RS[cur].msg={t:'bad',x:'HP ini tidak bisa membacakan teks.'};done();}
  };
  speaking=true;
  if(!idVoice&&RS[cur])RS[cur].msg={t:'info',x:'Suara bahasa Indonesia belum terpasang di HP ini, jadi suara bawaan yang dipakai. Pasang lewat Pengaturan HP → Text-to-speech → bahasa Indonesia.'};
  /* jangan memanggil speak tepat setelah cancel: di Chrome Android ucapan baru ikut batal */
  if(sy.speaking||sy.pending){try{sy.cancel();}catch(e){}setTimeout(go,300);}else go();
}

var KARYAKEY='cjs.karya',karya=jget(KARYAKEY,[]),karang=null;
function numOf(t){var m=String(t).match(/^[\d.,]+/);return m?m[0]:'';}
function normT(x){return String(x||'').toLowerCase().replace(/\s+/g,'');}
function newKarang(src){
  var pool=kelasList().filter(function(s){return s.besaran.length>=2;});
  if(!src)src=pool[Math.floor(Math.random()*pool.length)];
  if(!src){karang=null;return;}
  var o=instanceOf(src),c=compile(o);
  karang={src:src,o:o,c:c,text:'',checks:null,ans:'',ansMsg:null,saved:false};
}
function karangChecks(){
  var k=karang,t=k.text,nt=normT(t),o=k.o,rest=t;
  var C=o.besaran.map(function(b){
    var nn=numOf(b.teks),ok=nt.indexOf(normT(b.teks))>=0||(nn&&new RegExp('(^|[^0-9.,])'+nn.replace(/[.]/g,'\\.')+'(?![0-9])').test(t.replace(/\s+/g,' ')));
    rest=rest.split(b.teks).join(' ');
    return {ok:ok,x:'Memakai '+b.teks+' ('+b.nama+')'};
  });
  var key=o.tanya.teks.toLowerCase().split(/\s+/).slice(0,2).join(' ');
  C.push({ok:/\?/.test(t)&&/(berapa|tentukan|hitung)/i.test(t),x:'Ada kalimat tanya, misalnya “Berapa …?”'});
  C.push({ok:t.toLowerCase().indexOf(key)>=0,x:'Menanyakan '+key});
  C.push({ok:t.trim().split(/\s+/).filter(Boolean).length>=15,x:'Cerita cukup lengkap (minimal 15 kata)'});
  var bonus=/\d/.test(rest);
  return {list:C,ok:C.every(function(x){return x.ok;}),bonus:bonus};

function aiCheck(raw){
  var s=norm(raw),note=[];

  s.rumus.forEach(function(r){r.benar=!!r.benar;});

    var v=evalAngka(s.hitung.ekspresi,{});
    if(Number.isFinite(v)&&(!Number.isFinite(s.hitung.jawaban)||Math.abs(v-s.hitung.jawaban)>Math.max(1e-6,Math.abs(v)*0.005))){
      if(Number.isFinite(s.hitung.jawaban))note.push('Jawaban dari AI ('+fmt(s.hitung.jawaban)+') tidak cocok dengan hitungannya, jadi diganti dengan hasil hitungan aplikasi: '+fmt(v)+'.');
      s.hitung.jawaban=v;}
  }
  if(s.variasi.length||s.hitung.angka)s.hitung.jawaban=null;
  var errs=check(s);
  if(!errs.length){
    for(var k=0;k<6;k++){var inst=instanceOf(s);if(!Number.isFinite(inst.hitung.jawaban)){errs.push('Jawaban tidak bisa dihitung untuk salah satu variasi angka.');break;}

  }

}

var UNITW=['volt','ampere','ohm','watt','joule','sekon','detik','menit','jam','meter','gram','kilogram','liter','hertz','newton','pascal','tesla','weber','coulomb','kali','tanaman','lilitan','derajat','km','cm','mm','kg','g','m','s','v','a','w','j','n','c','hz','pa','t','wb','k','°c','°f','ω','kwh','wh','kw','mw','ma','mj','kj','ml','l','m²','m³','cm²','cm³','m/s','m/s²','km/jam','kg/m³','g/cm³','j/kg°c','%'];
var STOPW=['per','dan','yang','di','ke','dari','untuk','dengan','pada','setiap','dalam','selama','sebesar','sejauh','adalah','itu','ini','jika','maka','atau','agar','lalu','sehingga','hingga','sampai','oleh'];
var NUMRE=/\d+(?:\.\d{3})+(?:,\d+)?|\d{1,2}[.:]\d{2}(?!\d)|\d+(?:,\d+)?/g;
function numTokens(t){
  var out=[],m;NUMRE.lastIndex=0;
  while((m=NUMRE.exec(t))){
    if(m.index>0&&/[A-Za-z]/.test(t.charAt(m.index-1))&&!/Rp\s?$/.test(t.slice(Math.max(0,m.index-3),m.index)))continue;
    var i=m.index,j=i+m[0].length,raw=m[0],val=/^\d{1,2}[.:]\d{2}$/.test(raw)?NaN:parseNum(raw);
    if(i>=2&&/Rp\s?$/.test(t.slice(Math.max(0,i-3),i)))i=t.lastIndexOf('Rp',i);
    var rest=t.slice(j),u=rest.match(/^(\s?)([A-Za-zΩµ°%²³\/]+)/),unit='',uj=j;
    if(u){var w=u[2].replace(/[.,;:!?]+$/,'');unit=w;uj=j+u[1].length+w.length;}
    out.push({i:i,j:j,uj:uj,raw:raw,val:val,unit:unit});
  }

function isUnitWord(w,sat){var l=String(w||'').toLowerCase();return !!w&&(w===sat||l===String(sat||'').toLowerCase()||UNITW.indexOf(l)>=0);}
/* mencari kalimat tanya: “Berapa …?” */
function tanyaSpan(t){
  var m=t.match(/(Berapa(?:kah)?|Tentukan(?:lah)?|Hitunglah|Hitung)\s+([^?!]*)/i);if(!m)return null;
  var i=m.index+m[0].length-m[2].length,txt=m[2].replace(/[\s.]+$/,'');
  return txt?{i:i,j:i+txt.length,txt:txt}:null;
}
function rapikanAngka(n){return fmtNum(n);}
/* o: {tpl, nilai:{kunci:angka}, cerita, judul, acak} → {s, errs, info} */
/* satuan lain yang boleh dipakai di cerita: [satuan, faktor ke satuan rumus, rentang acak dalam satuan itu (opsional)] */
var UNITALT={kg:[['g',0.001]],s:[['menit',60,[1,10,1]],['jam',3600,[1,5,1]]],m:[['cm',0.01],['km',1000]],A:[['mA',0.001]],W:[['kW',1000]],J:[['kJ',1000]],'m²':[['cm²',0.0001]],'cm³':[['liter',1000],['mL',1]],kW:[['W',0.001]],jam:[['menit',1/60,[30,180,30]]]};
function unitInfo(v,u){if(!u||u===v[3])return null;var L=UNITALT[v[3]]||[];for(var i=0;i<L.length;i++)if(L[i][0]===u)return {u:u,f:L[i][1],r:L[i][2]||null};return null;}
function tipKonv(dari,ke,f){return f<1?'1 '+ke+' = '+fmtNum(Math.round(1/f*1e6)/1e6)+' '+dari+', jadi bagi '+fmtNum(Math.round(1/f*1e6)/1e6)+'.':'1 '+dari+' = '+fmtNum(f)+' '+ke+', jadi kali '+fmtNum(f)+'.';}
function fNum(f){return String(Math.round(f*1e9)/1e9);}
/* o: {tpl, nilai:{kunci:angka}, unit:{kunci:satuan}, cerita, judul, acak} → {s, errs, info} */
function rakitSoal(o){
  var T=o.tpl,errs=[],info={pakai:[],pengecoh:[],tanya:null},cer=String(o.cerita||'').replace(/\s+/g,' ').trim(),raw={},vals={},U={};
  T.v.forEach(function(v){var x=o.nilai&&o.nilai[v[0]],ui=unitInfo(v,o.unit&&o.unit[v[0]]);raw[v[0]]=typeof x==='number'?x:parseNum(x);U[v[0]]=ui;
    vals[v[0]]=ui?Math.round(raw[v[0]]*ui.f*1e9)/1e9:raw[v[0]];});
  var su=function(v){return U[v[0]]?U[v[0]].u:v[3];};
  T.v.forEach(function(v){if(!Number.isFinite(raw[v[0]])||raw[v[0]]<=0)errs.push('Isi angka '+v[2]+' ('+v[1]+') dengan angka lebih dari 0.');});
  if(!cer)errs.push('Tulis dulu cerita soalnya.');
  if(errs.length)return {s:null,errs:errs,info:info};
  var toks=numTokens(cer),used=[],tq=tanyaSpan(cer);
  T.v.forEach(function(v){
    var tk=toks.filter(function(x){return used.indexOf(x)<0&&Math.abs(x.val-raw[v[0]])<1e-9;})[0];
    if(!tk){errs.push('Angka '+rapikanAngka(raw[v[0]])+' '+su(v)+' ('+v[2]+') belum ada di cerita. Tulis angkanya di cerita, misalnya “'+rapikanAngka(raw[v[0]])+' '+su(v)+'”.');return;}
    used.push(tk);tk.v=v;tk.useUnit=isUnitWord(tk.unit,su(v));
    if(U[v[0]]&&!tk.useUnit)errs.push('Tulis satuannya setelah angka '+rapikanAngka(raw[v[0]])+', misalnya “'+rapikanAngka(raw[v[0]])+' '+su(v)+'”, supaya siswa berlatih mengubah satuan.');
    info.pakai.push({v:v,teks:cer.slice(tk.i,tk.useUnit?tk.uj:tk.j)+(U[v[0]]?' = '+fmtNum(vals[v[0]])+' '+v[3]:'')});
  });
  if(!tq)errs.push('Tambahkan kalimat tanya di akhir cerita, misalnya “Berapa '+T.q[1]+' …?”.');
  else{
    /* kalimat tanya tidak boleh menutupi angka yang dipakai */
    used.forEach(function(tk){if(tk.i<tq.j&&tk.i>=tq.i){tq.j=tk.i;tq.txt=cer.slice(tq.i,tq.j).replace(/\s+(jika|kalau|bila|saat|ketika|dengan)?\s*$/i,'').trim();tq.j=tq.i+tq.txt.length;}});
    if(!tq.txt)errs.push('Kalimat tanya terlalu pendek. Contoh: “Berapa '+T.q[1]+' …?”.');
    info.tanya=tq.txt;
  }
  if(errs.length)return {s:null,errs:errs,info:info};
  var dec=toks.filter(function(x){return used.indexOf(x)<0&&!(x.i>=tq.i&&x.i<tq.j);}).map(function(x){
    var w=(x.unit||'').toLowerCase(),end=x.unit&&STOPW.indexOf(w)<0&&x.unit.length<=10?x.uj:x.j;
    return {i:x.i,j:end,teks:cer.slice(x.i,end)};
  });
  info.pengecoh=dec.map(function(d){return d.teks;});
  /* angka acak: ganti angka di cerita dengan {kunci} (atau {kunci_u} kalau satuannya diubah) */
  var rnd={};(T.r||[]).forEach(function(r){rnd[r[0]]=1;});
  var acak=!!o.acak&&T.v.some(function(v){return rnd[v[0]];}),story=cer;
  var ph=function(k){return U[k]?k+'_u':k;};
  if(acak)used.slice().sort(function(a,b){return b.i-a.i;}).forEach(function(tk){if(rnd[tk.v[0]])story=story.slice(0,tk.i)+'{'+ph(tk.v[0])+'}'+story.slice(tk.j);});
  var acakV=function(k){return acak&&rnd[k];};
  var tx=function(tk){var num=acakV(tk.v[0])?'{'+ph(tk.v[0])+'}':tk.raw;return num+(tk.useUnit?cer.slice(tk.j,tk.uj):'');};
  var basis=function(k){return acakV(k)?'{'+k+'}':fmtNum(vals[k]);};
  var sub=function(t){return t.replace(/\{(\w+)\}/g,function(m,k){return acak?m:fmtNum(vals[k]);});};
  var s={id:'',kelas:T.k,tpl:T.id,topik:T.t,judul:String(o.judul||'').trim()||T.n,cerita:story,variasi:[],
    besaran:used.map(function(tk){var v=tk.v,ui=U[v[0]];return {teks:tx(tk),sym:v[1],nama:v[2],satuan:v[3],ket:v[2]+', satuannya '+v[3],
      konv:ui?'= '+basis(v[0])+' '+v[3]:'',catatan:ui?tipKonv(ui.u,v[3],ui.f):''};}),
    pengecoh:dec.map(function(d){return {teks:d.teks,ket:'info yang tidak dipakai menghitung'};}),
    tanya:{teks:tq.txt},
    rumus:[{f:T.f,benar:true,alasan:T.w}].concat(T.x.map(function(x){return {f:x[0],benar:false,alasan:x[1]};})),
    hitung:{diketahui:T.v.map(function(v){var k=v[0],ui=U[k];return v[1]+' = '+(ui?(acakV(k)?'{'+k+'_u}':fmtNum(raw[k]))+' '+ui.u+' = ':'')+basis(k)+' '+v[3];}).join(' · '),lhs:T.q[0],ekspresi:sub(T.e),satuan:T.q[2],
      jawaban:null,angka:'',salah:[],petunjuk:T.p+(T.v.some(function(v){return U[v[0]];})?' Ubah dulu satuannya.':''),penjelasan:T.f+'.'}};
  /* jawaban keliru kalau satuan lupa diubah */
  var lupa=T.v.filter(function(v){return U[v[0]];}).map(function(v){var ui=U[v[0]];
    return {k:v[0],rumus:T.a.replace(new RegExp('\\b'+v[0]+'\\b','g'),v[0]+'_u'),pesan:'Satuan '+v[2]+' belum diubah. '+tipKonv(ui.u,v[3],ui.f)};});
  if(acak){
    T.v.forEach(function(v){var k=v[0];if(rnd[k])return;s.variasi.push({nama:k,min:vals[k],maks:vals[k],langkah:1,rumus:''});
      if(U[k])s.variasi.push({nama:k+'_u',min:raw[k],maks:raw[k],langkah:1,rumus:''});});
    T.r.forEach(function(r){var k=r[0],ui=U[k];
      if(typeof r[1]==='string'){s.variasi.push({nama:k,min:NaN,maks:NaN,langkah:NaN,rumus:r[1]});if(ui)s.variasi.push({nama:k+'_u',min:NaN,maks:NaN,langkah:NaN,rumus:k+'/'+fNum(ui.f)});return;}
      if(!ui){s.variasi.push({nama:k,min:r[1],maks:r[2],langkah:r[3],rumus:''});return;}
      var rg=ui.r||[r[1]/ui.f,r[2]/ui.f,r[3]/ui.f].map(function(x){return Math.round(x*1e6)/1e6;});
      s.variasi.push({nama:k+'_u',min:rg[0],maks:rg[1],langkah:rg[2],rumus:''});
      s.variasi.push({nama:k,min:NaN,maks:NaN,langkah:NaN,rumus:k+'_u*'+fNum(ui.f)});});
    s.hitung.angka=T.a;s.hitung.salah=T.s.map(function(x){return {nilai:NaN,pesan:x[1],rumus:x[0]};}).concat(lupa.map(function(x){return {nilai:NaN,pesan:x.pesan,rumus:x.rumus};}));
  }else{
    s.hitung.jawaban=evalAngka(T.a,vals);
    var both={};for(var kk in vals){both[kk]=vals[kk];both[kk+'_u']=raw[kk];}
    s.hitung.salah=T.s.map(function(x){return {nilai:evalAngka(x[0],vals),pesan:x[1],rumus:''};})
      .concat(lupa.map(function(x){return {nilai:evalAngka(x.rumus,both),pesan:x.pesan,rumus:''};}))
      .filter(function(x){return Number.isFinite(x.nilai)&&Math.abs(x.nilai-s.hitung.jawaban)>1e-9;});
  }
  s=norm(s);s.tpl=T.id;
  errs=check(s);
  if(!errs.length){
    if(acak){for(var k=0;k<8;k++){var ins=instanceOf(s),a=ins.hitung.jawaban;
      if(!Number.isFinite(a)||Math.abs(a*100-Math.round(a*100))>1e-6){errs.push('Dengan angka acak, sebagian jawaban jadi berkoma panjang. Matikan “Angka acak” atau ganti angka tetapnya.');break;}}}
    else if(!Number.isFinite(s.hitung.jawaban))errs.push('Jawaban belum bisa dihitung. Periksa angkanya.');
  }
  return {s:errs.length?null:s,errs:errs,info:info};
}
function tplJawab(T,nilai,unit){var vals={};T.v.forEach(function(v){var ui=unitInfo(v,unit&&unit[v[0]]),x=parseNum(nilai[v[0]]);vals[v[0]]=ui?x*ui.f:x;});return evalAngka(T.a,vals);}
function escRe(t){return String(t).replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');}
function tplContoh(T,nilai,unit){
  var c=T.c;
  T.v.forEach(function(v){var ui=unitInfo(v,unit&&unit[v[0]]);if(ui)c=c.replace(new RegExp('\\{'+v[0]+'\\}(\\s?)'+escRe(v[3])),'{'+v[0]+'}$1'+ui.u);});
  return c.replace(/\{(\w+)\}/g,function(m,k){var x=parseNum(nilai&&nilai[k]);return Number.isFinite(x)?fmtNum(x):m;});
}
function tplNilaiAwal(T){var o={};T.v.forEach(function(v){o[v[0]]=fmt(v[4]);});return o;}
function tplRentang(T,unit){return (T.r||[]).filter(function(r){return typeof r[1]!=='string'&&T.v.some(function(v){return v[0]===r[0];});}).map(function(r){
  var v=T.v.filter(function(x){return x[0]===r[0];})[0],ui=unitInfo(v,unit&&unit[v[0]]),rg=ui?(ui.r||[r[1]/ui.f,r[2]/ui.f]):[r[1],r[2]];
  return v[2]+' '+fmtNum(Math.round(rg[0]*1e6)/1e6)+'–'+fmtNum(Math.round(rg[1]*1e6)/1e6)+' '+(ui?ui.u:v[3]);}).join(', ');}

var AI_ATURAN='Aturan wajib:\n- Kalau ada templat yang cocok di DAFTAR TEMPLAT, pakai templat (id persis) dan isi "nilai" untuk setiap angkanya. Jangan membuat rumus sendiri untuk soal yang ada templatnya.\n- Kalau tidak ada templat yang cocok, tulis SOAL LENGKAP (lihat format di bawah) di kolom "lengkap" dan kosongkan "templat".\n- "cerita": cerita soal bahasa Indonesia yang dekat dengan kehidupan siswa SMP di Indonesia, 2–4 kalimat. Semua angka yang dipakai menghitung harus tertulis di cerita beserta satuannya, misalnya "220 V". Tambahkan satu pengecoh berupa angka yang tidak dipakai (harga, jam, jumlah orang). Akhiri dengan pertanyaan "Berapa …?". Pakai angka yang jawabannya bulat atau paling banyak 2 angka desimal.\n- Jangan menulis rumus atau jawaban di cerita.\n- Balas dengan kalimat singkat untuk guru, lalu satu blok ```json berisi {"soal":[{"templat":"id","judul":"...","cerita":"...","nilai":{"kunci":angka},"acak":true}]}. Paling banyak 3 soal.\n\nFORMAT SOAL LENGKAP (hanya kalau tidak ada templat): {"templat":"","lengkap":{"kelas":"9","topik":"Listrik","judul":"...","cerita":"...","besaran":[{"teks":"teks angka persis di cerita, mis. 2 μC","sym":"q","nama":"muatan","satuan":"C","ket":"penjelasan singkat","konv":"= 0,000002 C (kalau satuan diubah)"}],"pengecoh":[{"teks":"teks persis di cerita","ket":"kenapa tidak dipakai"}],"tanya":{"teks":"potongan kalimat tanya persis di cerita, tanpa kata Berapa"},"rumus":[{"f":"rumus benar","benar":true,"alasan":"..."},{"f":"rumus keliru","benar":false,"alasan":"..."},{"f":"rumus keliru","benar":false,"alasan":"..."}],"hitung":{"diketahui":"q = 2 μC · r = 3 m","lhs":"F","ekspresi":"perhitungan dengan angka, pakai × ÷ dan kurung","satuan":"N","jawaban":angka,"salah":[{"nilai":angka,"pesan":"jawaban keliru yang sering muncul dan petunjuknya"}],"petunjuk":"...","penjelasan":"..."}}}. Setiap "teks" harus ada persis di cerita dan tidak boleh bertumpukan. Simbol besaran tidak boleh dipakai dua kali.';

function analisis(h){
  var M={},urut=[];
  h.peserta.forEach(function(p){(p.res||[]).forEach(function(r){
    var m=M[r.id];if(!m){m=M[r.id]={id:r.id,judul:r.judul,topik:r.topik,n:0,benar:0,lancar:0,lewat:0,err:0};urut.push(m);}
    m.n++;if(r.ok)m.benar++;if(r.ok&&!r.err)m.lancar++;if(r.lewat)m.lewat++;m.err+=r.err||0;});});
  return urut.sort(function(a,b){return a.benar/a.n-b.benar/b.n||b.err/b.n-a.err/a.n;});

  else if(a==='set-tingkat'){if(tingkat!==v){streak=0;store.set(STRKEY,'0');levelUp=false;}tingkat=v;store.set('cjs.tingkat',v);}
  else if(a==='set-kelas'){kelasSel=v;store.set('cjs.kelas',v);}
  else if(a==='tok')onToken(v);
  else if(a==='slot')onSlot(v);
  else if(a==='opt')onOpt(+v);
  else if(a==='check')onCheck();
  else if(a==='again'){delete done[cur];saveDone();startPlay(cur,SRC[cur]);fk=null;window.scrollTo(0,0);}
  else if(a==='next'){var n=nextUnsolvedId();if(n){startPlay(n,data.find(function(s){return s.id===n;}));fk=null;window.scrollTo(0,0);}else view='home';}
  else if(a==='a-open'){view='admin';adminTab='home';loginErr=false;confirmKey=null;
    var sv=jget(GURUKEY,null);if(!adminOK&&sv&&sv.pin&&String(sv.kode||'')===activeKode){adminOK=true;adminPin=sv.pin;adminRole=sv.peran||'utama';}
    fk=adminOK?null:'login';}
  else if(a==='a-login'){var pv=$('#pin'),pin=pv?pv.value:'',ig=$('#ingat'),ingat=!ig||ig.checked;
    if(apiBase()){if(loginBusy)return;loginBusy=true;loginErr=false;render();
      apiCall('/login',{kode:activeKode||'UTAMA',pin:pin}).then(function(res){loginBusy=false;
        if(res.ok){adminOK=true;adminPin=pin;adminRole=res.j.peran;loginErr=false;fk=null;notice=null;adminTab='home';
          if(ingat)store.set(GURUKEY,JSON.stringify({pin:pin,kode:activeKode,peran:adminRole}));else store.del(GURUKEY);}
        else if(res.status===0){if(!activeKode&&pinOk(pin)){adminOK=true;adminPin=pin;adminRole='offline';notice={t:'info',x:'Tidak ada internet. Kamu bisa mengubah soal, tetapi baru bisa mengirim ke siswa setelah ada internet.'};}else{loginErr='Tidak ada internet. Sambungkan internet lalu coba lagi.';fk='login';}}
        else{loginErr=(res.j&&res.j.pesan)||'PIN salah. Coba lagi.';fk='login';}
        render();});
      return;}
    if(pinOk(pin)){adminOK=true;loginErr=false;fk=null;}else{loginErr=true;fk='login';}}
  else if(a==='a-kirim'){kirimNow();return;}
  else if(a==='a-out'){adminOK=false;adminPin=null;adminRole=null;store.del(GURUKEY);view='home';G=null;UC=null;}
  else if(a==='a-tab'){adminTab=v;confirmKey=null;D=null;editId=null;formErr=null;if(v==='kelas'){kelasData=null;kelasPinFor=null;kelasMsg=null;kelasLoad();}}
  else if(Object.prototype.hasOwnProperty.call(KACT,a)){if(KACT[a](v)==='async')return;}
  else if(Object.prototype.hasOwnProperty.call(AIACT,a)){if(AIACT[a](v)==='async')return;}
  else if(a==='a-kunci'){var ki=kunci.indexOf(v);if(ki>=0)kunci.splice(ki,1);else kunci.push(v);var kn=v.indexOf('kelas:')===0?'Kelas '+v.slice(6):v;if(simpanKirim(ki>=0?kn+' dibuka untuk siswa.':kn+' dikunci untuk siswa.')==='async')return;}
  else if(a==='a-new'){D=blank();editId=null;formErr=null;adminTab='edit';fk=null;}
  else if(a==='a-edit'){var s0=data.find(function(s){return s.id===v;});D=toDraft(s0);editId=v;formErr=null;adminTab='edit';fk=null;window.scrollTo(0,0);}
  else if(a==='a-dup'){var s1=data.find(function(s){return s.id===v;});var c=JSON.parse(JSON.stringify(s1));c.id=freshId();c.judul=c.judul+' (salinan)';data.splice(data.indexOf(s1)+1,0,c);persist();notice={t:'ok',x:'Soal digandakan. Salinannya ada tepat di bawah.'};}
  else if(a==='a-up'){moveItem(v,-1);persist();}
  else if(a==='a-down'){moveItem(v,1);persist();}
  else if(a==='a-del'){confirmKey='del:'+v;fk='del-yes';}
  else if(a==='a-del-yes'){data=data.filter(function(s){return s.id!==v;});confirmKey=null;fk=null;if(simpanKirim('Soal dihapus.')==='async')return;}
  else if(a==='a-cancel'){confirmKey=null;}
  else if(a==='a-cancel-edit'){adminTab='list';D=null;editId=null;formErr=null;fk=null;}
  else if(a==='a-add'){
    if(v==='besaran')D.besaran.push({teks:'',sym:'',nama:'',satuan:'',ket:'',konv:'',catatan:''});
    if(v==='pengecoh')D.pengecoh.push({teks:'',ket:''});
    if(v==='rumus')D.rumus.push({f:'',benar:false,alasan:''});
    if(v==='salah')D.hitung.salah.push({nilai:'',pesan:'',rumus:''});
    if(v==='variasi')D.variasi.push({nama:'',min:'',maks:'',langkah:'',rumus:''});
    var lst=v==='salah'?D.hitung.salah:D[v];scrollTo='row-'+v+'-'+(lst.length-1);fk=null;
  }
  else if(a==='a-rm'){
    var pr=v.split(':'),idx=+pr[1],lst2=pr[0]==='salah'?D.hitung.salah:D[pr[0]];
    lst2.splice(idx,1);
    if(pr[0]==='rumus'&&lst2.length&&!lst2.some(function(r){return r.benar;}))lst2[0].benar=true;
    fk=null;
  }
  else if(a==='a-save'){if(doSave()==='async')return;}
  else if(a==='a-preview'){
    var sp=fromDraft(D),er=check(sp);
    if(er.length){formErr=er;scrollTo='app';}
    else{formErr=null;sp.id='__prev';startPlay('__prev',sp);previewFrom='edit';window.scrollTo(0,0);fk=null;}
  }
  else if(a==='a-try'){startPlay('__prev',data.find(function(s){return s.id===v;}));previewFrom='list';window.scrollTo(0,0);fk=null;}
  else if(a==='a-back'){view='admin';adminTab=previewFrom==='edit'?'edit':(previewFrom==='ai'?'ai':(previewFrom==='buat'?'buat':(previewFrom==='ujk-buat'?'ujk-buat':'list')));previewFrom=null;fk=null;}
  else if(a==='a-copy')copyExport();
  else if(a==='a-download')download();
  else if(a==='a-imp')doImport();
  else if(a==='a-pin'&&apiBase()){var np2=$('#pin1'),nv=np2?np2.value:'';
    if(nv.trim().length<4){notice={t:'bad',x:'PIN minimal 4 karakter.'};}
    else{np2.value='';notice={t:'info',x:'Menyimpan PIN…'};render();
      apiCall('/pin',{kode:activeKode||'UTAMA',pin:adminPin||'',baru:nv}).then(function(res){
        if(res.ok){adminPin=nv;notice={t:'ok',x:'PIN baru tersimpan dan langsung berlaku di semua HP.'};}
        else if(res.status===0)notice={t:'bad',x:'Tidak ada internet. PIN belum diganti.'};
        else notice={t:'bad',x:(res.j&&res.j.pesan)||'PIN belum diganti. Coba lagi.'};
        render();});
      return;}}
  else if(a==='a-pin'){var np=$('#pin1');if(np&&np.value.trim().length>=4){pinHash=pinOf(np.value);pinAt=Date.now();store.set(PINH_KEY,JSON.stringify({h:pinHash,t:pinAt}));np.value='';notice={t:'ok',x:'PIN baru tersimpan di HP ini. Supaya berlaku di semua HP, buka Ekspor lalu upload soal.json ke GitHub.'};}else{notice={t:'bad',x:'PIN minimal 4 karakter.'};}}
  else if(a==='a-tarik'){var nb=fileBaru.length;data=data.concat(fileBaru);fileBaru=[];if(simpanKirim(nb+' soal baru ditambahkan.')==='async')return;}
  else if(a==='a-abai'){var ab=jget(ABAIKEY,[]);fileBaru.forEach(function(x){ab.push(x.id);});store.set(ABAIKEY,JSON.stringify(ab));fileBaru=[];}
  else if(a==='a-reset'){confirmKey='reset';}
  else if(a==='a-reset-yes'){store.del(KEY);confirmKey=null;load(true).then(function(){notice={t:'ok',x:'Ubahan dibuang. Sumber data sekarang: '+srcLabel()+'.'};render();});return;}
  else if(a==='a-clear-done'){done={};saveDone();notice={t:'ok',x:'Catatan selesai siswa di perangkat ini dihapus.'};}
  render();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.p&&D){setPath(D,t.dataset.p,t.value);}
  else if(t.id==='ans'){RS[cur].input=t.value;}
  else if(t.id==='imp'){impText=t.value;confirmKey=null;}
  else if(t.id==='kv'&&konv){konv.input=t.value;}
  else if(t.id==='kr-text'&&karang){karang.text=t.value;}
  else if(t.id==='ai-in'){aiInput=t.value;}
  else if(t.id==='uj-kode'){UJ.kode=t.value;}else if(t.id==='uj-nama'){UJ.nama=t.value;}
  else if(t.id==='ug-judul'&&UG.f){UG.f.judul=t.value;}
  else if(t.dataset&&t.dataset.g&&G){G.nilai[t.dataset.g]=t.value;G.cek=false;var ga=$('#g-ans');if(ga&&G.tpl){var an=tplJawab(G.tpl,G.nilai,G.unit);ga.textContent=G.tpl.q[0]+' = '+(Number.isFinite(an)?fmtNum(an):'?')+' '+G.tpl.q[2];}}
  else if(t.id==='g-cerita'&&G){G.cerita=t.value;G.cek=false;}
  else if(t.id==='g-judul'&&G){G.judul=t.value;}
  else if(t.id==='g-tema'&&G){G.aiTema=t.value;}

  else if(t.id==='uc-judul'&&UC){UC.judul=t.value;}
  else if(t.id==='kk-kode'){kk.kode=t.value;}else if(t.id==='kk-nama'){kk.nama=t.value;}else if(t.id==='kk-pin'){kk.pin=t.value;}else if(t.id==='kk-pin2'){kk.pin2=t.value;}
  else if(t.id==='kd'){kdInput=t.value;kdMsg=null;}

  else if(t.id==='nm'||t.id==='kl'){
    siswa[t.id==='nm'?'nama':'kelas']=t.value;store.set(SISKEY,JSON.stringify(siswa));
    var rp=$('#rep');if(rp)rp.textContent=reportText();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;

  if(UG.f&&(t.id==='ug-acak'||t.id==='ug-lewati'||t.id==='ug-lihat')){UG.f[{'ug-acak':'acak','ug-lewati':'lewati','ug-lihat':'lihatNilai'}[t.id]]=t.checked;return;}
  if(t.dataset&&t.dataset.gu&&G&&G.tpl){var k=t.dataset.gu,v=G.tpl.v.filter(function(x){return x[0]===k;})[0],lama=unitInfo(v,G.unit[k]),baru=unitInfo(v,t.value),x=parseNum(G.nilai[k]);
    if(Number.isFinite(x)){var bs=lama?x*lama.f:x;G.nilai[k]=fmt(Math.round((baru?bs/baru.f:bs)*1e6)/1e6);}

document.addEventListener('keydown',function(e){

/* ---------- Versi aplikasi, pembaruan otomatis, dan pemasangan di HP ---------- */
/* Naikkan APP_VERSI dan VERSI di sw.js bersamaan setiap kali aplikasi diperbarui. */
var APP_VERSI='2.7.1',booted=false,swReg=null,updReady=false,updMsg=null,installEvt=null,installDone=false,instHide=store.get('cjs.pasang')==='tutup';
var inApk=!!window.TaktikApp,APK_URL='https://github.com/Tendiriana/cerita-jadi-simbol/releases/download/taktik/TakTik-IPA.apk';
function isStandalone(){if(inApk)return true;try{return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}catch(e){return false;}}
function isIOS(){var u=navigator.userAgent||'';return /iPad|iPhone|iPod/.test(u)||(/Macintosh/.test(u)&&'ontouchend' in document);}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;if(booted&&(view==='home'||view==='atur'))render();});
window.addEventListener('appinstalled',function(){installEvt=null;installDone=true;if(booted&&(view==='home'||view==='atur'))render();});
function installHtml(place){
  if(isStandalone()||installDone||(place==='home'&&instHide))return '';
  var nanti=place==='home'?'<button class="btn ghost" data-act="pasang-tutup" data-fk="pasang-tutup">Nanti saja</button>':'',body;
  if(installEvt)body='<p class="mut">Pasang TakTik IPA di layar utama supaya bisa dibuka seperti aplikasi biasa, juga tanpa internet.</p><div class="row"><button class="btn" data-act="pasang" data-fk="pasang">Pasang aplikasi</button>'+nanti+'</div>';
  else if(isIOS())body='<ol class="guide"><li>Buka alamat ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambahkan ke Layar Utama</b>, lalu <b>Tambah</b>.</li></ol>'+(nanti?'<div class="row">'+nanti+'</div>':'');
  else if(place==='atur')body='<ol class="guide"><li>Buka alamat ini di <b>Chrome</b>.</li><li>Ketuk menu titik tiga di kanan atas.</li><li>Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.</li></ol>';
  else return '';
  if(!isIOS())body+='<p class="mut" style="margin:10px 0 0">Atau pasang versi APK untuk Android:</p><div class="row"><a class="btn ghost" href="'+APK_URL+'" rel="noopener">Unduh APK</a></div>';
  return '<section class="card"><div class="sh"><h2>Pasang di HP</h2></div>'+body+'</section>';
}
function versiHtml(){
  var apk='';try{if(inApk)apk='<p class="mut" style="margin:0 0 8px;font-size:.88rem">Aplikasi Android '+esc(window.TaktikApp.versi())+'. Bagian Android ini jarang berubah; isi aplikasi di atas yang selalu diperbarui.</p>';}catch(e){}
  return '<section class="card"><div class="sh"><h2>Aplikasi</h2><span class="stt">Versi '+APP_VERSI+'</span></div>'+apk
    +'<p class="mut" style="margin:0">Pembaruan berjalan otomatis: setiap kali dibuka dengan internet, aplikasi mengambil versi terbaru. Tidak perlu menghapus atau memasang ulang, dan kemajuan belajarmu tetap tersimpan.</p>'
    +(swReg?'<div class="row"><button class="btn ghost sm" data-act="upd-cek" data-fk="upd-cek">Periksa pembaruan</button></div>':'')+msgHtml(updMsg)+'</section>';
}
function updHtml(){
  if(!updReady||view==='tampil')return '';
  return '<div class="upd" role="status"><span><b>Versi baru siap.</b> Ketuk Perbarui untuk memakainya.</span><button class="btn sm" data-act="upd-go" data-fk="upd-go">Perbarui</button></div>';
}
/* aman dimuat ulang: tidak sedang mengerjakan soal, ujian, atau mengubah soal */
function safeToReload(){return (view==='home'||view==='intro'||view==='atur')&&!adminOK&&!exam;}
/* tombol Kembali di aplikasi Android: true kalau sudah ditangani di dalam aplikasi */
window.__taktikBack=function(){
  if(view==='home')return false;
  if(view==='intro')return false;
  if(exam&&(view==='play'||view==='ujkcek')&&cur!=='__prev')return true;
  var b=document.querySelector('#top [data-fk="back"]');
  if(b){b.click();return true;}
  stopSpeak();view='home';previewFrom=null;sel=null;confirmKey=null;render();window.scrollTo(0,0);
  return true;
};
var UPDACT={
  'pasang':function(){if(!installEvt)return;var ev=installEvt;installEvt=null;try{ev.prompt();ev.userChoice.then(function(c){if(c&&c.outcome==='accepted')installDone=true;render();});}catch(e){}},
  'pasang-tutup':function(){instHide=true;store.set('cjs.pasang','tutup');},
  'upd-go':function(){if(verWeb){store.del('cjs.updcoba');bukaSegar(verWeb);}else location.reload();return 'async';},
  'upd-cek':function(){
    if(!swReg)return;updMsg={t:'info',x:'Memeriksa…'};
    VERCEK=0;cekVersiWeb();swReg.update().then(function(){
      setTimeout(function(){if(!updReady)updMsg={t:'ok',x:'Aplikasi sudah versi terbaru ('+APP_VERSI+').'};if(view==='atur')render();},1500);
    },function(){updMsg={t:'bad',x:'Belum bisa memeriksa. Pastikan ada internet, lalu coba lagi.'};if(view==='atur')render();});
  }
};
/* pemeriksaan versi langsung ke GitHub (melewati salinan CDN) saat aplikasi dibuka lagi */
function verBaru(a,b){a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(var i=0;i<3;i++){if((a[i]||0)!==(b[i]||0))return (a[i]||0)>(b[i]||0);}return false;}
var VERCEK=0,verWeb=null;
function bukaSegar(v){
  /* alamat baru (?v=) memaksa CDN dan service worker lama mengambil halaman terbaru */
  var t=jget('cjs.updcoba',{});if(t.v===v&&Date.now()-t.t<10*60*1000){updReady=true;render();return;}
  store.set('cjs.updcoba',JSON.stringify({v:v,t:Date.now()}));
  location.replace(location.pathname+'?v='+encodeURIComponent(v)+location.hash);
}
function cekVersiWeb(){
  if(!/^https?:$/.test(location.protocol)||location.hostname==='appassets.androidplatform.net'||Date.now()-VERCEK<60000)return;
  VERCEK=Date.now();
  fetch('index.html?_v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
    var m=t.match(/APP_VERSI='([\d.]+)'/);if(!m||!verBaru(m[1],APP_VERSI))return;
    verWeb=m[1];try{if(swReg)swReg.update().catch(function(){});}catch(e){}
    if(safeToReload())bukaSegar(verWeb);else{updReady=true;updMsg=null;render();}
  }).catch(function(){});
}
function swSetup(){
  try{if(/[?&]v=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);}catch(e){}
  setTimeout(cekVersiWeb,4000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')cekVersiWeb();});
  /* salinan di dalam APK (dibuka saat belum pernah online) tidak memakai service worker */
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol)||location.hostname==='appassets.androidplatform.net')return;
  var sw=navigator.serviceWorker,hadCtl=!!sw.controller,reloading=false;
  try{
    sw.addEventListener('controllerchange',function(){
      if(!hadCtl){hadCtl=true;return;}
      if(reloading)return;
      if(safeToReload()){reloading=true;location.reload();}
      else{updReady=true;updMsg=null;render();}
    });
    sw.register('sw.js',{updateViaCache:'none'}).then(function(reg){
      swReg=reg;
      var cek=function(){try{reg.update().catch(function(){});}catch(e){}};
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')cek();});
      setInterval(cek,30*60*1000);
    }).catch(function(){});
  }catch(e){}
}

/* ---------- Mulai ---------- */
(async function(){
  store.del(PINKEY);
  try{done=JSON.parse(store.get(DONEKEY)||'{}')||{};}catch(e){done={};}
  await load(false);
  choosePin();
  if(!store.get('cjs.intro'))view='intro';
  render();booted=true;
  swSetup();
})();
})();
