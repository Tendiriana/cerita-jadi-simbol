<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cerita Jadi Simbol</title>
<meta name="theme-color" content="#13243B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: buku latihan berkotak, satu kolom lebar 720px. Halaman siswa (daftar soal, latihan) dan mode admin (daftar, formulir) memakai kartu yang sama. */
:root{
  --bg:#EDF2F7; --grid:#D9E3EE; --ink:#13243B; --ink2:#4A5D75; --surface:#FFFFFF; --line:#C3D1E0; --line2:#8FA3BA;
  --hl:#FFD84A; --hl-ink:#13243B;
  --q1:#2F6FED; --q2:#168A5C; --q3:#C85A0C; --q4:#7A4FD0; --ask:#C9285F;
  --ok:#14804F; --okbg:#DDF3E8; --bad:#B4331F; --badbg:#FCE4DF; --info:#1D5FD1; --infobg:#E3EDFC;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A28; --grid:#182739; --ink:#E7EEF6; --ink2:#A3B4C8; --surface:#16263A; --line:#2B3E57; --line2:#5B7391;
  --hl:#E8C23A; --hl-ink:#101C2C;
  --q1:#7CABFF; --q2:#3FCB93; --q3:#FF9A52; --q4:#B79BFF; --ask:#FF7AA6;
  --ok:#4CC38A; --okbg:#143826; --bad:#FF8A75; --badbg:#41201B; --info:#7CABFF; --infobg:#17294A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A28; --grid:#182739; --ink:#E7EEF6; --ink2:#A3B4C8; --surface:#16263A; --line:#2B3E57; --line2:#5B7391;
  --hl:#E8C23A; --hl-ink:#101C2C;
  --q1:#7CABFF; --q2:#3FCB93; --q3:#FF9A52; --q4:#B79BFF; --ask:#FF7AA6;
  --ok:#4CC38A; --okbg:#143826; --bad:#FF8A75; --badbg:#41201B; --info:#7CABFF; --infobg:#17294A; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-weight:600;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.02;margin:6px 0 8px;letter-spacing:-.015em;text-wrap:balance}
.lede{margin:0 0 6px;max-width:60ch;color:var(--ink2)}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h2.t{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.15;margin:14px 0 4px;text-wrap:balance}

.btn{font:inherit;font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:11px 18px;min-height:46px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:.9rem}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px;min-width:0;margin-top:14px}
.card.locked{background:transparent;border-style:dashed}
.card.locked > *:not(.sh){opacity:.65}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-weight:600;font-size:.9rem;display:grid;place-items:center}
.sh h2{font-family:var(--f-display);font-weight:700;font-size:1.2rem;margin:0;line-height:1.2}
.stt{margin-left:auto;font-family:var(--f-mono);font-size:.74rem;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.stt.done{color:var(--ok)}
.mut{color:var(--ink2);font-size:.95rem;margin:0 0 10px}

/* daftar soal siswa */
.grp h2{font-family:var(--f-mono);font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:22px 0 8px}
.list{display:grid;gap:8px}
.item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line2);border-radius:8px;padding:12px 14px;min-height:58px;cursor:pointer}
.item b{font-family:var(--f-display);font-weight:700;font-size:1.08rem}
.item small{display:block;color:var(--ink2);font-size:.82rem}
.item .ck{font-family:var(--f-mono);font-weight:600;font-size:.78rem;color:var(--ok);white-space:nowrap}
.sum{font-family:var(--f-mono);font-size:.85rem;color:var(--ink2);margin:14px 0 0}

/* latihan */
.story{font-size:1.1rem;line-height:2.3;margin:4px 0 14px}
.tok{font:inherit;color:inherit;background:transparent;border:0;border-bottom:3px dashed var(--ink2);padding:1px 4px;margin:0 1px;border-radius:3px 3px 0 0;cursor:pointer;line-height:1.5}
.tok.sel{background:var(--hl);color:var(--hl-ink);border-bottom:3px solid var(--hl-ink)}
.tok.on{border-bottom:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);font-weight:700}
.tok.cut{text-decoration:line-through;opacity:.6;border-bottom-style:dotted}
.tok:disabled{cursor:default;color:inherit}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{font:inherit;color:inherit;text-align:left;border:2px dashed var(--line2);background:transparent;border-radius:8px;padding:10px;min-height:96px;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-content:start;align-items:center}
.slot:disabled{cursor:default;color:inherit}
.slot .sym{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1;color:var(--c);overflow-wrap:anywhere}
.slot .nm{font-size:.88rem;line-height:1.25;min-width:0}
.slot .nm small{display:block;color:var(--ink2);font-size:.78rem}
.slot .val{grid-column:1 / -1;font-family:var(--f-mono);font-weight:600;font-size:.95rem;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.slot .val em{font-style:normal;color:var(--c)}
.slot .ph{color:var(--ink2);font-weight:500}
.slot.filled{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.slot.armed{border-color:var(--c);animation:pulse 1.3s ease-in-out infinite}
.slot.coret{grid-column:1 / -1;min-height:0;--c:var(--ink2)}
.slot.coret .sym{font-size:1.4rem}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.98rem;border:1.5px solid var(--info);background:var(--infobg)}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b{font-family:var(--f-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.fb ul{margin:6px 0 0;padding-left:20px}
.opts{display:grid;gap:8px}
.opt{width:100%;font-family:var(--f-mono);font-weight:600;font-size:1.02rem;text-align:left;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);padding:12px;border-radius:8px;cursor:pointer;min-height:48px}
.opt.no{opacity:.6;text-decoration:line-through;cursor:default}
.opt.yes{border-color:var(--ok);background:var(--okbg);cursor:default}
.opt:disabled{color:var(--ink)}
.why{font-size:.92rem;color:var(--ink2);margin:5px 2px 2px}
.eq{font-family:var(--f-mono);font-weight:500;font-size:1rem;margin:6px 0;overflow-wrap:anywhere}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.calc input{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;width:7.5em;padding:9px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);color:var(--ink)}

/* admin */
.arow{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.arow .at{min-width:0;flex:1 1 160px}
.arow .at b{font-family:var(--f-display);font-weight:700;font-size:1.05rem;display:block}
.arow .at small{color:var(--ink2)}
.ab{display:flex;flex-wrap:wrap;gap:6px}
.f{display:grid;gap:4px;margin:0 0 10px;min-width:0}
.f > span{font-size:.85rem;font-weight:700}
.f small{color:var(--ink2);font-weight:400}
.in{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.rowc{border:1.5px dashed var(--line2);border-radius:8px;padding:12px;margin:0 0 10px}
.rowc h3{margin:0 0 8px;font-family:var(--f-display);font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fs{margin:18px 0 8px;font-family:var(--f-mono);font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.radio{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-weight:700;font-size:.92rem}
.radio input{width:20px;height:20px}
.foot{margin:22px 0 0;font-size:.85rem;color:var(--ink2);max-width:70ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

am kWh, jadi daya diubah ke kW: 20 W = 0,02 kW."},{"teks":"220 V","sym":"V","nama":"tegangan","satuan":"V","ket":"tegangan sumber, satuannya volt","konv":"","catatan":""},{"teks":"5 jam","sym":"t","nama":"waktu","satuan":"jam","ket":"lama lampu menyala (waktu), satuannya jam","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp25.000","ket":"harga lampu, tidak dipakai menghitung"}],"tanya":{"teks":"energi listrik"},"rumus":[{"f":"W = P × t","benar":true,"alasan":"Energi listrik sama dengan daya dikali waktu. Tegangan 220 V memang tertulis di soal, tetapi tidak dibutuhkan di rumus ini."},{"f":"P = V × I","benar":false,"alasan":"Ini rumus daya. Soal sudah memberi daya, yang dicari energi."},{"f":"V = I × R","benar":false,"alasan":"Ini hukum Ohm. Di soal tidak ada kuat arus I atau hambatan R."}],"hitung":{"diketahui":"P = 0,02 kW · t = 5 jam (V = 220 V tidak dipakai)","lhs":"W","ekspresi":"0,02 × 5","satuan":"kWh","jawaban":0.1,"salah":[{"nilai":100,"pesan":"100 itu dalam Wh (20 W × 5 jam). Soal minta kWh, jadi bagi 1.000."}],"petunjuk":"Kalikan daya dalam kW dengan waktu dalam jam.","penjelasan":"W = P × t = 0,02 × 5 = 0,1 kWh."}},{"id":"magnet-trafo","topik":"Magnet","judul":"Trafo charger","cerita":"Charger HP memakai trafo untuk mengubah tegangan listrik PLN 220 V menjadi 11 V. Kumparan primer trafo itu punya 1.000 lilitan. Charger itu dibeli Rina seharga Rp80.000. Berapa jumlah lilitan kumparan sekunder?","besaran":[{"teks":"220 V","sym":"Vp","nama":"tegangan primer","satuan":"V","ket":"tegangan dari PLN yang masuk ke trafo, jadi tegangan primer (Vp)","konv":"","catatan":""},{"teks":"11 V","sym":"Vs","nama":"tegangan sekunder","satuan":"V","ket":"tegangan yang keluar ke HP, jadi tegangan sekunder (Vs)","konv":"","catatan":""},{"teks":"1.000 lilitan","sym":"Np","nama":"lilitan primer","satuan":"lilitan","ket":"jumlah lilitan kumparan primer (Np)","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp80.000","ket":"harga charger, tidak dipakai menghitung"}],"tanya":{"teks":"jumlah lilitan kumparan sekunder"},"rumus":[{"f":"Ns = Np × Vs ÷ Vp","benar":true,"alasan":"Perbandingan trafo: Np : Ns = Vp : Vs. Rumus ini adalah bentuk yang sudah diubah untuk mencari Ns."},{"f":"Ns = Np × Vp ÷ Vs","benar":false,"alasan":"Terbalik. Tegangan turun dari 220 V ke 11 V, jadi lilitan sekunder harus lebih sedikit dari primer. Rumus ini menghasilkan lebih banyak."},{"f":"Ns = Vs ÷ (Np × Vp)","benar":false,"alasan":"Rumus ini tidak ada di materi trafo. Perbandingan lilitan sama dengan perbandingan tegangan."}],"hitung":{"diketahui":"Np = 1.000 · Vp = 220 V · Vs = 11 V","lhs":"Ns","ekspresi":"1.000 × 11 ÷ 220","satuan":"lilitan","jawaban":50,"salah":[{"nilai":20000,"pesan":"20.000 muncul kalau Vp dan Vs tertukar. Trafo ini menurunkan tegangan, jadi Ns harus lebih sedikit dari 1.000."}],"petunjuk":"Kalikan 1.000 dengan 11, lalu bagi dengan 220.","penjelasan":"Ns = Np × Vs ÷ Vp = 1.000 × 11 ÷ 220 = 50 lilitan. Lilitan sekunder jauh lebih sedikit, jadi tegangan turun menjadi 11 V."}},{"id":"energi-buku","topik":"Energi","judul":"Buku di atas lemari","cerita":"Sebuah buku bermassa 500 g diletakkan di atas lemari setinggi 2 m dari lantai. Percepatan gravitasi 10 m/s². Buku itu dibeli seharga Rp40.000. Berapa energi potensial buku tersebut?","besaran":[{"teks":"500 g","sym":"m","nama":"massa","satuan":"kg","ket":"massa buku, satuannya gram","konv":"= 0,5 kg","catatan":"Di rumus, massa harus dalam kg: 500 g = 0,5 kg."},{"teks":"2 m","sym":"h","nama":"tinggi","satuan":"m","ket":"ketinggian buku dari lantai, satuannya meter","konv":"","catatan":""},{"teks":"10 m/s²","sym":"g","nama":"gravitasi","satuan":"m/s²","ket":"percepatan gravitasi","konv":"","catatan":""}],"pengecoh":[{"teks":"Rp40.000","ket":"harga buku, tidak dipakai menghitung"}],"tanya":{"teks":"energi potensial buku"},"rumus":[{"f":"Ep = m × g × h","benar":true,"alasan":"Energi potensial bergantung pada massa, percepatan gravitasi, dan ketinggian."},{"f":"Ek = ½ × m × v²","benar":false,"alasan":"Ini ene ikan suhu air, satuannya derajat Celsius","konv":"","catatan":""},{"teks":"4.200 J/kg°C","sym":"c","nama":"kalor jenis","satuan":"J/kg°C","ket":"kalor jenis air, yaitu kalor untuk menaikkan suhu 1 kg air sebesar 1°C","konv":"","catatan":""}],"pengecoh":[{"teks":"5 menit","ket":"lama pemanasan, tidak dipakai menghitung"}],"tanya":{"teks":"kalor yang diterima air"},"rumus":[{"f":"Q = m × c × ΔT","benar":true,"alasan":"Kalor yang diterima bergantung pada massa, kalor jenis, dan kenaikan suhu."},{"f":"Q = m × ΔT ÷ c","benar":false,"alasan":"Kalor jenis c harus dikalikan, bukan membagi."},{"f":"P = W ÷ t","benar":false,"alasan":"Ini rumus daya, bukan rumus kalor."}],"hitung":{"diketahui":"m = 2 kg · c = 4.200 J/kg°C · ΔT = 30°C","lhs":"Q","ekspresi":"2 × 4.200 × 30","satuan":"J","jawaban":252000,"salah":[{"nilai":126000,"pesan":"126.000 belum dikalikan massa 2 kg."}],"petunjuk":"Kalikan massa, kalor jenis, dan kenaikan suhu.","penjelasan":"Q = m × c × ΔT = 2 × 4.200 × 30 = 252.000 J."}},{"id":"listrik-biaya-lampu","topik":"Listrik","judul":"Biaya listrik lampu Rian","cerita":"Rian menggunakan lampu selama 8 jam setiap hari dengan daya lampu sebesar 50 watt. Satu bulan dianggap 30 hari. Berapa biaya listrik per bulan untuk lampu tersebut jika 1 kWh = Rp1.500?","besaran":[{"teks":"50 watt","sym":"P","nama":"daya","satuan":"kW","ket":"daya lampu, satuannya watt","konv":"= 0,05 kW","catatan":"Tarif dihitung per kWh, jadi daya diubah ke kW: 50 W = 0,05 kW."},{"teks":"8 jam","sym":"t","nama":"waktu per hari","satuan":"jam","ket":"lama lampu menyala setiap hari, satuannya jam","konv":"","catatan":""},{"teks":"30 hari","sym":"hari","nama":"jumlah hari","satuan":"hari","ket":"jumlah hari dalam satu bulan","konv":"","catatan":""},{"teks":"Rp1.500","sym":"tarif","nama":"tarif","satuan":"Rp/kWh","ket":"tarif listrik untuk setiap 1 kWh","konv":"","catatan":""}],"pengecoh":[],"tanya":{"teks":"biaya listrik per bulan"},"rumus":[{"f":"Biaya = P × t × hari × tarif","benar":true,"alasan":       petunjuk:str(h.petunjuk),penjelasan:str(h.penjelasan)}
  };
}
function toDraft(s){
  var d=JSON.parse(JSON.stringify(s));
  d.hitung.jawaban=isNaN(s.hitung.jawaban)?'':fmt(s.hitung.jawaban);
  d.hitung.salah=s.hitung.salah.map(function(x,i){return {nilai:isNaN(x.nilai)?'':fmt(x.nilai),pesan:d.hitung.salah[i].pesan};});
  return d;
}
function fromDraft(d){
  var s=JSON.parse(JSON.stringify(d));
  var tr=function(o){for(var k in o){if(typeof o[k]==='string')o[k]=o[k].trim();}};
  tr(s);s.besaran.forEach(tr);s.pengecoh.forEach(tr);tr(s.tanya);s.rumus.forEach(tr);tr(s.hitung);s.hitung.salah.forEach(tr);
  s.hitung.jawaban=parseNum(s.hitung.jawaban);
  s.hitung.salah.forEach(function(x){x.nilai=parseNum(x.nilai);});
  return s;
}
/* mencari posisi tiap penanda di dalam cerita */
function locate(s){
  var toks=[],errs=[],used=[];
  s.besaran.forEach(function(b,i){toks.push({kind:'b'+i,txt:b.teks,ref:b,idx:i});});
  s.pengecoh.forEach(function(d,i){toks.push({kind:'decoy',txt:d.teks,ref:d,idx:i});});
  toks.push({kind:'ask',txt:s.tanya.teks,ref:s.tanya,idx:0});
  toks.forEach(function(t){
    if(!t.txt)return;
    var from=0,pos=-1,i,j;
    while(true){
      i=s.cerita.indexOf(t.txt,from);if(i<0)break;
      j=i+t.txt.length;
      var clash=used.some(function(u){return i<u.j&&j>u.i;});
      if(!clash){pos=i;break;}
      from=i+1;
    }
    if(pos<0){errs.push('“'+t.txt+'” tidak ditemukan di cerita, atau bertumpukan dengan penanda lain. Ketik persis seperti di cerita.');return;}
    t.i=pos;t.j=pos+t.txt.length;used.push(t);
  });
  return {toks:toks,errs:errs};
}
function check(s){
  var e=[],syms={};
  if(!s.judul)e.push('Judul soal belum diisi.');
  if(!s.topik)e.push('Topik belum diisi.');
  if(!s.cerita)e.push('Cerita soal belum diisi.');
  if(!s.besaran.length)e.push('Tambahkan minimal satu besaran.');
  s.besaran.forEach(function(b,i){var n='Besaran '+(i+1)+': ';
    if(!b.teks)e.push(n+'teks di cerita belum diisi.');
    if(!b.sym)e.push(n+'simbol belum diisi.');
    else if(syms[b.sym])e.push(n+'simbol “'+b.sym+'” dipakai dua kali.');
    syms[b.sym]=1;
    if(!b.nama)e.push(n+'nama besaran belum diisi.');
  });
  s.pengecoh.forEach(function(d,i){if(!d.teks)e.push('Pengecoh '+(i+1)+': teks belum diisi.');});
  if(!s.tanya.teks)e.push('Kalimat yang ditanya belum diisi.');
  if(s.cerita)locate(s).errs.forEach(function(x){e.push(x);});
  if(s.rumus.length<2)e.push('Isi minimal dua pilihan rumus.');
  s.rumus.forEach(function(r,i){if(!r.f)e.push('Rumus '+(i+1)+' belum diisi.');});
  if(s.rumus.filter(function(r){return r.benar;}).length!==1)e.push('Pilih tepat satu rumus yang benar.');
  var h=s.hitung;
  if(!h.lhs)e.push('Hitung: bagian kiri persamaan belum diisi (contoh: Ek = Ep).');
  if(!h.ekspresi)e.push('Hitung: isi perhitungan dengan angka belum diisi.');
  if(!h.satuan)e.push('Hitung: satuan jawaban belum diisi.');
  if(typeof h.jawaban!=='number'||isNaN(h.jawaban))e.push('Hitung: jawaban akhir harus berupa angka.');
  h.salah.forEach(function(x,i){
    if(typeof x.nilai!=='number'||isNaN(x.nilai))e.push('Jawaban salah '+(i+1)+': nilainya harus berupa angka.');
    if(!x.pesan)e.push('Jawaban salah '+(i+1)+': pesan petunjuk belum diisi.');
  });
  return e;
}
function compile(s){
  var L=locate(s),ok=L.toks.filter(function(t){return t.i!=null;}).sort(function(a,b){return a.i-b.i;});
  var story=[],pos=0;
  ok.forEach(function(t){
    if(t.i>pos)story.push(s.cerita.slice(pos,t.i));
    if(t.kind==='ask')story.push({k:'ask',id:'tq',txt:t.txt,what:'kalimat pertanyaan'});
    else if(t.kind==='decoy')story.push({k:'decoy',id:'d'+t.idx,txt:t.txt,what:t.ref.ket||'info yang tidak dipakai menghitung'});
    else story.push({k:t.kind,id:'t'+t.idx,txt:t.txt,what:t.ref.ket||t.ref.nama,conv:t.ref.konv,note:t.ref.catatan});
    pos=t.j;
  });
  if(pos<s.cerita.length)story.push(s.cerita.slice(pos));
  var slots=s.besaran.map(function(b,i){return {k:'b'+i,sym:b.sym,name:b.nama,u:b.satuan?'satuan '+b.satuan:''};});
  slots.push({k:'ask',sym:'?',name:'Ditanya',u:'jawab dalam '+s.hitung.satuan});
  var h=s.hitung;
  return {id:s.id,judul:s.judul,topik:s.topik,story:story,slots:slots,
    formulas:s.rumus.map(function(r){return {f:r.f,ok:r.benar,why:r.alasan};}),
    calc:{given:h.diketahui,lhs:h.lhs,expr:h.ekspresi,unit:h.satuan,ans:h.jawaban,
      alt:h.salah.map(function(x){return {v:x.nilai,msg:x.pesan};}),tip:h.petunjuk||'Hitung lagi dengan teliti.',explain:h.penjelasan}};
}

var data=[],source='bawaan',done={},pin=DEFPIN;
var view='home',cur=null,cp=null,RS={},sel=null,fk=null,scrollTo=null,previewFrom=null;

function persist(){
  var ok=store.set(KEY,JSON.stringify({versi:1,soal:data}));
  if(ok)source='perangkat';
  return ok;
}
function saveDone(){store.set(DONEKEY,JSON.stringify(done));}
function readList(j){var l=Array.isArray(j)?j:(j&&Array.isArray(j.soal)?j.soal:null);return l?l.map(norm):null;}
async function load(skipLocal){
  var list=null;
  if(!skipLocal){
    var raw=store.get(KEY);
    if(raw){try{list=readList(JSON.parse(raw));if(list)source='perangkat';}catch(e){list=null;}}
  }
  if(!list){
    try{var r=await fetch('soal.json',{cache:'no-cache'});if(r.ok){list=readList(await r.json());if(list)source='soal.json';}}catch(e){list=null;}
  }
  if(!list){try{list=readList(JSON.parse($('#seed').textContent));source='bawaan';}catch(e){list=[];}}
  data=list;
}
function newState(p){
  var order=p.formulas.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  return {placed:{},crossed:[],fTried:[],formulaOk:false,solved:false,input:'',calcMsg:null,order:order,
    msg:{t:'info',x:'Mulai dari cerita: sentuh satu angka, lalu sentuh kotak yang cocok.'}};
}

/* ---------- Latihan ---------- */
function tokenById(p,id){for(var i=0;i<p.story.length;i++){if(typeof p.story[i]!=='string'&&p.story[i].id===id)return p.story[i];}return null;}
function decoysOf(p){return p.story.filter(function(x){return typeof x!=='string'&&x.k==='decoy';});}
function stage1Done(p,st){
  return p.slots.every(function(s){return st.placed[s.k];})&&decoysOf(p).every(function(d){return st.crossed.indexOf(d.id)>=0;});
}
function setMsg(t,x){RS[cur].msg={t:t,x:x};}
function onToken(id){
  var p=cp,st=RS[cur],k,pk=null;
  for(k in st.placed){if(st.placed[k]===id)pk=k;}
  if(pk){delete st.placed[pk];sel=null;setMsg('info','Dikembalikan ke cerita. Pilih lagi kalau mau.');return;}
  var ci=st.crossed.indexOf(id);
  if(ci>=0){st.crossed.splice(ci,1);sel=null;setMsg('info','Coretan dibatalkan.');return;}
  var t=tokenById(p,id);
  if(sel===id){sel=null;setMsg('info','Pilihan dibatalkan.');return;}
  sel=id;setMsg('info','Terpilih: “'+t.txt+'”. Sekarang sentuh kotak yang cocok.');
}
function onSlot(kind){
  var p=cp,st=RS[cur];
  if(!sel){
    if(kind!=='coret'&&st.placed[kind]){delete st.placed[kind];setMsg('info','Kotak dikosongkan.');}
    else{setMsg('info','Pilih dulu kata atau angka di cerita, baru sentuh kotaknya.');}
    return;
  }
  var t=tokenById(p,sel),slot=null;
  p.slots.forEach(function(s){if(s.k===kind)slot=s;});
  if(kind==='coret'){
    if(t.k==='decoy'){st.crossed.push(t.id);sel=null;setMsg('ok','“'+t.txt+'” itu '+t.what+'. Dicoret.');}
    else{setMsg('bad','“'+t.txt+'” dipakai untuk menjawab soal. Jangan dicoret.');}
  }else if(t.k===kind){
    st.placed[kind]=t.id;sel=null;
    setMsg('ok','“'+t.txt+'” itu '+t.what+'.'+(t.note?' '+t.note:''));
  }else if(t.k==='decoy'){
    setMsg('bad','“'+t.txt+'” itu '+t.what+'. Taruh di kotak Coret.');
  }else if(t.k==='ask'){
    setMsg('bad','Ini kalimat pertanyaan. Taruhnya di kotak Ditanya.');
  }else if(kind==='ask'){
    setMsg('bad','Kotak Ditanya untuk kalimat pertanyaan, yang biasanya diawali “Berapa”.');
  }else{
    setMsg('bad','“'+t.txt+'” itu '+t.what+'. Kotak '+slot.sym+' untuk '+slot.name+'.');
  }
  if(stage1Done(p,st)){sel=null;setMsg('ok','Semua kotak terisi dan pengecoh sudah dicoret. Lanjut ke langkah 2.');scrollTo='s2';}
}
function onOpt(i){
  var st=RS[cur];
  if(st.fTried.indexOf(i)>=0||st.formulaOk)return;
  st.fTried.push(i);
  if(cp.formulas[i].ok){st.formulaOk=true;scrollTo='s3';}
}
function onCheck(){
  var st=RS[cur],c=cp.calc,v=parseNum(st.input),i;
  if(isNaN(v)){st.calcMsg={t:'bad',x:'Tulis angkanya saja, contoh 12,5.'};return;}
  if(Math.abs(v-c.ans)<1e-6){
    st.solved=true;st.calcMsg={t:'ok',x:c.explain||'Jawabanmu benar.'};
    if(cur!=='__prev'){done[cur]=1;saveDone();}
    return;
  }
  for(i=0;i<c.alt.length;i++){if(Math.abs(v-c.alt[i].v)<1e-6){st.calcMsg={t:'bad',x:c.alt[i].msg};return;}}
  st.calcMsg={t:'bad',x:'Belum tepat. '+c.tip};
}

  cp=compile(s);cur=id;RS[id]=newState(cp);sel=null;view='play';
}

    return '<div class="arow"><div class="at"><b>'+esc(s.judul||'(tanpa judul)')+'</b><small>'+esc(s.topik)+' · '+s.besaran.length+' besaran</small></div><div class="ab">'+btns+'</div></div>';
  }).join('')+'</div>';
  return h;
}
function fld(path,label,val,o){
  o=o||{};var id='f-'+path.replace(/\./g,'-');
  var ctl=o.area?'<textarea class="in" id="'+id+'" data-p="'+path+'" rows="'+(o.rows||3)+'" placeholder="'+esc(o.ph||'')+'">'+esc(val)+'</textarea>'
    :'<input class="in" type="text" id="'+id+'" data-p="'+path+'" value="'+esc(val)+'" placeholder="'+esc(o.ph||'')+'"'+(o.num?' inputmode="decimal"':'')+' autocomplete="off">';
  return '<label class="f"><span>'+label+(o.hint?' <small>'+o.hint+'</small>':'')+'</span>'+ctl+'</label>';
}
function formHtml(){

    h+='<div class="rowc" id="row-besaran-'+i+'"><h3>Besaran '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="besaran:'+i+'">Hapus</button></h3>'
      +fld(p+'teks','Teks di cerita',b.teks,{ph:'contoh: 200 g',hint:'ketik persis seperti di cerita'})

      +fld(p+'ket','Keterangan',b.ket,{ph:'massa apel, satuannya gram',hint:'dibaca sebagai “… itu [keterangan]”'})
      +'<div class="grid2">'+fld(p+'konv','Hasil konversi',b.konv,{ph:'= 0,2 kg',hint:'boleh kosong'})+fld(p+'catatan','Catatan konversi',b.catatan,{ph:'200 g = 0,2 kg',hint:'boleh kosong'})+'</div></div>';
  });
  h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="besaran">+ Besaran</button></div>';
  h+='<div class="fs">Info pengecoh</div><p class="mut">Angka di cerita yang tidak dipakai menghitung. Boleh kosong.</p>';
  d.pengecoh.forEach(function(x,i){var p='pengecoh.'+i+'.';
    h+='<div class="rowc" id="row-pengecoh-'+i+'"><h3>Pengecoh '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="pengecoh:'+i+'">Hapus</button></h3>'
      +'<div class="grid2">'+fld(p+'teks','Teks di cerita',x.teks,{ph:'8 tahun'})+fld(p+'ket','Keterangan',x.ket,{ph:'umur pohon, tidak dipakai menghitung'})+'</div></div>';
  });
  h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="pengecoh">+ Pengecoh</button></div>';
  h+='<div class="fs">Yang ditanya</div>'+fld('tanya.teks','Kalimat yang dicari di cerita',d.tanya.teks,{ph:'energi kinetik apel',hint:'bagian cerita yang menjadi pertanyaan'});
  h+='<div class="fs">Pilihan rumus</div><p class="mut">Isi dua sampai empat rumus, dan tandai satu yang benar. Urutan akan diacak untuk siswa.</p>';
  d.rumus.forEach(function(r,i){var p='rumus.'+i+'.';
    h+='<div class="rowc" id="row-rumus-'+i+'"><h3>Rumus '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="rumus:'+i+'">Hapus</button></h3>'
      +fld(p+'f','Rumus',r.f,{ph:'Ep = m × g × h'})
      +'<label class="radio"><input type="radio" name="benar" id="f-benar-'+i+'" data-act="a-benar" data-v="'+i+'"'+(r.benar?' checked':'')+'> Ini rumus yang benar</label>'
      +fld(p+'alasan','Penjelasan',r.alasan,{area:true,rows:2,ph:'Mengapa rumus ini benar atau salah?'})+'</div>';
  });
  if(d.rumus.length<4)h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="rumus">+ Rumus</button></div>';
  var hh=d.hitung;
  h+='<div class="fs">Perhitungan</div>'
    +fld('hitung.diketahui','Ringkasan diketahui',hh.diketahui,{ph:'m = 0,2 kg · g = 10 m/s² · h = 5 m',hint:'boleh kosong'})
    +'<div class="grid2">'+fld('hitung.lhs','Bagian kiri persamaan',hh.lhs,{ph:'Ek = Ep'})+fld('hitung.ekspresi','Perhitungan dengan angka',hh.ekspresi,{ph:'0,2 × 10 × 5'})+'</div>'
    +'<div class="grid2">'+fld('hitung.satuan','Satuan jawaban',hh.satuan,{ph:'J'})+fld('hitung.jawaban','Jawaban benar',hh.jawaban,{ph:'10',num:true,hint:'angka saja'})+'</div>'
    +fld('hitung.petunjuk','Petunjuk kalau salah',hh.petunjuk,{ph:'Kalikan tiga angka di atas dengan teliti.',hint:'boleh kosong'})
    +fld('hitung.penjelasan','Penjelasan jawaban benar',hh.penjelasan,{area:true,rows:2,ph:'Ek = Ep = m × g × h = 10 J',hint:'boleh kosong'});
  h+='<div class="fs">Kesalahan yang sering muncul</div><p class="mut">Kalau siswa menjawab angka tertentu, tampilkan petunjuk khusus. Boleh kosong.</p>';
  hh.salah.forEach(function(x,i){var p='hitung.salah.'+i+'.';
    h+='<div class="rowc" id="row-salah-'+i+'"><h3>Jawaban salah '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="salah:'+i+'">Hapus</button></h3>'
      +'<div class="grid2">'+fld(p+'nilai','Angka jawaban',x.nilai,{ph:'10000',num:true})+fld(p+'pesan','Petunjuk',x.pesan,{ph:'Massa belum diubah ke kg.'})+'</div></div>';
  });
  h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="salah">+ Jawaban salah umum</button></div>';
  h+='<div class="row" style="margin-top:20px"><button class="btn" data-act="a-save" data-fk="save">Simpan soal</button><button class="btn ghost" data-act="a-preview" data-fk="preview">Coba soal ini</button><button class="btn ghost" data-act="a-cancel-edit" data-fk="cancel-edit">Batal</button></div>';
  return h;
}
function jsonText(){return JSON.stringify({versi:1,soal:data},null,2);}
function exportHtml(){
  return '<section class="card"><div class="sh"><h2>Ekspor soal</h2></div><p class="mut">Simpan teks ini sebagai <b>soal.json</b> lalu unggah ke tempat aplikasi dihosting supaya semua siswa memakai soal terbaru.</p>'
    +'<textarea class="in" id="exp" readonly rows="10" style="font-family:var(--f-mono);font-size:.8rem">'+esc(jsonText())+'</textarea>'
    +'<div class="row"><button class="btn" data-act="a-copy" data-fk="copy">Salin teks</button><button class="btn ghost" data-act="a-download" data-fk="dl">Unduh soal.json</button></div></section>';
}
function importHtml(){
  var h='<section class="card"><div class="sh"><h2>Impor soal</h2></div><p class="mut">Tempel isi soal.json di bawah, atau pilih berkasnya.</p>'
    +'<label class="f"><span>Berkas soal.json</span><input class="in" type="file" id="impf" accept=".json,application/json"></label>'
    +'<label class="f"><span>Atau tempel teks</span><textarea class="in" id="imp" rows="8" style="font-family:var(--f-mono);font-size:.8rem">'+esc(impText)+'</textarea></label>'
    +'<label class="radio"><input type="radio" name="mode" id="mode-tambah" data-act="a-mode" data-v="tambah"'+(impMode==='tambah'?' checked':'')+'> Tambahkan ke daftar yang ada</label>'
    +'<label class="radio"><input type="radio" name="mode" id="mode-ganti" data-act="a-mode" data-v="ganti"'+(impMode==='ganti'?' checked':'')+'> Ganti semua soal</label>';
  if(confirmKey==='imp')h+='<div class="fb bad" role="status"><b>Yakin?</b>Semua soal yang ada sekarang akan diganti.</div><div class="row"><button class="btn danger" data-act="a-imp" data-fk="imp">Ya, ganti</button><button class="btn ghost" data-act="a-cancel" data-fk="cancel">Batal</button></div>';
  else h+='<div class="row"><button class="btn" data-act="a-imp" data-fk="imp">Impor</button></div>';
  return h+'</section>';
}
function setHtml(){
  var h='<section class="card"><div class="sh"><h2>Ganti PIN</h2></div><label class="f"><span>PIN baru <small>minimal 4 karakter</small></span><input class="in" id="pin1" type="password" inputmode="numeric" autocomplete="off" style="max-width:12em"></label><div class="row"><button class="btn" data-act="a-pin" data-fk="pin">Simpan PIN</button></div>'
    +'<p class="mut" style="margin-top:10px">PIN hanya mencegah ubahan tak sengaja di perangkat ini. PIN bukan pengaman data.</p></section>';
  h+='<section class="card"><div class="sh"><h2>Data di perangkat ini</h2></div><p class="mut">Soal yang kamu ubah tersimpan di peramban perangkat ini. Buang ubahan untuk kembali ke soal.json atau soal bawaan.</p>';
  if(confirmKey==='reset')h+='<div class="fb bad" role="status"><b>Yakin?</b>Semua ubahan di perangkat ini hilang. Ekspor dulu kalau perlu.</div><div class="row"><button class="btn danger" data-act="a-reset-yes" data-fk="reset">Ya, buang ubahan</button><button class="btn ghost" data-act="a-cancel" data-fk="cancel">Batal</button></div>';
  else h+='<div class="row"><button class="btn ghost" data-act="a-reset" data-fk="reset">Buang ubahan di perangkat ini</button><button class="btn ghost" data-act="a-clear-done" data-fk="cleardone">Hapus catatan selesai siswa</button></div>';
  return h+'</section>';
}
function adminHtml(){
  if(!adminOK)return loginHtml();
  var h=toolbar()+noticeHtml();
  if(adminTab==='edit')return h+formHtml();
  if(adminTab==='import')return h+importHtml();
  if(adminTab==='export')return h+exportHtml();
  if(adminTab==='set')return h+setHtml();
  return h+listHtml();
}
function setPath(o,path,v){
  var ks=path.split('.'),i;
  for(i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=v;
}
function freshId(){var id;do{id=newId();}while(data.some(function(s){return s.id===id;}));return id;}
function moveItem(id,dir){
  var i=data.findIndex(function(s){return s.id===id;}),j=i+dir;
  if(i<0||j<0||j>=data.length)return;
  var t=data[i];data[i]=data[j];data[j]=t;
}
function doSave(){
  var s=fromDraft(D),errs=check(s);
  if(errs.length){formErr=errs;scrollTo='app';return;}
  formErr=null;
  if(editId){var i=data.findIndex(function(x){return x.id===editId;});s.id=editId;if(i>=0)data[i]=s;else data.push(s);}
  else{s.id=freshId();data.push(s);}
  var ok=persist();
  notice=ok?{t:'ok',x:'Soal “'+s.judul+'” disimpan.'}:{t:'bad',x:'Soal berubah di layar tetapi tidak bisa disimpan di perangkat ini. Ekspor sekarang agar tidak hilang.'};
  adminTab='list';D=null;editId=null;
}
function doImport(){
  var j;
  try{j=JSON.parse(impText);}catch(e){notice={t:'bad',x:'Teks bukan JSON yang valid. Periksa lagi isinya.'};confirmKey=null;return;}
  var list=readList(j);
  if(!list||!list.length){notice={t:'bad',x:'Tidak ada soal di dalam teks itu.'};confirmKey=null;return;}
  var errs=[];
  list.forEach(function(s,i){check(s).forEach(function(m){errs.push('Soal '+(i+1)+' ('+(s.judul||'tanpa judul')+'): '+m);});});
  if(errs.length){notice={t:'bad',x:'Impor dibatalkan. '+errs.slice(0,3).join(' ')+(errs.length>3?' …dan '+(errs.length-3)+' masalah lain.':'')};confirmKey=null;return;}
  if(impMode==='ganti'){
    if(confirmKey!=='imp'){confirmKey='imp';return;}
    data=list;
  }else{
    list.forEach(function(s){if(data.some(function(x){return x.id===s.id;}))s.id=freshId();data.push(s);});
  }
  confirmKey=null;impText='';
  var ok=persist();
  notice={t:ok?'ok':'bad',x:ok?list.length+' soal diimpor.':'Soal diimpor tetapi tidak bisa disimpan di perangkat ini.'};
  adminTab='list';
}

/* ---------- Render ---------- */
function render(){
  $('#top').innerHTML=topHtml();
  var h='';
  if(view==='home')h=homeHtml();
  else if(view==='play')h=playHtml();
  else h=adminHtml();
  $('#app').innerHTML=h;
  $('#foot').textContent=view==='home'?'Soal dikelola guru lewat tombol Admin.':'';
  if(fk){var el=document.querySelector('[data-fk="'+fk+'"]');if(el&&!el.disabled){try{el.focus({preventScroll:true});}catch(_){}}fk=null;}
  if(selectExport){selectExport=false;var ta=$('#exp');if(ta){ta.focus();ta.select();}}
  if(scrollTo){
    var s=document.getElementById(scrollTo);scrollTo=null;
    if(s){var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;s.scrollIntoView({behavior:rm?'auto':'smooth',block:'nearest'});}
  }
}

/* ---------- Aksi ---------- */
function copyExport(){
  var t=jsonText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){notice={t:'ok',x:'Teks soal.json sudah disalin.'};render();},function(){copyFail();});
  }else copyFail();
}
function copyFail(){notice={t:'info',x:'Salin otomatis tidak didukung. Teks sudah dipilih, tekan lama lalu pilih Salin.'};selectExport=true;render();}
function download(){
  try{
    var b=new Blob([jsonText()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='soal.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    notice={t:'info',x:'Perintah unduh dikirim. Kalau berkas tidak muncul, pakai tombol Salin teks.'};
  }catch(e){notice={t:'info',x:'Unduh tidak tersedia di sini. Pakai tombol Salin teks.'};}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  fk=b.dataset.fk||null;
  if(a==='a-benar'){D.rumus.forEach(function(r,i){r.benar=(i===+v);});return;}
  if(a==='a-mode'){impMode=v;confirmKey=null;return;}
  notice=notice&&a==='a-copy'?notice:null;
  if(a==='home'){view='home';previewFrom=null;sel=null;}
  else if(a==='play'){startPlay(v,data.find(function(s){return s.id===v;}));previewFrom=null;fk=null;window.scrollTo(0,0);}
  else if(a==='tok')onToken(v);
  else if(a==='slot')onSlot(v);
  else if(a==='opt')onOpt(+v);
  else if(a==='check')onCheck();
  else if(a==='again'){RS[cur]=newState(cp);delete done[cur];saveDone();sel=null;fk=null;window.scrollTo(0,0);}
  else if(a==='next'){var n=nextUnsolvedId();if(n){startPlay(n,data.find(function(s){return s.id===n;}));fk=null;window.scrollTo(0,0);}else view='home';}
  else if(a==='a-open'){view='admin';adminTab='list';loginErr=false;confirmKey=null;fk=adminOK?null:'login';}
  else if(a==='a-login'){var pv=$('#pin');if(pv&&pv.value===pin){adminOK=true;loginErr=false;fk=null;}else{loginErr=true;fk='login';}}
  else if(a==='a-out'){adminOK=false;view='home';}
  else if(a==='a-tab'){adminTab=v;confirmKey=null;D=null;editId=null;formErr=null;}
  else if(a==='a-new'){D=blank();editId=null;formErr=null;adminTab='edit';fk=null;}
  else if(a==='a-edit'){var s0=data.find(function(s){return s.id===v;});D=toDraft(s0);editId=v;formErr=null;adminTab='edit';fk=null;window.scrollTo(0,0);}
  else if(a==='a-dup'){var s1=data.find(function(s){return s.id===v;});var c=JSON.parse(JSON.stringify(s1));c.id=freshId();c.judul=c.judul+' (salinan)';data.splice(data.indexOf(s1)+1,0,c);persist();notice={t:'ok',x:'Soal digandakan. Salinannya ada tepat di bawah.'};}
  else if(a==='a-up'){moveItem(v,-1);persist();}
  else if(a==='a-down'){moveItem(v,1);persist();}
  else if(a==='a-del'){confirmKey='del:'+v;fk='del-yes';}
  else if(a==='a-del-yes'){data=data.filter(function(s){return s.id!==v;});confirmKey=null;var ok=persist();notice={t:ok?'ok':'bad',x:ok?'Soal dihapus.':'Soal dihapus di layar tetapi tidak bisa disimpan di perangkat ini.'};fk=null;}
  else if(a==='a-cancel'){confirmKey=null;}
  else if(a==='a-cancel-edit'){adminTab='list';D=null;editId=null;formErr=null;fk=null;}
  else if(a==='a-add'){
    if(v==='besaran')D.besaran.push({teks:'',sym:'',nama:'',satuan:'',ket:'',konv:'',catatan:''});
    if(v==='pengecoh')D.pengecoh.push({teks:'',ket:''});
    if(v==='rumus')D.rumus.push({f:'',benar:false,alasan:''});
    if(v==='salah')D.hitung.salah.push({nilai:'',pesan:''});
    var lst=v==='salah'?D.hitung.salah:D[v];scrollTo='row-'+v+'-'+(lst.length-1);fk=null;
  }
  else if(a==='a-rm'){
    var pr=v.split(':'),idx=+pr[1],lst2=pr[0]==='salah'?D.hitung.salah:D[pr[0]];
    lst2.splice(idx,1);
    if(pr[0]==='rumus'&&lst2.length&&!lst2.some(function(r){return r.benar;}))lst2[0].benar=true;
    fk=null;
  }
  else if(a==='a-save')doSave();
  else if(a==='a-preview'){
    var sp=fromDraft(D),er=check(sp);
    if(er.length){formErr=er;scrollTo='app';}
    else{formErr=null;sp.id='__prev';startPlay('__prev',sp);previewFrom='edit';window.scrollTo(0,0);fk=null;}
  }
  else if(a==='a-try'){startPlay('__prev',data.find(function(s){return s.id===v;}));previewFrom='list';window.scrollTo(0,0);fk=null;}
  else if(a==='a-back'){view='admin';adminTab=previewFrom==='edit'?'edit':'list';previewFrom=null;fk=null;}
  else if(a==='a-copy')copyExport();
  else if(a==='a-download')download();
  else if(a==='a-imp')doImport();
  else if(a==='a-pin'){var np=$('#pin1');if(np&&np.value.length>=4){pin=np.value;store.set(PINKEY,pin);notice={t:'ok',x:'PIN diganti.'};}else{notice={t:'bad',x:'PIN minimal 4 karakter.'};}}
  else if(a==='a-reset'){confirmKey='reset';}
  else if(a==='a-reset-yes'){store.del(KEY);confirmKey=null;load(true).then(function(){notice={t:'ok',x:'Ubahan dibuang. Sumber data sekarang: '+srcLabel()+'.'};render();});return;}
  else if(a==='a-clear-done'){done={};saveDone();notice={t:'ok',x:'Catatan selesai siswa di perangkat ini dihapus.'};}
  render();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.p&&D){setPath(D,t.dataset.p,t.value);}
  else if(t.id==='ans'){RS[cur].input=t.value;}
  else if(t.id==='imp'){impText=t.value;confirmKey=null;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='impf'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){impText=String(fr.result||'');confirmKey=null;render();};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.id==='ans'){e.preventDefault();onCheck();fk='check';render();}
  else if(e.target.id==='pin'){e.preventDefault();var pv=$('#pin');if(pv&&pv.value===pin){adminOK=true;loginErr=false;}else loginErr=true;render();}
});

/* ---------- Mulai ---------- */
(async function(){
  pin=store.get(PINKEY)||DEFPIN;
  try{done=JSON.parse(store.get(DONEKEY)||'{}')||{};}catch(e){done={};}
  await load(false);
  render();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
  }
})();
})();
