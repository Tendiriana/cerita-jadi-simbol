name: Build Senter APK

on:
  push:
    paths:
      - 'senter/**'
      - '.github/workflows/senter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: senter
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp senter/app/build/outputs/apk/debug/app-debug.apk Senter.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: senter-apk
          path: Senter.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: senter
          name: Senter (APK terbaru)
          body: |
            Aplikasi Senter — satu tombol untuk menyalakan/mematikan lampu senter.
            Unduh **Senter.apk** di bawah, lalu pasang di HP Android
            (izinkan "instal dari sumber tak dikenal").
          files: Senter.apk
