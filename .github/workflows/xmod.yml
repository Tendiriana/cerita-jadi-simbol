name: Build X-Mod Launcher APK

on:
  push:
    paths:
      - 'xmod/**'
      - '.github/workflows/xmod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: xmod
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp xmod/app/build/outputs/apk/debug/app-debug.apk X-Mod-Launcher.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmod-apk
          path: X-Mod-Launcher.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xmod
          name: X-Mod Launcher (APK terbaru)
          body: |
            X-Mod Launcher — launcher terminal premium klasik (amber).
            Unduh **X-Mod-Launcher.apk** di bawah, pasang, lalu set sebagai
            launcher default. Tekan tombol Home untuk memilih X-Mod.
          files: X-Mod-Launcher.apk
