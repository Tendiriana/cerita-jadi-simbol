  h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="variasi">+ Variasi</button></div>';
  h+='<div class="fs">Besaran yang dipakai</div><p class="mut">Satu besaran untuk satu angka di cerita yang dipakai menghitung.</p>';
  d.besaran.forEach(function(b,i){var p='besaran.'+i+'.';
    h+='<div class="rowc" id="row-besaran-'+i+'"><h3>Besaran '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="besaran:'+i+'">Hapus</button></h3>'
      +fld(p+'teks','Teks di cerita',b.teks,{ph:'contoh: 200 g',hint:'ketik persis seperti di cerita'})
      +'<div class="grid2">'+fld(p+'sym','Simbol',b.sym,{ph:'m'})+fld(p+'nama','Nama besaran',b.nama,{ph:'massa'})+fld(p+'satuan','Satuan di rumus',b.satuan,{ph:'kg'})+'</div>'
      +fld(p+'ket','Keterangan',b.ket,{ph:'massa apel, satuannya gram',hint:'dibaca sebagai “… itu [keterangan]”'})
      +'<div class="grid2">'+fld(p+'konv','Hasil konversi',b.konv,{ph:'= 0,2 kg',hint:'boleh kosong'})+fld(p+'catatan','Catatan konversi',b.catatan,{ph:'200 g = 0,2 kg',hint:'boleh kosong'})+'</div></div>';
  });
  h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="besaran">+ Besaran</button></div>';
  h+='<div class="fs">Info pengecoh</div><p class="mut">Angka di cerita yang tidak dipakai menghitung. Boleh kosong.</p>';
  d.pengecoh.forEach(function(x,i){var p='pengecoh.'+i+'.';
    h+='<div class="rowc" id="row-pengecoh-'+i+'"><h3>Pengecoh '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="pengecoh:'+i+'">Hapus</button></h3>'
      +'<div class="grid2">'+fld(p+'teks','Teks di cerita',x.teks,{ph:'8 tahun'})+fld(p+'ket','Keterangan',x.ket,{ph:'umur pohon, tidak dipakai menghitung'})+'</div></div>';
  });
  h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="pengecoh">+ Pengecoh</button></div>';
  h+='<div class="fs">Yang ditanya</div>'+fld('tanya.teks','Kalimat yang dicari di cerita',d.tanya.teks,{ph:'energi kinetik apel',hint:'bagian cerita yang menjadi pertanyaan'});
  h+='<div class="fs">Pilihan rumus</div><p class="mut">Isi dua sampai empat rumus, dan tandai satu yang benar. Urutan akan diacak untuk siswa.</p>';
  d.rumus.forEach(function(r,i){var p='rumus.'+i+'.';
    h+='<div class="rowc" id="row-rumus-'+i+'"><h3>Rumus '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="rumus:'+i+'">Hapus</button></h3>'
      +fld(p+'f','Rumus',r.f,{ph:'Ep = m × g × h'})
      +'<label class="radio"><input type="radio" name="benar" id="f-benar-'+i+'" data-act="a-benar" data-v="'+i+'"'+(r.benar?' checked':'')+'> Ini rumus yang benar</label>'
      +fld(p+'alasan','Penjelasan',r.alasan,{area:true,rows:2,ph:'Mengapa rumus ini benar atau salah?'})+'</div>';
  });
  if(d.rumus.length<4)h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="rumus">+ Rumus</button></div>';
  var hh=d.hitung;
  h+='<div class="fs">Perhitungan</div>'
    +fld('hitung.diketahui','Ringkasan diketahui',hh.diketahui,{ph:'m = 0,2 kg · g = 10 m/s² · h = 5 m',hint:'boleh kosong'})
    +'<div class="grid2">'+fld('hitung.lhs','Bagian kiri persamaan',hh.lhs,{ph:'Ek = Ep'})+fld('hitung.ekspresi','Perhitungan dengan angka',hh.ekspresi,{ph:'0,2 × 10 × 5'})+'</div>'
    +'<div class="grid2">'+fld('hitung.satuan','Satuan jawaban',hh.satuan,{ph:'J'})+fld('hitung.jawaban','Jawaban benar',hh.jawaban,{ph:'10',num:true,hint:'angka saja'})+'</div>'
    +fld('hitung.angka','Rumus jawaban (dengan variasi)',hh.angka,{ph:'mkg * 10 * tinggi',hint:'kosongkan kalau tidak pakai variasi'})
    +fld('hitung.petunjuk','Petunjuk kalau salah',hh.petunjuk,{ph:'Kalikan tiga angka di atas dengan teliti.',hint:'boleh kosong'})
    +fld('hitung.penjelasan','Penjelasan jawaban benar',hh.penjelasan,{area:true,rows:2,ph:'Ek = Ep = m × g × h = 10 J',hint:'boleh kosong'});
  h+='<div class="fs">Kesalahan yang sering muncul</div><p class="mut">Kalau siswa menjawab angka tertentu, tampilkan petunjuk khusus. Boleh kosong.</p>';
  hh.salah.forEach(function(x,i){var p='hitung.salah.'+i+'.';
    h+='<div class="rowc" id="row-salah-'+i+'"><h3>Jawaban salah '+(i+1)+'<button class="btn ghost sm" data-act="a-rm" data-v="salah:'+i+'">Hapus</button></h3>'
      +'<div class="grid2">'+fld(p+'nilai','Angka jawaban',x.nilai,{ph:'10000',num:true})+fld(p+'pesan','Petunjuk',x.pesan,{ph:'Massa belum diubah ke kg.'})+'</div>'+fld(p+'rumus','Rumus jawaban salah (opsional)',x.rumus,{ph:'massa * 10 * tinggi',hint:'kalau pakai variasi'})+'</div>';
  });
  h+='<div class="row" style="margin:0 0 6px"><button class="btn ghost sm" data-act="a-add" data-v="salah">+ Jawaban salah umum</button></div>';
  h+='<div class="row" style="margin-top:20px"><button class="btn" data-act="a-save" data-fk="save">Simpan soal</button><button class="btn ghost" data-act="a-preview" data-fk="preview">Coba soal ini</button><button class="btn ghost" data-act="a-cancel-edit" data-fk="cancel-edit">Batal</button></div>';
  return h;
}
function jsonText(){return JSON.stringify({versi:1,soal:data},null,2);}
function exportHtml(){
  return '<section class="card"><div class="sh"><h2>Ekspor soal</h2></div><p class="mut">Simpan teks ini sebagai <b>soal.json</b> lalu unggah ke tempat aplikasi dihosting supaya semua siswa memakai soal terbaru.</p>'
    +'<textarea class="in" id="exp" readonly rows="10" style="font-family:var(--f-mono);font-size:.8rem">'+esc(jsonText())+'</textarea>'
    +'<div class="row"><button class="btn" data-act="a-copy" data-fk="copy">Salin teks</button><button class="btn ghost" data-act="a-download" data-fk="dl">Unduh soal.json</button></div></section>';
}
function importHtml(){
  var h='<section class="card"><div class="sh"><h2>Impor soal</h2></div><p class="mut">Tempel isi soal.json di bawah, atau pilih berkasnya.</p>'
    +'<label class="f"><span>Berkas soal.json</span><input class="in" type="file" id="impf" accept=".json,application/json"></label>'
    +'<label class="f"><span>Atau tempel teks</span><textarea class="in" id="imp" rows="8" style="font-family:var(--f-mono);font-size:.8rem">'+esc(impText)+'</textarea></label>'
    +'<label class="radio"><input type="radio" name="mode" id="mode-tambah" data-act="a-mode" data-v="tambah"'+(impMode==='tambah'?' checked':'')+'> Tambahkan ke daftar yang ada</label>'
    +'<label class="radio"><input type="radio" name="mode" id="mode-ganti" data-act="a-mode" data-v="ganti"'+(impMode==='ganti'?' checked':'')+'> Ganti semua soal</label>';
  if(confirmKey==='imp')h+='<div class="fb bad" role="status"><b>Yakin?</b>Semua soal yang ada sekarang akan diganti.</div><div class="row"><button class="btn danger" data-act="a-imp" data-fk="imp">Ya, ganti</button><button class="btn ghost" data-act="a-cancel" data-fk="cancel">Batal</button></div>';
  else h+='<div class="row"><button class="btn" data-act="a-imp" data-fk="imp">Impor</button></div>';
  return h+'</section>';
}
function setHtml(){
  var h='<section class="card"><div class="sh"><h2>Ganti PIN</h2></div><label class="f"><span>PIN baru <small>minimal 4 karakter</small></span><input class="in" id="pin1" type="password" inputmode="numeric" autocomplete="off" style="max-width:12em"></label><div class="row"><button class="btn" data-act="a-pin" data-fk="pin">Simpan PIN</button></div>'
    +'<p class="mut" style="margin-top:10px">PIN hanya mencegah ubahan tak sengaja di perangkat ini. PIN bukan pengaman data.</p></section>';
  h+='<section class="card"><div class="sh"><h2>Data di perangkat ini</h2></div><p class="mut">Soal yang kamu ubah tersimpan di peramban perangkat ini. Buang ubahan untuk kembali ke soal.json atau soal bawaan.</p>';
  if(confirmKey==='reset')h+='<div class="fb bad" role="status"><b>Yakin?</b>Semua ubahan di perangkat ini hilang. Ekspor dulu kalau perlu.</div><div class="row"><button class="btn danger" data-act="a-reset-yes" data-fk="reset">Ya, buang ubahan</button><button class="btn ghost" data-act="a-cancel" data-fk="cancel">Batal</button></div>';
  else h+='<div class="row"><button class="btn ghost" data-act="a-reset" data-fk="reset">Buang ubahan di perangkat ini</button><button class="btn ghost" data-act="a-clear-done" data-fk="cleardone">Hapus catatan selesai siswa</button></div>';
  return h+'</section>';
}
function adminHtml(){
  if(!adminOK)return loginHtml();
  var h=toolbar()+noticeHtml();
  if(adminTab==='edit')return h+formHtml();
  if(adminTab==='import')return h+importHtml();
  if(adminTab==='export')return h+exportHtml();
  if(adminTab==='set')return h+setHtml();
  return h+listHtml();
}
function setPath(o,path,v){
  var ks=path.split('.'),i;
  for(i=0;i<ks.length-1;i++)o=o[ks[i]];
  o[ks[ks.length-1]]=v;
}
function freshId(){var id;do{id=newId();}while(data.some(function(s){return s.id===id;}));return id;}
function moveItem(id,dir){
  var i=data.findIndex(function(s){return s.id===id;}),j=i+dir;
  if(i<0||j<0||j>=data.length)return;
  var t=data[i];data[i]=data[j];data[j]=t;
}
function doSave(){
  var s=fromDraft(D),errs=check(s);
  if(errs.length){formErr=errs;scrollTo='app';return;}
  formErr=null;
  if(editId){var i=data.findIndex(function(x){return x.id===editId;});s.id=editId;if(i>=0)data[i]=s;else data.push(s);}
  else{s.id=freshId();data.push(s);}
  var ok=persist();
  notice=ok?{t:'ok',x:'Soal “'+s.judul+'” disimpan.'}:{t:'bad',x:'Soal berubah di layar tetapi tidak bisa disimpan di perangkat ini. Ekspor sekarang agar tidak hilang.'};
  adminTab='list';D=null;editId=null;
}
function doImport(){
  var j;
  try{j=JSON.parse(impText);}catch(e){notice={t:'bad',x:'Teks bukan JSON yang valid. Periksa lagi isinya.'};confirmKey=null;return;}
  var list=readList(j);
  if(!list||!list.length){notice={t:'bad',x:'Tidak ada soal di dalam teks itu.'};confirmKey=null;return;}
  var errs=[];
  list.forEach(function(s,i){check(s).forEach(function(m){errs.push('Soal '+(i+1)+' ('+(s.judul||'tanpa judul')+'): '+m);});});
  if(errs.length){notice={t:'bad',x:'Impor dibatalkan. '+errs.slice(0,3).join(' ')+(errs.length>3?' …dan '+(errs.length-3)+' masalah lain.':'')};confirmKey=null;return;}
  if(impMode==='ganti'){
    if(confirmKey!=='imp'){confirmKey='imp';return;}
    data=list;
  }else{
    list.forEach(function(s){if(data.some(function(x){return x.id===s.id;}))s.id=freshId();data.push(s);});
  }
  confirmKey=null;impText='';
  var ok=persist();
  notice={t:ok?'ok':'bad',x:ok?list.length+' soal diimpor.':'Soal diimpor tetapi tidak bisa disimpan di perangkat ini.'};
  adminTab='list';
}

/* ---------- Render ---------- */
function render(){
  $('#top').innerHTML=topHtml();
  var h='';
  if(view==='home')h=homeHtml();
  else if(view==='play')h=playHtml();
  else h=adminHtml();
  $('#app').innerHTML=h;
  $('#foot').textContent=view==='home'?'Soal dikelola guru lewat tombol Admin.':'';
  if(fk){var el=document.querySelector('[data-fk="'+fk+'"]');if(el&&!el.disabled){try{el.focus({preventScroll:true});}catch(_){}}fk=null;}
  if(selectExport){selectExport=false;var ta=$('#exp');if(ta){ta.focus();ta.select();}}
  if(scrollTo){
    var s=document.getElementById(scrollTo);scrollTo=null;
    if(s){var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;s.scrollIntoView({behavior:rm?'auto':'smooth',block:'nearest'});}
  }
}

/* ---------- Aksi ---------- */
function copyExport(){
  var t=jsonText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){notice={t:'ok',x:'Teks soal.json sudah disalin.'};render();},function(){copyFail();});
  }else copyFail();
}
function copyFail(){notice={t:'info',x:'Salin otomatis tidak didukung. Teks sudah dipilih, tekan lama lalu pilih Salin.'};selectExport=true;render();}
function download(){
  try{
    var b=new Blob([jsonText()],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='soal.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    notice={t:'info',x:'Perintah unduh dikirim. Kalau berkas tidak muncul, pakai tombol Salin teks.'};
  }catch(e){notice={t:'info',x:'Unduh tidak tersedia di sini. Pakai tombol Salin teks.'};}
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  fk=b.dataset.fk||null;
  if(a==='a-benar'){D.rumus.forEach(function(r,i){r.benar=(i===+v);});return;}
  if(a==='a-mode'){impMode=v;confirmKey=null;return;}
  notice=notice&&a==='a-copy'?notice:null;
  if(a==='home'){view='home';previewFrom=null;sel=null;}
  else if(a==='play'){startPlay(v,data.find(function(s){return s.id===v;}));previewFrom=null;fk=null;window.scrollTo(0,0);}
  else if(a==='set-tingkat'){tingkat=v;store.set('cjs.tingkat',v);}
  else if(a==='set-kelas'){kelasSel=v;store.set('cjs.kelas',v);}
  else if(a==='tok')onToken(v);
  else if(a==='slot')onSlot(v);
  else if(a==='opt')onOpt(+v);
  else if(a==='check')onCheck();
  else if(a==='again'){delete done[cur];saveDone();startPlay(cur,SRC[cur]);fk=null;window.scrollTo(0,0);}
  else if(a==='next'){var n=nextUnsolvedId();if(n){startPlay(n,data.find(function(s){return s.id===n;}));fk=null;window.scrollTo(0,0);}else view='home';}
  else if(a==='a-open'){view='admin';adminTab='list';loginErr=false;confirmKey=null;fk=adminOK?null:'login';}
  else if(a==='a-login'){var pv=$('#pin');if(pv&&pv.value===pin){adminOK=true;loginErr=false;fk=null;}else{loginErr=true;fk='login';}}
  else if(a==='a-out'){adminOK=false;view='home';}
  else if(a==='a-tab'){adminTab=v;confirmKey=null;D=null;editId=null;formErr=null;}
  else if(a==='a-new'){D=blank();editId=null;formErr=null;adminTab='edit';fk=null;}
  else if(a==='a-edit'){var s0=data.find(function(s){return s.id===v;});D=toDraft(s0);editId=v;formErr=null;adminTab='edit';fk=null;window.scrollTo(0,0);}
  else if(a==='a-dup'){var s1=data.find(function(s){return s.id===v;});var c=JSON.parse(JSON.stringify(s1));c.id=freshId();c.judul=c.judul+' (salinan)';data.splice(data.indexOf(s1)+1,0,c);persist();notice={t:'ok',x:'Soal digandakan. Salinannya ada tepat di bawah.'};}
  else if(a==='a-up'){moveItem(v,-1);persist();}
  else if(a==='a-down'){moveItem(v,1);persist();}
  else if(a==='a-del'){confirmKey='del:'+v;fk='del-yes';}
  else if(a==='a-del-yes'){data=data.filter(function(s){return s.id!==v;});confirmKey=null;var ok=persist();notice={t:ok?'ok':'bad',x:ok?'Soal dihapus.':'Soal dihapus di layar tetapi tidak bisa disimpan di perangkat ini.'};fk=null;}
  else if(a==='a-cancel'){confirmKey=null;}
  else if(a==='a-cancel-edit'){adminTab='list';D=null;editId=null;formErr=null;fk=null;}
  else if(a==='a-add'){
    if(v==='besaran')D.besaran.push({teks:'',sym:'',nama:'',satuan:'',ket:'',konv:'',catatan:''});
    if(v==='pengecoh')D.pengecoh.push({teks:'',ket:''});
    if(v==='rumus')D.rumus.push({f:'',benar:false,alasan:''});
    if(v==='salah')D.hitung.salah.push({nilai:'',pesan:'',rumus:''});
    if(v==='variasi')D.variasi.push({nama:'',min:'',maks:'',langkah:'',rumus:''});
    var lst=v==='salah'?D.hitung.salah:D[v];scrollTo='row-'+v+'-'+(lst.length-1);fk=null;
  }
  else if(a==='a-rm'){
    var pr=v.split(':'),idx=+pr[1],lst2=pr[0]==='salah'?D.hitung.salah:D[pr[0]];
    lst2.splice(idx,1);
    if(pr[0]==='rumus'&&lst2.length&&!lst2.some(function(r){return r.benar;}))lst2[0].benar=true;
    fk=null;
  }
  else if(a==='a-save')doSave();
  else if(a==='a-preview'){
    var sp=fromDraft(D),er=check(sp);
    if(er.length){formErr=er;scrollTo='app';}
    else{formErr=null;sp.id='__prev';startPlay('__prev',sp);previewFrom='edit';window.scrollTo(0,0);fk=null;}
  }
  else if(a==='a-try'){startPlay('__prev',data.find(function(s){return s.id===v;}));previewFrom='list';window.scrollTo(0,0);fk=null;}
  else if(a==='a-back'){view='admin';adminTab=previewFrom==='edit'?'edit':'list';previewFrom=null;fk=null;}
  else if(a==='a-copy')copyExport();
  else if(a==='a-download')download();
  else if(a==='a-imp')doImport();
  else if(a==='a-pin'){var np=$('#pin1');if(np&&np.value.length>=4){pin=np.value;store.set(PINKEY,pin);notice={t:'ok',x:'PIN diganti.'};}else{notice={t:'bad',x:'PIN minimal 4 karakter.'};}}
  else if(a==='a-reset'){confirmKey='reset';}
  else if(a==='a-reset-yes'){store.del(KEY);confirmKey=null;load(true).then(function(){notice={t:'ok',x:'Ubahan dibuang. Sumber data sekarang: '+srcLabel()+'.'};render();});return;}
  else if(a==='a-clear-done'){done={};saveDone();notice={t:'ok',x:'Catatan selesai siswa di perangkat ini dihapus.'};}
  render();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.p&&D){setPath(D,t.dataset.p,t.value);}
  else if(t.id==='ans'){RS[cur].input=t.value;}
  else if(t.id==='imp'){impText=t.value;confirmKey=null;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='impf'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){impText=String(fr.result||'');confirmKey=null;render();};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  if(e.target.id==='ans'){e.preventDefault();onCheck();fk='check';render();}
  else if(e.target.id==='pin'){e.preventDefault();var pv=$('#pin');if(pv&&pv.value===pin){adminOK=true;loginErr=false;}else loginErr=true;render();}
});

/* ---------- Mulai ---------- */
(async function(){
  pin=store.get(PINKEY)||DEFPIN;
  try{done=JSON.parse(store.get(DONEKEY)||'{}')||{};}catch(e){done={};}
  await load(false);
  render();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
  }
})();
})();
</script>
